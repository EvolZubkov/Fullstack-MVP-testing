# =============================================================================
# nginx vhost for a test-builder instance — HTTPS.
#
# Written by scripts/deploy/deploy.sh once the certificate for the domain exists;
# the repo copy is the source of truth and every deploy rewrites the host file, so
# an edit made on the server survives only until the next deploy.
#
# The certificate is obtained with `certbot certonly --webroot`, NOT with the
# nginx installer plugin, deliberately: the plugin edits the vhost in place, and
# the next deploy — which rewrites that file from this template — would silently
# throw the TLS block away. Keeping issuance and configuration apart makes this
# file reproducible on every deploy.
#
# Placeholders: __SERVER_NAME__  __PROXY_PORT__  __ACME_WEBROOT__  __CERT_DIR__
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Renewals validate over plain HTTP, so the challenge location stays here and
    # is matched (^~) before the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_WEBROOT__;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 is deliberately NOT enabled here: the directive changed shape in nginx
    # 1.25 (`http2 on;` replaced `listen ... http2`), and a form the installed nginx
    # does not understand fails `nginx -t` and aborts the deploy. Add the variant
    # this server's version accepts if the extra multiplexing is ever worth it.
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Media, SCORM packages and design templates are uploaded through the app; the
    # default 1m would reject them with a bare 413 long before the app sees them.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:__PROXY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application trusts the proxy and reads this header to decide whether
        # the request was secure (server/index.ts). config/mirror.config.jsonc sets
        # cookieSecure=true, so without this header no session cookie survives and
        # a correct password looks wrong.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
