# =============================================================================
# nginx vhost for a test-builder instance — PLAIN HTTP.
#
# Written by scripts/deploy/deploy.sh with the placeholders substituted; the repo
# copy is the source of truth and every deploy rewrites the host file, so an edit
# made on the server survives only until the next deploy.
#
# This variant is used while the TLS certificate for the domain does not exist
# yet: it serves the ACME http-01 challenge from the webroot and proxies
# everything else, so certbot can validate the domain before the application has
# ever started. Once the certificate is issued deploy.sh replaces this file with
# nginx-site-tls.conf.
#
# Placeholders: __SERVER_NAME__  __PROXY_PORT__  __ACME_WEBROOT__
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # ACME http-01 challenge (certbot --webroot). Must stay reachable over plain
    # HTTP for renewals too — which is why the TLS variant keeps this block.
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_WEBROOT__;
        default_type "text/plain";
    }

    # Media, SCORM packages and design templates are uploaded through the app; the
    # default 1m would reject them with a bare 413 long before the app sees them.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:__PROXY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application trusts the proxy and reads this header to decide whether
        # the request was secure (server/index.ts). Without it every secure cookie
        # is dropped and nobody can log in.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
