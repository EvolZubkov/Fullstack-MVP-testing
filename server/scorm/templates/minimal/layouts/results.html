<div class="layout-results-wrap">
  <div class="card results-card">
    <div class="results-label">Результат теста</div>
    <div class="results-score">
      <span data-path="result.scorePercent"></span><span class="results-suffix">%</span>
    </div>
    <div class="results-status" data-path="result.status"></div>
    <div class="results-actions">
      <button type="button" class="btn btn--outline" data-action="restart">Пройти снова</button>
    </div>
  </div>
</div>
