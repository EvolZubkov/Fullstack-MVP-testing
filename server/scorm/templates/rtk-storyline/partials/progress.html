<div class="rtk-progress" data-progress-mode="{{ params.progress.mode }}" data-progress-current="{{ progress.active.current }}" data-progress-total="{{ progress.active.total }}">
  <div class="rtk-progress-dots" aria-hidden="true"></div>
  <div class="rtk-progress-text">
    <span>{{ progress.active.current }}</span>
    <span>/</span>
    <span>{{ progress.active.total }}</span>
  </div>
</div>
