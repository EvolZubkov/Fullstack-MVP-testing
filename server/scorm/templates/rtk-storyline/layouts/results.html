<section class="rtk-page rtk-page--results">
  <article class="rtk-results-card">
    <p class="rtk-kicker">{{ page.results.kicker }}</p>
    <h1>{{ page.title }}</h1>

    <div class="rtk-results-summary" data-slot="results-summary"></div>
    <div class="rtk-result-variables" data-slot="result-variables"></div>

    <div class="rtk-results-note" data-slot="content-body"></div>
  </article>
</section>
