<section class="rtk-page rtk-page--question rtk-page--question-ranking">
  <div class="rtk-question-meta">
    <p class="rtk-question-eyebrow">{{ page.question.topicTitle }}</p>
    <div class="rtk-question-counter" data-slot="question-counter"></div>
    <div class="rtk-question-timer" data-slot="timer"></div>
  </div>
  <article class="rtk-question-card">
    <div class="rtk-question-prompt" data-slot="question-prompt"></div>
    <div class="rtk-question-media" data-slot="question-media"></div>
    <div class="rtk-question-interaction" data-slot="question-interaction"></div>
    <div class="rtk-question-feedback" data-slot="question-feedback"></div>
  </article>
</section>
