<section class="rtk-page rtk-page--summary">
  <img class="rtk-content-decoration" src="{{ params.layout.contentDecoration }}" alt="" aria-hidden="true" />
  <article class="rtk-summary-card">
    <p class="rtk-kicker">{{ page.content.kicker }}</p>
    <h1>{{ page.title }}</h1>
    <div class="rtk-summary-grid">
      <div>
        <span class="rtk-summary-label">Статус темы</span>
        <strong>{{ page.summary.statusLabel }}</strong>
      </div>
      <div>
        <span class="rtk-summary-label">Правильных ответов</span>
        <strong>{{ page.summary.percent }}%</strong>
      </div>
      <div>
        <span class="rtk-summary-label">Вопросов</span>
        <strong>{{ page.summary.questionCount }}</strong>
      </div>
    </div>
    <div class="rtk-content-body" data-slot="content-body"></div>
  </article>
</section>
