<section class="rtk-page rtk-page--content">
  <img class="rtk-content-decoration" src="{{ params.layout.contentDecoration }}" alt="" aria-hidden="true" />
  <article class="rtk-content-card">
    <p class="rtk-kicker">{{ page.content.kicker }}</p>
    <h1>{{ page.title }}</h1>
    <p class="rtk-content-lead">{{ page.content.subtitle }}</p>
    <div class="rtk-content-body" data-slot="content-body"></div>
  </article>
</section>
