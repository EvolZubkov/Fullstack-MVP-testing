<section class="rtk-page rtk-page--system rtk-page--system-warning">
  <div class="rtk-system-overlay">
    <article class="rtk-system-card rtk-system-card--warning" role="alertdialog" aria-modal="true">
      <p class="rtk-kicker">Предупреждение</p>
      <h1>{{ page.title }}</h1>
      <p>{{ page.content.message }}</p>
      <div class="rtk-content-body" data-slot="content-body"></div>
    </article>
  </div>
</section>
