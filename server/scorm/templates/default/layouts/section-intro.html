<div class="tb-scene">
  <main class="tb-scene__body">
    <div class="tb-scene__col tb-scene__col--center">
      <span class="tb-eyebrow">{{ sectionIntro.eyebrow }}</span>
      <h2 class="tb-scene__hero" data-path="sectionIntro.topicName"></h2>
      {{#if sectionIntro.hasDescription}}<span class="tb-scene__lead" data-path="sectionIntro.description"></span>{{/if}}
      <div class="tb-meta-dots">
        <span class="tb-meta-dots__item"><span class="tb-meta-dots__dot" aria-hidden="true"></span>{{ sectionIntro.questionCountLabel }}</span>
        {{#if sectionIntro.hasTimeLimit}}<span class="tb-meta-dots__item"><span class="tb-meta-dots__dot" aria-hidden="true"></span>{{ sectionIntro.timeLimitLabel }}</span>{{/if}}
      </div>
      {{#if sectionIntro.hasInstruction}}
      <div class="tb-card">
        <span class="tb-card__head">Инструкция</span>
        <span class="tb-card__body" data-slot="instruction"></span>
      </div>
      {{/if}}
    </div>
  </main>
  <footer class="tb-scene__foot">
    <div class="tb-scene__foot-spacer"></div>
    <button type="button" class="ou-btn ou-btn--primary ou-btn--l" data-action="section-intro-continue">{{ sectionIntro.continueLabel }}</button>
  </footer>
</div>
