<div class="tb-scene">
  <main class="tb-scene__body">
    <div class="tb-scene__col tb-scene__col--center tb-scene__col--narrow">
      <span class="tb-eyebrow">Итоги раздела</span>
      <h2 class="tb-scene__hero tb-scene__hero--s">Раздел «<span data-path="sectionResult.topicName"></span>»</h2>

      <div class="ou-ring tb-ring">
        <svg class="ou-ring__svg" width="140" height="140" viewBox="0 0 140 140">
          <circle class="ou-ring__track" cx="70" cy="70" r="63" stroke-width="12"></circle>
          <circle class="ou-ring__fill {{ sectionResult.passClass }}" cx="70" cy="70" r="63" stroke-width="12" stroke-linecap="round" stroke-dasharray="395.84" stroke-dashoffset="{{ sectionResult.ringDashoffset }}"></circle>
        </svg>
        <div class="ou-ring__center">
          <div class="ou-ring__value"><span data-path="sectionResult.scorePercent"></span>%</div>
          <div class="ou-ring__label">баллы</div>
        </div>
      </div>

      {{#if sectionResult.summaryLabel}}<span class="tb-scene__note" data-path="sectionResult.summaryLabel"></span>{{/if}}
      {{#if sectionResult.hasVerdict}}<span class="ou-tag {{ sectionResult.passClass }}" data-path="sectionResult.statusLabel"></span>{{/if}}
    </div>
  </main>

  <footer class="tb-scene__foot">
    <div class="tb-scene__foot-spacer"></div>
    <button type="button" class="ou-btn ou-btn--primary ou-btn--l" data-action="section-continue">{{ sectionResult.continueLabel }}</button>
  </footer>
</div>
