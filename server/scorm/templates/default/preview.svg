<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- Scene model: fixed header + scrolling body + action panel. Accent = brand purple. -->
  <rect width="320" height="200" fill="hsl(225,7%,7%)"/>
  <!-- Fixed header: course title + accent underline -->
  <text x="20" y="28" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="hsl(0,0%,98%)">Основы информационной безопасности</text>
  <rect x="20" y="37" width="280" height="2" rx="1" fill="hsl(258,84%,63%)"/>
  <!-- Question meta + prompt -->
  <text x="20" y="57" font-family="Inter,sans-serif" font-size="9" fill="hsl(0,0%,58%)">Вопрос 2 из 4</text>
  <text x="20" y="75" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="hsl(0,0%,98%)">Какой пароль устойчивее к подбору?</text>
  <!-- Answer options as ou-radio-cards; the second is selected (accent) -->
  <rect x="20" y="88" width="280" height="24" rx="7" fill="hsl(225,14%,14%)" stroke="hsl(0,0%,22%)" stroke-width="1"/>
  <circle cx="35" cy="100" r="6" fill="none" stroke="hsl(0,0%,42%)" stroke-width="1.5"/>
  <text x="50" y="104" font-family="Inter,sans-serif" font-size="10" fill="hsl(0,0%,88%)">Дата рождения и инициалы</text>
  <rect x="20" y="118" width="280" height="24" rx="7" fill="hsl(258,52%,17%)" stroke="hsl(258,84%,63%)" stroke-width="1.5"/>
  <circle cx="35" cy="130" r="6" fill="none" stroke="hsl(258,84%,63%)" stroke-width="1.5"/>
  <circle cx="35" cy="130" r="3" fill="hsl(258,84%,63%)"/>
  <text x="50" y="134" font-family="Inter,sans-serif" font-size="10" fill="hsl(0,0%,98%)">Длинная фраза из несвязанных слов</text>
  <rect x="20" y="148" width="280" height="24" rx="7" fill="hsl(225,14%,14%)" stroke="hsl(0,0%,22%)" stroke-width="1"/>
  <circle cx="35" cy="160" r="6" fill="none" stroke="hsl(0,0%,42%)" stroke-width="1.5"/>
  <text x="50" y="164" font-family="Inter,sans-serif" font-size="10" fill="hsl(0,0%,88%)">Простой пароль qwerty</text>
  <!-- Fixed action panel: primary button -->
  <rect x="212" y="181" width="88" height="15" rx="5" fill="hsl(258,84%,63%)"/>
  <text x="256" y="191" font-family="Inter,sans-serif" font-size="8" font-weight="600" fill="hsl(0,0%,100%)" text-anchor="middle">Принять ответ</text>
</svg>
