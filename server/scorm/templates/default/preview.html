<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стандартный · preview</title>
  <style>
    :root{--pv-bg:#fff;--pv-fg:hsl(0 0% 9%);--pv-border:hsl(0 0% 89%);--pv-card:hsl(0 0% 98%);--pv-card-b:hsl(0 0% 94%);--pv-sidebar:hsl(0 0% 96%);--pv-sidebar-b:hsl(0 0% 92%);--pv-primary:hsl(217 91% 42%);--pv-muted:hsl(217 10% 92%);--pv-muted-fg:hsl(0 0% 35%);--pv-radius:9px;--pv-radius-sm:4px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;font-size:14px;background:#e5e7eb;color:var(--pv-fg);line-height:1.5}
    .shell{display:flex;background:var(--pv-bg);min-height:100vh}
    .pv-sidebar{width:224px;flex-shrink:0;background:var(--pv-sidebar);border-right:1px solid var(--pv-sidebar-b);display:flex;flex-direction:column;height:100vh}
    .pv-sidebar-head{padding:16px;border-bottom:1px solid var(--pv-sidebar-b);display:flex;align-items:center;gap:8px}
    .pv-logo{width:28px;height:28px;background:var(--pv-primary);border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
    .pv-app-name{font-size:13px;font-weight:600}
    .pv-main{flex:1;display:flex;flex-direction:column;min-width:0;filter:blur(1px);opacity:.4}
    .pv-topbar{border-bottom:1px solid var(--pv-border);padding:10px 20px;display:flex;align-items:center;gap:12px}
    .pv-test-title{font-size:15px;font-weight:600;flex:1}
    .pv-overlay{position:absolute;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
    .pv-dialog{background:var(--pv-bg);border-radius:var(--pv-radius);box-shadow:0 24px 64px rgba(0,0,0,.35);width:100%;max-width:1140px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
    .pv-dialog-head{padding:14px 20px;border-bottom:1px solid var(--pv-border);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .pv-dialog-title{font-size:15px;font-weight:600}
    .pv-dialog-sub{font-size:12px;color:var(--pv-muted-fg)}
    .pv-body{display:flex;flex:1;overflow:hidden;min-height:0}
    .pv-nav{width:220px;flex-shrink:0;border-right:1px solid var(--pv-border);overflow-y:auto;padding:6px 0;background:var(--pv-sidebar)}
    .pv-nav-item{display:block;width:calc(100% - 12px);margin:0 6px 1px;padding:7px 8px;border:0;border-radius:3px;background:transparent;color:var(--pv-fg);text-align:left;font:inherit;font-size:13px;cursor:pointer;transition:background .12s,color .12s}
    .pv-nav-item:hover{background:var(--pv-muted)}
    .pv-nav-item.pv-active{background:var(--pv-primary);color:#fff}
    .pv-stage-wrap{flex:1;overflow-y:auto;background:hsl(0 0% 91%);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px}
    .pv-stage{width:100%;max-width:960px;border-radius:var(--pv-radius-sm);overflow:hidden;box-shadow:0 2px 18px rgba(0,0,0,.14)}
    .pv-caption{font-size:11px;color:hsl(0 0% 55%)}
    .pv-dialog-foot{padding:10px 20px;border-top:1px solid var(--pv-border);display:flex;align-items:center;gap:12px;flex-shrink:0;color:var(--pv-muted-fg);font-size:12px}
    .pv-btn{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;height:32px;border-radius:var(--pv-radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--pv-border);background:var(--pv-bg);color:var(--pv-fg);font-family:inherit;margin-left:auto}
    @media(max-width:860px){.pv-sidebar{display:none}.pv-overlay{padding:8px}.pv-nav{width:100%;max-height:160px;border-right:0;border-bottom:1px solid var(--pv-border)}.pv-body{flex-direction:column}.pv-stage{max-width:100%}}
  </style>
  <style id="tpl-styles">/* styles/theme.css */
:root {
  --background: hsl(225 7% 7%);
  --foreground: hsl(0 0% 98%);
  --border: hsl(0 0% 22%);
  --card: hsl(225 14% 14%);
  --card-foreground: hsl(0 0% 98%);
  --card-border: hsl(0 0% 24%);
  --primary: hsl(217 91% 42%);
  --primary-foreground: hsl(0 0% 98%);
  --muted: hsl(225 10% 20%);
  --muted-foreground: hsl(0 0% 65%);
  --accent: hsl(225 8% 22%);
  --destructive: hsl(0 84% 52%);
  --success: hsl(142 76% 36%);
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 12px;
  --shadow: 0px 4px 16px rgba(0, 0, 0, 0.5);
}

/* styles/base.css */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--background);
  color: var(--foreground);
  line-height: 1.55;
  font-size: 15px;
}

::-webkit-scrollbar { width: 12px; }
::-webkit-scrollbar-track { background: var(--background); }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 6px; border: 2px solid var(--background); }
::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }

/* Player shell */
.tb-player {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--foreground);
}

.tb-progress-wrap { height: 4px; background: var(--muted); }
.tb-progress-bar { height: 100%; background: var(--primary); width: 0; transition: width 0.3s; }

.tb-content {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.tb-footer { display: none; }
.tb-spacer { flex: 1; }
.tb-btn--hidden { display: none; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  will-change: transform, opacity;
  animation: fadeIn 0.4s ease-out forwards;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 28px;
  height: auto;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--primary);
  font-family: var(--font-sans);
  white-space: nowrap;
  background: var(--primary);
  color: var(--primary-foreground);
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
}
.btn:hover {
  opacity: 0.9;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}
.btn:active { transform: translateY(0); box-shadow: none; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn--ghost {
  background: transparent;
  color: var(--muted-foreground);
  border-color: var(--border);
}
.btn--outline {
  background: transparent;
  color: var(--foreground);
  border-color: var(--border);
}

/* Progress bar */
.progress-bar {
  height: 10px;
  border-radius: 999px;
  background: var(--muted);
  overflow: hidden;
  margin-bottom: 28px;
}
.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Hide shell progress bar on question/content pages (the layout has its own) */
.tb-progress-wrap { display: none; }

/* Navigation row */
.navigation {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
}

/* Question header */
.q-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.q-title {
  font-size: 24px;
  font-weight: 600;
  color: var(--foreground);
  margin: 0;
}
.q-timer { font-size: 16px; color: var(--muted-foreground); }
.q-timer--hidden { display: none; }

/* Question layout */
.question-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 28px 32px;
  box-shadow: var(--shadow);
}

.question-meta {
  font-size: 13px;
  color: var(--muted-foreground);
  margin-bottom: 10px;
}

.question-text {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.7;
  color: var(--foreground);
  margin-bottom: 28px;
}

/* Answer options */
.option {
  display: flex;
  align-items: center;
  padding: 18px 22px;
  border: 2px solid var(--border);
  border-radius: 10px;
  margin-bottom: 12px;
  cursor: pointer;
  font-size: 15px;
  color: var(--foreground);
  background: var(--card);
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
}
.option:hover {
  border-color: var(--primary);
  background: var(--accent);
  transform: translateX(2px);
}
.option.selected {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, transparent);
}
.option input[type="radio"],
.option input[type="checkbox"] {
  flex-shrink: 0;
  margin-right: 14px;
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
  pointer-events: none;
}

/* Ranking: grip-based drag-and-drop */
.ranking-board { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.rank-item {
  -webkit-user-select: none;
  user-select: none;
  padding: 14px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: grab;
  min-width: 0;
}
.rank-item:active { cursor: grabbing; }
.rank-item.dragging { opacity: .7; }
.rank-item.is-over { outline: 2px solid var(--primary); outline-offset: 2px; }
.rank-draggable { cursor: grab; }
.rank-grip { flex: 0 0 auto; display: flex; align-items: center; opacity: .85; }
.rank-text { min-width: 0; white-space: normal; color: var(--foreground); opacity: .92; font-size: 14px; line-height: 1.35; }

/* Matching: chip-based drag-and-drop */
.matching-board { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.matching-line { display: flex; align-items: stretch; }
.matching-gap { flex: 0 0 18px; }
.match-tile {
  flex: 1 1 0;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  font-size: 14px;
  line-height: 1.35;
  color: var(--foreground);
}
.match-left-slot { justify-content: flex-start; gap: 10px; }
.match-right-tile { opacity: .92; white-space: normal; }
.match-empty {
  flex: 1 1 0;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  background: transparent;
  border: 1px dashed var(--border);
  display: flex;
  align-items: center;
}
.slot-placeholder { color: var(--muted-foreground); font-size: 13px; }
.match-chip {
  -webkit-user-select: none;
  user-select: none;
  width: 100%;
  padding: 10px 12px;
  color: var(--foreground);
  cursor: grab;
  font-size: 14px;
  line-height: 1.25;
  white-space: normal;
}
.match-chip:active { cursor: grabbing; }
.match-drop-right.is-over,
.match-drop-left.is-over { outline: 2px solid var(--primary); outline-offset: 2px; }
.matching-line.is-joined {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.matching-line.is-joined .match-tile,
.matching-line.is-joined .match-empty { background: transparent; border: 0; box-shadow: none; border-radius: 0; }
.matching-line.is-joined .match-left-slot { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
.matching-line.is-joined .match-right-tile { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

/* Start page */
.start-page { max-width: 600px; margin: 40px auto; padding: 0 18px; }
.start-header { padding: 32px; text-align: center; margin-bottom: 24px; }
.start-title { color: hsl(var(--foreground)); margin: 0; font-size: 28px; font-weight: 700; }
.start-description { color: hsl(var(--muted-foreground)); margin-top: 12px; margin-bottom: 0; font-size: 15px; }
.start-info { padding: 24px; }
.start-info-heading { margin: 0 0 20px; font-size: 18px; font-weight: 700; color: hsl(var(--foreground)); }
.start-info-grid { display: grid; gap: 12px; }
.info-row { display: flex; align-items: center; gap: 12px; padding: 16px; background: hsl(var(--muted)); border-radius: 12px; border: 1px solid hsl(var(--border)); }
.info-icon { flex-shrink: 0; display: flex; }
.info-icon--blue { color: #4f46e5; }
.info-icon--green { color: #16a34a; }
.info-icon--amber { color: #f59e0b; }
.info-icon--purple { color: #8b5cf6; }
.info-row-body { flex: 1; }
.info-row-label { font-weight: 600; color: hsl(var(--foreground)); font-size: 14px; }
.info-row-value { color: hsl(var(--muted-foreground)); font-size: 13px; margin-top: 2px; }
.start-actions { text-align: center; margin-top: 24px; }
.start-btn { padding: 14px 40px; font-size: 16px; font-weight: 600; height: auto; }

/* Layout wrappers */
.layout-content-wrap { max-width: 680px; margin: 0 auto; padding: 36px 24px; }
.layout-question-wrap { max-width: 680px; margin: 0 auto; padding: 36px 24px; }
.layout-results-wrap { max-width: 600px; margin: 40px auto; padding: 0 18px; }
.layout-blocked-wrap { max-width: 560px; margin: 60px auto; padding: 0 18px; text-align: center; }

/* Results page */
.results-page { max-width: 980px; margin: 28px auto 40px; padding: 0 18px; }

.results-hero { text-align: center; margin: 10px 0 22px; }
.results-hero-icon {
  width: 56px; height: 56px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  margin-bottom: 12px;
}
.results-hero-icon.is-pass { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); border-color: color-mix(in srgb, var(--success) 25%, transparent); }
.results-hero-icon.is-fail { color: var(--destructive); background: color-mix(in srgb, var(--destructive) 12%, transparent); border-color: color-mix(in srgb, var(--destructive) 25%, transparent); }
.results-hero-title { font-size: 40px; font-weight: 800; margin: 0; }
.results-hero-sub { margin-top: 8px; color: var(--muted-foreground); font-size: 16px; }

.results-main-card { padding: 22px 22px 18px; text-align: center; }
.results-main-title { font-size: 18px; font-weight: 800; margin: 0; }
.results-main-sub { margin-top: 8px; color: var(--muted-foreground); font-size: 14px; }

.results-ring { width: 140px; height: 140px; margin: 18px auto 10px; position: relative; }
.results-ring svg { width: 140px; height: 140px; transform: rotate(-90deg); }
.ring-bg { stroke: var(--muted); }
.ring-fg { stroke-dasharray: 395.84; stroke-dashoffset: var(--ring-offset, 0); transition: stroke-dashoffset .35s ease; }
.ring-fg.is-pass { stroke: var(--success); }
.ring-fg.is-fail { stroke: var(--destructive); }
.results-ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; transform: translateY(2px); }
.results-ring-pct { font-size: 38px; font-weight: 900; line-height: 1; }
.results-ring-label { margin-top: 4px; font-size: 13px; color: var(--muted-foreground); }

.results-stats { display: flex; justify-content: center; align-items: flex-end; gap: 22px; flex-wrap: wrap; margin-top: 10px; }
.results-stat { min-width: 90px; text-align: center; }
.results-stat .v { font-size: 22px; font-weight: 900; }
.results-stat .l { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }

.results-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 6px 12px; border-radius: 999px;
  font-weight: 800; font-size: 12px;
  border: 1px solid var(--border); height: 28px;
}
.results-pill.is-pass { background: color-mix(in srgb, var(--success) 18%, transparent); border-color: color-mix(in srgb, var(--success) 35%, transparent); color: var(--success); }
.results-pill.is-fail { background: color-mix(in srgb, var(--destructive) 18%, transparent); border-color: color-mix(in srgb, var(--destructive) 35%, transparent); color: var(--destructive); }

.results-section-title { margin: 28px 0 14px; font-size: 22px; font-weight: 900; }
.results-topics-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .results-topics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .results-topics-grid { grid-template-columns: 1fr; } }

.topic-card { padding: 18px; }
.topic-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.topic-name { font-weight: 900; font-size: 14px; }
.topic-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; }
.topic-row .k { color: var(--muted-foreground); }
.topic-row .val { font-weight: 700; }
.topic-bar { height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; margin-top: 12px; }
.topic-bar-fill { height: 100%; }
.topic-bar.is-pass .topic-bar-fill { background: var(--success); }
.topic-bar.is-fail .topic-bar-fill { background: var(--destructive); }

.results-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

/* Blocked page */
.blocked-card { padding: 40px; text-align: center; }
.blocked-icon { display: flex; justify-content: center; margin-bottom: 16px; color: var(--muted-foreground); }
.blocked-title { font-size: 22px; font-weight: 700; color: var(--foreground); margin: 0 0 12px; }
.blocked-description { color: var(--muted-foreground); font-size: 15px; margin: 0; }

/* Content pages */
.content-page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.content-placeholder--title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--foreground);
}
.content-placeholder--subtitle,
.content-placeholder--lead {
  font-size: 17px;
  color: var(--muted-foreground);
  line-height: 1.55;
}
.content-placeholder--body {
  font-size: 15px;
  color: var(--foreground);
  line-height: 1.65;
}
.content-placeholder--body p { margin-bottom: 12px; }
.content-placeholder--body p:last-child { margin-bottom: 0; }
.content-placeholder--heroImage,
.content-placeholder--image {
  width: 100%;
  height: 220px;
  border-radius: 8px;
  background: var(--muted);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.content-placeholder--heroImage img,
.content-placeholder--image img { width: 100%; height: 100%; object-fit: cover; }

/* Renderer styles */
.renderer--text-metric { display: flex; flex-direction: column; gap: 4px; }
.renderer__label { font-size: 13px; color: var(--muted-foreground); }
.renderer__value { font-size: 42px; font-weight: 700; color: var(--foreground); line-height: 1; }
.renderer__suffix { font-size: 24px; color: var(--muted-foreground); margin-left: 2px; }
.renderer__track { height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.renderer__fill { height: 100%; background: var(--primary); }
.renderer__ring-track { stroke: var(--muted); }
.renderer__ring-fill { stroke: var(--primary); }
</style>
  <style id="pv-fixes">
    /* Undo template global resets that break the preview chrome */
    html,body{overflow:auto!important;display:block!important;height:auto!important;min-height:100vh!important;background:#e5e7eb!important}
    /* Force top-level player elements to fill the stage container instead of the viewport.
       The template's own aspect-ratio rule (if any) is preserved — only width/max-width are fixed. */
    #pv-stage>*{position:relative!important;width:100%!important;max-width:100%!important;height:auto!important;max-height:none!important}
  </style>
</head>
<body>
<div id="s-preview" class="shell" style="position:relative;">
  <div class="pv-sidebar">
    <div class="pv-sidebar-head">
      <div class="pv-logo">TB</div>
      <div class="pv-app-name">Test Builder</div>
    </div>
  </div>
  <div class="pv-main">
    <div class="pv-topbar"><span class="pv-test-title">Основы информационной безопасности</span></div>
  </div>

  <div class="pv-overlay">
    <div class="pv-dialog">
      <div class="pv-dialog-head">
        <div class="pv-dialog-title">Шаблон «Стандартный» — элементы и их вид</div>
        <div class="pv-dialog-sub">Демо-данные · элементы управления работают</div>
      </div>

      <div class="pv-body">
        <nav class="pv-nav" id="pv-nav" aria-label="Навигация по элементам шаблона"></nav>

        <div class="pv-stage-wrap">
          <div class="pv-stage" id="pv-stage"></div>
          <div class="pv-caption" id="pv-caption">Стандартный</div>
        </div>
      </div>

      <div class="pv-dialog-foot">
        <span>10 экранов · 5 шаблонов контента · шаблон «Стандартный» v1.1.0</span>
        <button type="button" class="pv-btn">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── Manifest and demo data ── */
  window.PRD1_PREVIEW_MANIFEST  = {
  "id": "default",
  "name": "Стандартный",

};

  /* ── Shared helpers expected by contentPage.js ── */
  window.escapeHtml = function(v) {

<!-- PRD1 runtime: templateCore, renderers, contentPage -->
<script>/* server\scorm\template\app\templateCore.js */
/**
 * @module templateCore
 * @description TestBuilder Runtime Core — CSS variable application, placeholder
 * rendering, textFit modes, autoAdvance timer, and the window.TestBuilder API
 * consumed by design template scripts.
 *
 * Pure helper functions are exposed on TestBuilder._internal so they can be
 * unit-tested without a live DOM or SCORM session.
 */
(function (root) {
  "use strict";

  // ─── Path resolver ────────────────────────────────────────────────────────

  /**
   * Resolves a dot-notation path in an object.
   * @param {object} obj
   * @param {string} path
   * @returns {*}
   */
  function resolvePath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // ─── CSS variables ────────────────────────────────────────────────────────

  /**
   * Builds a { "--css-var": "value" } map from effective params and the
   * manifest param definitions that declare a cssVar property.
   * @param {object} params  Effective param values
   * @param {Array}  manifestParams  Array of param definitions from manifest
   * @returns {object}
   */
  function buildCssVarDeclarations(params, manifestParams) {
    var result = {};
    if (!manifestParams || !params) return result;
    var defaultCssVars = {
      primaryColor: "--primary",
      backgroundColor: "--background",
      foregroundColor: "--foreground",
      cardColor: "--card",
      cardBorderColor: "--card-border",
      borderColor: "--border",
      mutedColor: "--muted",
      accentColor: "--accent",
      fontFamily: "--font-sans"
    };
    manifestParams.forEach(function (def) {
      var cssVar = def.cssVar || defaultCssVars[def.key];
      if (!cssVar) return;
      var value = resolvePath(params, def.key);
      if (value === null || value === undefined) value = def.default;
      if (value === null || value === undefined) return;
      var cssValue =
        typeof value === "number"
          ? String(value) + (def.cssUnit || "px")
          : String(value);
      result[cssVar] = cssValue;
    });
    return result;
  }

  /**
   * Applies CSS custom properties derived from params to document.documentElement.
   * @param {object} params
   * @param {Array}  manifestParams
   */
  function applyCssVarsToRoot(params, manifestParams) {
    var vars = buildCssVarDeclarations(params, manifestParams);
    var el =
      typeof document !== "undefined" ? document.documentElement : null;
    if (!el) return;
    Object.keys(vars).forEach(function (name) {
      el.style.setProperty(name, vars[name]);
    });
  }

  // ─── textFit ──────────────────────────────────────────────────────────────

  /**
   * Returns true when an element's content overflows its box.
   * @param {Element} el
   * @returns {boolean}
   */
  function isOverflowing(el) {
    return (
      el.scrollHeight > el.clientHeight + 1 ||
      el.scrollWidth > el.clientWidth + 1
    );
  }

  /**
   * Applies a textFit configuration to a DOM element.
   *
   * Modes:
   *   fixed      — sets font-size to defaultFontSize (or authorFontSize when
   *                allowAuthorFontSize is true). Warns on overflow.
   *   autoFitFont — shrinks font-size from maxFontSize down to minFontSize
   *                until the element no longer overflows.
   *   growBox    — sets font-size to defaultFontSize and lets the element's
   *                height grow. Caps at maxHeight if specified.
   *
   * @param {Element} el
   * @param {object}  config   textFit definition from the placeholder schema
   * @param {number|null} authorFontSize  Author-chosen font size (optional)
   */
  function applyTextFit(el, config, authorFontSize) {
    if (!el || !config) return;
    var mode = config.mode || "fixed";
    var useAuthor =
      config.allowAuthorFontSize &&
      authorFontSize !== null &&
      authorFontSize !== undefined;
    var defaultSize = useAuthor
      ? authorFontSize
      : config.defaultFontSize || 16;

    if (mode === "fixed") {
      el.style.fontSize = defaultSize + "px";
      if (config.overflow === "warn" && isOverflowing(el)) {
        console.warn("[textFit:fixed] overflow on element", el);
      }
      return;
    }

    if (mode === "autoFitFont") {
      var max = config.maxFontSize || defaultSize;
      var min = config.minFontSize || 8;
      el.style.fontSize = max + "px";
      var size = max;
      while (size > min && isOverflowing(el)) {
        size -= 0.5;
        el.style.fontSize = size.toFixed(2) + "px";
      }
      if (config.overflow === "warn" && isOverflowing(el)) {
        console.warn("[textFit:autoFitFont] overflow after shrink", el);
      }
      return;
    }

    if (mode === "growBox") {
      el.style.fontSize = defaultSize + "px";
      el.style.height = "auto";
      if (config.maxHeight) {
        el.style.maxHeight = config.maxHeight + "px";
        el.style.overflowY = "auto";
      }
    }
  }

  // ─── Placeholder rendering ────────────────────────────────────────────────

  var _escapeHtml =
    typeof escapeHtml === "function"
      ? escapeHtml
      : function (s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        };

  /**
   * Converts a raw placeholder value to safe HTML ready for innerHTML.
   * richText / html bypass escaping (already sanitized server-side).
   * @param {string} type
   * @param {*} value
   * @returns {string}
   */
  function renderPlaceholderHtml(type, value) {
    if (value === null || value === undefined || value === "") return "";
    switch (type) {
      case "text":
      case "textarea":
        return _escapeHtml(String(value)).replace(/\n/g, "<br>");
      case "richText":
      case "html":
        return String(value);
      case "number":
        return _escapeHtml(String(value));
      case "image":
        return (
          '<img src="' +
          _escapeHtml(String(value)) +
          '" alt="" style="max-width:100%;max-height:100%;">'
        );
      case "boolean":
        return value ? "&#10003;" : "";
      default:
        return _escapeHtml(String(value));
    }
  }

  /**
   * Fills [data-placeholder] elements inside root according to the content
   * template definition, then applies textFit to each.
   * @param {Element} root
   * @param {object}  contentTemplate  Entry from manifest.contentTemplates[]
   * @param {object}  values           Plain values map
   * @param {object}  placeholderStyles  { key: { fontSize: number } }
   */
  function fillPlaceholders(root, contentTemplate, values, placeholderStyles) {
    if (!root || !contentTemplate || !contentTemplate.placeholders) return;
    values = values || {};
    placeholderStyles = placeholderStyles || {};

    contentTemplate.placeholders.forEach(function (phDef) {
      var key = phDef.key;
      var el = root.querySelector('[data-placeholder="' + key + '"]');
      if (!el) return;

      var value = values[key];
      el.innerHTML = renderPlaceholderHtml(phDef.type, value);

      if (phDef.textFit) {
        var style = placeholderStyles[key] || {};
        applyTextFit(el, phDef.textFit, style.fontSize || null);
      }
    });
  }

  function renderPathOnlyDsl(root, data) {
    if (!root) return;
    var nodes = root.querySelectorAll("[data-path]");
    nodes.forEach(function (el) {
      var path = el.getAttribute("data-path");
      var value = resolvePath(data || {}, path);
      el.textContent = value === null || value === undefined ? "" : String(value);
    });
  }

  function fillControlledSlots(root, slots) {
    if (!root || !slots) return;
    Object.keys(slots).forEach(function (slotName) {
      var el = root.querySelector('[data-slot="' + slotName + '"]');
      if (el) el.innerHTML = slots[slotName] || "";
    });
  }

  // ─── autoAdvance ──────────────────────────────────────────────────────────

  var _autoAdvanceTimer = null;

  /**
   * Starts the autoAdvance countdown. Calls onComplete when the timer fires.
   * Only one timer can be active; any previous one is cancelled.
   * @param {number}   delayMs
   * @param {Function} onComplete
   */
  function startAutoAdvance(delayMs, onComplete) {
    cancelAutoAdvance();
    _autoAdvanceTimer = setTimeout(function () {
      _autoAdvanceTimer = null;
      if (typeof onComplete === "function") onComplete();
    }, delayMs);
  }

  /** Cancels any pending autoAdvance timer. */
  function cancelAutoAdvance() {
    if (_autoAdvanceTimer !== null) {
      clearTimeout(_autoAdvanceTimer);
      _autoAdvanceTimer = null;
    }
  }

  // ─── Event emitter ────────────────────────────────────────────────────────

  var _listeners = {};

  function on(event, handler) {
    if (!_listeners[event]) _listeners[event] = [];
    _listeners[event].push(handler);
  }

  function emit(event, data) {
    (_listeners[event] || []).forEach(function (h) {
      try {
        h(data);
      } catch (e) {
        console.warn("[TestBuilder] handler error for " + event + ":", e);
      }
    });
  }

  // ─── TestBuilder API ──────────────────────────────────────────────────────

  var _contextParams = {};

  /**
   * Reads effective params from TEST_DATA.designSettings.params (safe: works
   * even before TEST_DATA is defined, returns {}).
   */
  function _readParams() {
    try {
      if (
        typeof TEST_DATA !== "undefined" &&
        TEST_DATA.designSettings &&
        TEST_DATA.designSettings.params
      ) {
        return TEST_DATA.designSettings.params;
      }
    } catch (_) {}
    return {};
  }

  root.TestBuilder = {
    /** Read-only context for template scripts. */
    context: {
      get: function () {
        return { params: _contextParams };
      }
    },

    /** Template lifecycle event emitter. */
    template: { on: on, emit: emit },

    /** SCORM commit proxy (template scripts call this instead of SCORM directly). */
    scorm: {
      commit: function () {
        if (typeof SCORM !== "undefined" && typeof SCORM.commit === "function") {
          SCORM.commit();
        }
      }
    },

    /** UI helpers for template scripts. */
    ui: {
      modal: function (opts) {
        console.warn("[TestBuilder.ui.modal]", opts);
      },
      toast: function (msg) {
        console.warn("[TestBuilder.ui.toast]", msg);
      }
    },

    /**
     * Called by bootstrap once TEST_DATA is available and the design template
     * manifest has been loaded/embedded.
     * @param {Array} manifestParams  Param definitions from the template manifest
     */
    _init: function (manifestParams) {
      _contextParams = _readParams();
      applyCssVarsToRoot(_contextParams, manifestParams || []);
    },

    /** Pure helpers exposed for unit testing. */
    _internal: {
      resolvePath: resolvePath,
      buildCssVarDeclarations: buildCssVarDeclarations,
      applyCssVarsToRoot: applyCssVarsToRoot,
      applyTextFit: applyTextFit,
      isOverflowing: isOverflowing,
      renderPlaceholderHtml: renderPlaceholderHtml,
      fillPlaceholders: fillPlaceholders,
      renderPathOnlyDsl: renderPathOnlyDsl,
      fillControlledSlots: fillControlledSlots,
      startAutoAdvance: startAutoAdvance,
      cancelAutoAdvance: cancelAutoAdvance
    }
  };
})(typeof window !== "undefined" ? window : global);


/* server\scorm\template\app\render\renderers.js */
/**
 * @module renderers
 * @description Built-in renderer plugins for resultField placeholders.
 *
 * Each renderer is a pure function:
 *   render(value, path, rendererOptions) → HTML string
 *
 * Renderers do NOT access SCORM API and do NOT mutate runtime state.
 * The registry is exposed on window.TestBuilder.renderers (added by this module).
 *
 * Built-in IDs: core.textMetric, core.badge, core.progressBar,
 *               core.ringChart, core.segmentedProgress.
 */
(function (root) {
  "use strict";

  var _esc =
    typeof escapeHtml === "function"
      ? escapeHtml
      : function (s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        };

  function clamp(v, min, max) {
    return Math.min(Math.max(Number(v) || 0, min), max);
  }

  // ─── core.textMetric ─────────────────────────────────────────────────────

  /**
   * Renders a numeric (or text) value with an optional label.
   * Options: { label?: string, suffix?: string, decimals?: number }
   */
  function textMetric(value, rendererOptions) {
    var opts = rendererOptions || {};
    var label = opts.label ? _esc(String(opts.label)) : "";
    var suffix = opts.suffix ? _esc(String(opts.suffix)) : "";
    var decimals =
      opts.decimals !== undefined ? Number(opts.decimals) : null;
    var display =
      value === null || value === undefined
        ? "—"
        : decimals !== null
        ? _esc(Number(value).toFixed(decimals))
        : _esc(String(value));

    return (
      '<div class="renderer renderer--text-metric">' +
      (label ? '<div class="renderer__label">' + label + "</div>" : "") +
      '<div class="renderer__value">' +
      display +
      (suffix ? '<span class="renderer__suffix">&thinsp;' + suffix + "</span>" : "") +
      "</div>" +
      "</div>"
    );
  }

  // ─── core.badge ──────────────────────────────────────────────────────────

  /**
   * Renders a status badge.
   * Options: {
   *   passed?: { value: string, label: string },
   *   failed?: { value: string, label: string },
   *   default?: string
   * }
   * `value` is compared to opts.passed.value / opts.failed.value.
   */
  function badge(value, rendererOptions) {
    var opts = rendererOptions || {};
    var strValue = String(value);
    var tone = "neutral";
    var label = _esc(strValue);

    if (opts.passed && String(opts.passed.value) === strValue) {
      tone = "passed";
      label = opts.passed.label ? _esc(String(opts.passed.label)) : label;
    } else if (opts.failed && String(opts.failed.value) === strValue) {
      tone = "failed";
      label = opts.failed.label ? _esc(String(opts.failed.label)) : label;
    } else if (opts.default) {
      label = _esc(String(opts.default));
    }

    return (
      '<span class="renderer renderer--badge renderer--badge-' +
      _esc(tone) +
      '">' +
      label +
      "</span>"
    );
  }

  // ─── core.progressBar ────────────────────────────────────────────────────

  /**
   * Renders a horizontal progress bar.
   * Options: { label?: string, showValue?: boolean, decimals?: number }
   * `value` must be 0–100 (percent).
   */
  function progressBar(value, rendererOptions) {
    var opts = rendererOptions || {};
    var pct = clamp(value, 0, 100);
    var label = opts.label ? _esc(String(opts.label)) : "";
    var decimals = opts.decimals !== undefined ? Number(opts.decimals) : 0;
    var display = pct.toFixed(decimals) + "%";

    return (
      '<div class="renderer renderer--progress-bar">' +
      (label ? '<div class="renderer__label">' + label + "</div>" : "") +
      '<div class="renderer__track">' +
      '<div class="renderer__fill" style="width:' +
      pct.toFixed(2) +
      '%"></div>' +
      "</div>" +
      (opts.showValue
        ? '<div class="renderer__value">' + _esc(display) + "</div>"
        : "") +
      "</div>"
    );
  }

  // ─── core.ringChart ──────────────────────────────────────────────────────

  /**
   * Renders an SVG ring (donut) chart.
   * Options: { label?: string, showValue?: boolean, decimals?: number,
   *            size?: number, strokeWidth?: number }
   * `value` must be 0–100.
   */
  function ringChart(value, rendererOptions) {
    var opts = rendererOptions || {};
    var pct = clamp(value, 0, 100);
    var size = Number(opts.size) || 120;
    var sw = Number(opts.strokeWidth) || 10;
    var r = (size - sw) / 2;
    var circumference = 2 * Math.PI * r;
    var filled = (pct / 100) * circumference;
    var label = opts.label ? _esc(String(opts.label)) : "";
    var decimals = opts.decimals !== undefined ? Number(opts.decimals) : 0;
    var display = pct.toFixed(decimals) + "%";
    var cx = size / 2;
    var cy = size / 2;

    return (
      '<div class="renderer renderer--ring-chart">' +
      (label ? '<div class="renderer__label">' + label + "</div>" : "") +
      '<svg class="renderer__ring" width="' +
      size +
      '" height="' +
      size +
      '" viewBox="0 0 ' +
      size +
      " " +
      size +
      '" aria-hidden="true">' +
      '<circle class="renderer__ring-track" cx="' +
      cx +
      '" cy="' +
      cy +
      '" r="' +
      r +
      '" fill="none" stroke-width="' +
      sw +
      '"/>' +
      '<circle class="renderer__ring-fill" cx="' +
      cx +
      '" cy="' +
      cy +
      '" r="' +
      r +
      '" fill="none" stroke-width="' +
      sw +
      '"' +
      ' stroke-dasharray="' +
      filled.toFixed(2) +
      " " +
      circumference.toFixed(2) +
      '"' +
      ' stroke-dashoffset="0"' +
      ' transform="rotate(-90 ' +
      cx +
      " " +
      cy +
      ')"/>' +
      "</svg>" +
      (opts.showValue
        ? '<div class="renderer__value">' + _esc(display) + "</div>"
        : "") +
      "</div>"
    );
  }

  // ─── core.segmentedProgress ──────────────────────────────────────────────

  /**
   * Renders a row of filled/empty segments.
   * Options: { segments?: number, label?: string, showValue?: boolean }
   * `value` must be 0–100.
   */
  function segmentedProgress(value, rendererOptions) {
    var opts = rendererOptions || {};
    var pct = clamp(value, 0, 100);
    var total = Math.max(Number(opts.segments) || 10, 1);
    var filled = Math.round((pct / 100) * total);
    var label = opts.label ? _esc(String(opts.label)) : "";
    var segs = "";
    for (var i = 0; i < total; i++) {
      segs +=
        '<span class="renderer__segment' +
        (i < filled ? " is-filled" : "") +
        '"></span>';
    }
    return (
      '<div class="renderer renderer--segmented-progress">' +
      (label ? '<div class="renderer__label">' + label + "</div>" : "") +
      '<div class="renderer__segments">' +
      segs +
      "</div>" +
      (opts.showValue
        ? '<div class="renderer__value">' +
          _esc(pct.toFixed(0) + "%") +
          "</div>"
        : "") +
      "</div>"
    );
  }

  // ─── Registry ─────────────────────────────────────────────────────────────

  /**
   * Renders a resultField value using the registered renderer.
   * Falls back to core.textMetric and logs a warning when the renderer is
   * missing or throws.
   *

/**

 * @description Renders a content page using the current design template's
 * content template definition. Handles placeholder filling, textFit, and
 * autoAdvance.
 *
 * Depends on: templateCore (window.TestBuilder._internal),
 *             renderers (window.TestBuilder.renderers),
 *             escapeHtml, TEST_DATA globals.
 */

/**
 * Finds the content template definition for a given page.
 * @param {object} page  A content page from TEST_DATA.contentPages
 * @param {Array}  contentTemplates  From the design template manifest
 * @returns {object|null}

  if (!page || !contentTemplates) return null;
  var key = page.templateKey;
  if (!key) return null;
  for (var i = 0; i < contentTemplates.length; i++) {
    if (contentTemplates[i].key === key) return contentTemplates[i];

  return null;

 * Builds a fallback HTML structure for a content page when no content
 * template definition is available.
 * @param {object} page
 * @returns {string}

  var typeLabel = page.type || "content";
  var values = getPageValues(page);
  if (page.mode === "html" && values.__html) {
    return '<div class="content-page content-page--html">' + String(values.__html) + "</div>";
  }
  var title = values.title || values.heading || typeLabel;
  var body = values.body || values.text || values.subtitle || "";
  return (
    '<div class="content-page content-page--fallback" data-page-type="' +
    escapeHtml(typeLabel) +
    '">' +
    '<div class="card">' +
    '<h1>' + escapeHtml(String(title)) + '</h1>' +
    (body ? '<div style="color:hsl(var(--muted-foreground));">' + String(body) + '</div>' : '') +
    '</div>' +
    "</div>"
  );
}

/**
 * Builds the HTML skeleton for a content page based on its content template
 * placeholders. Each placeholder becomes a [data-placeholder] div that will
 * be filled by fillPlaceholders().
 * @param {object} page
 * @param {object} contentTemplate
 * @returns {string}
 */
function buildContentPageSkeleton(page, contentTemplate) {
  if (!contentTemplate || !contentTemplate.placeholders) {
    return buildFallbackContentHtml(page);
  }
  var html =
    '<div class="content-page content-page--' +
    escapeHtml(page.type || "info") +
    '" data-template-key="' +
    escapeHtml(contentTemplate.key) +
    '">';
  contentTemplate.placeholders.forEach(function (phDef) {
    html +=
      '<div class="content-placeholder content-placeholder--' +
      escapeHtml(phDef.key) +
      '" data-placeholder="' +
      escapeHtml(phDef.key) +
      '"></div>';
  });
  html += "</div>";
  return html;
}

/**
 * Renders a resultField placeholder using the renderers module.
 * @param {Element} el
 * @param {object}  phDef
 * @param {*}       value
 * @param {object}  contentTemplate
 */
function fillResultFieldPlaceholder(el, phDef, value, contentTemplate) {
  if (!value || typeof value !== "object") {
    el.innerHTML = "";
    return;
  }
  var allowedRenderers = phDef.allowedRenderers
    ? new Set(phDef.allowedRenderers)
    : null;

  // value is the raw resultField object { path, renderer, rendererOptions, label }
  var tb = typeof window !== "undefined" ? window.TestBuilder : null;
  var rendererFn = tb && tb.renderers ? tb.renderers.render : null;
  if (!rendererFn) {
    el.innerHTML = escapeHtml(String(value.path || ""));
    return;
  }
  el.innerHTML = rendererFn(
    value,
    typeof TEST_DATA !== "undefined" ? TEST_DATA : {},
    allowedRenderers

function getPageValues(page) {
  if (!page) return {};
  if (page.valuesJson && page.valuesJson.values) return page.valuesJson.values;
  return page.values || {};
}

function getPagePlaceholderStyles(page) {
  if (!page) return {};
  if (page.valuesJson && page.valuesJson.placeholderStyles) return page.valuesJson.placeholderStyles;
  return page.placeholderStyles || {};
}

/**
 * Renders a content page into the #app element.
 * @param {object} page             Entry from TEST_DATA.contentPages
 * @param {Array}  contentTemplates Array from the design template manifest
 */
function renderContentPage(page, contentTemplates) {
  var app = document.getElementById("app");
  if (!app) return;

  // Cancel any previous autoAdvance timer
  var tb = typeof window !== "undefined" ? window.TestBuilder : null;
  if (tb && tb._internal) tb._internal.cancelAutoAdvance();

  var contentTemplate = findContentTemplate(page, contentTemplates);
  var values = getPageValues(page);
  var placeholderStyles = getPagePlaceholderStyles(page);

  app.innerHTML = buildContentPageSkeleton(page, contentTemplate);

  if (contentTemplate && tb && tb._internal) {
    // Handle resultField separately; delegate rest to fillPlaceholders
    var nonResultPlaceholders = (contentTemplate.placeholders || []).filter(
      function (ph) {
        return ph.type !== "resultField";
      }
    );
    var resultPlaceholders = (contentTemplate.placeholders || []).filter(
      function (ph) {
        return ph.type === "resultField";
      }
    );

    var syntheticCt = Object.assign({}, contentTemplate, {
      placeholders: nonResultPlaceholders
    });
    tb._internal.fillPlaceholders(app, syntheticCt, values, placeholderStyles);

    resultPlaceholders.forEach(function (phDef) {
      var el = app.querySelector('[data-placeholder="' + phDef.key + '"]');
      if (el) fillResultFieldPlaceholder(el, phDef, values[phDef.key], contentTemplate);
    });

    tb._internal.renderPathOnlyDsl(app, typeof TEST_DATA !== "undefined" ? TEST_DATA : {});
  }

  // autoAdvance
  if (page.autoAdvance && page.autoAdvanceDelayMs && tb && tb._internal) {
    tb._internal.startAutoAdvance(page.autoAdvanceDelayMs, function () {
      if (typeof advancePageSequence === "function") advancePageSequence();
      else if (typeof next === "function") next();
    });
  }

  var nav = document.createElement("div");
  nav.className = "navigation";
  nav.style.justifyContent = "flex-end";
  nav.innerHTML = '<button class="btn" data-nav="next" onclick="advancePageSequence()">Далее</button>';
  app.appendChild(nav);

  // Template lifecycle event
  if (tb && tb.template) {
    tb.template.emit("page:enter", { page: page });
  }
}

<!-- Preview bootstrap: nav, routing, DSL, question interactions -->
<script>/**
 * @module _preview-bootstrap
 * @description Browser-side bootstrap for template preview.html files.
 *
 * Reads globals injected by the generator:
 *   window.PRD1_PREVIEW_MANIFEST  — parsed manifest.json
 *   window.PRD1_PREVIEW_DEMO_DATA — parsed demo/course.json
 *   window.PRD1_PREVIEW_LAYOUTS   — { layoutKey: htmlString, ... }
 *   window.PRD1_PREVIEW_STYLES    — concatenated template CSS (already in <style>)
 *
 * Depends on PRD1 runtime globals (also injected by generator):
 *   window.TestBuilder   — from templateCore.js
 *   window.renderContentPage, buildContentPageSkeleton — from contentPage.js
 *   window.TEST_DATA     — set by this bootstrap from demo data
 *   window.escapeHtml    — injected by generator
 */
(function (root) {
  "use strict";

  // ─── Globals (set by generator) ─────────────────────────────────────────────
  var manifest = root.PRD1_PREVIEW_MANIFEST || {};
  var demoData = root.PRD1_PREVIEW_DEMO_DATA || {};
  var layouts  = root.PRD1_PREVIEW_LAYOUTS  || {};

  // ─── Path resolver (same as templateCore, but standalone) ───────────────────
  function resolvePath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // ─── Param expander ──────────────────────────────────────────────────────────
  /** Expands flat dot-notation param keys (e.g. "layout.heroImage") into nested objects. */
  function expandParams(flat) {
    var result = {};
    Object.keys(flat).forEach(function (k) {
      var v = flat[k];
      if (k.indexOf(".") === -1) { result[k] = v; return; }
      var parts = k.split(".");
      var cur = result;
      for (var i = 0; i < parts.length - 1; i++) {
        if (typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
        cur = cur[parts[i]];

  // ─── DSL renderer ────────────────────────────────────────────────────────────
  /** Renders the path-only DSL (`{{ path }}`, `{{#if}}`, `{{#unless}}`) in an HTML string. */
  function renderDsl(html, data) {
    // {{#unless path}}...{{/unless}}
    html = html.replace(/\{\{#unless ([^}]+)\}\}([\s\S]*?)\{\{\/unless\}\}/g, function (_, p, inner) {
      var v = resolvePath(data, p.trim());
      return (!v) ? inner : "";
    });
    // {{#if path}}...{{/if}}
    html = html.replace(/\{\{#if ([^}]+)\}\}([\s\S]*?)\{\{\/if\}\}/g, function (_, p, inner) {
      var v = resolvePath(data, p.trim());
      return v ? inner : "";
    });
    // {{#each path}}...{{/each}}
    html = html.replace(/\{\{#each ([^}]+)\}\}([\s\S]*?)\{\{\/each\}\}/g, function (_, p, inner) {
      var arr = resolvePath(data, p.trim());
      if (!Array.isArray(arr)) return "";
      return arr.map(function (item) {
        return inner.replace(/\{\{\s*(\w+)\s*\}\}/g, function (_, key) {
          var v = item[key];
          return v !== undefined && v !== null ? escapeHtml(String(v)) : "";
        });
      }).join("");
    });

    html = html.replace(/\{\{\s*([^#/][^}]*?)\s*\}\}/g, function (_, p) {
      var v = resolvePath(data, p.trim());
      return v !== undefined && v !== null ? escapeHtml(String(v)) : "";
    });
    return html;
  }

  /** Fills [data-path] elements inside a root element. */
  function fillDataPaths(root, data) {
    root.querySelectorAll("[data-path]").forEach(function (el) {
      var path = el.getAttribute("data-path");
      var v = resolvePath(data, path);
      if (v !== undefined && v !== null) el.textContent = String(v);
    });
  }

  // ─── Shell & stage helpers ───────────────────────────────────────────────────
  var _stage = null;

  function getStage() {
    if (!_stage) _stage = document.getElementById("pv-stage");
    return _stage;
  }

  function getApp() {
    var stage = getStage();
    return stage ? stage.querySelector("#app") : null;
  }

  /** Injects rendered shell into the stage (called once on init). */
  function buildShell() {
    var stage = getStage();
    if (!stage) return;
    var shellHtml = layouts["shell"] || "";
    // Resolve Handlebars-style partials: {{> partialName }}

  /** Builds the data object for DSL rendering (merges course + runtime + params). */
  function buildDslData() {
    var course  = demoData.course  || {};
    var runtime = demoData.runtime || {};
    var state   = runtime.state   || {};
    var currentTopicId = state.currentTopicId || "";

    // Build sections array for {{#each sections}} in topic-nav partial
    var sections = (course.topics || []).map(function (t) {
      var cls = t.status === "completed" ? "is-complete" :
                (t.id === currentTopicId || t.status === "available") ? "is-active" : "is-locked";
      return { id: t.id, title: t.title || "", className: cls };
    });

    return {
      course:   course,
      runtime:  runtime,
      result:   runtime.result   || {},
      progress: runtime.progress || {},
      state:    state,
      params:   expandParams(demoData.params || paramDefaults()),
      sections: sections,
      nav: {
        submitAnswerLabel: "Принять ответ",
        finishLabel:       "Завершить тест",
        nextLabel:         "Далее"
      },
      page: {
        title:   course.title || "",
        content: {},
        results: { kicker: "Результаты теста" }
      }
    };
  }

  // ─── TEST_DATA for contentPage.js / renderers.js ────────────────────────────
  function buildTestData() {
    var runtime = demoData.runtime || {};
    return Object.assign({}, runtime, {
      designSettings: {
        templateId: manifest.id,
        params: demoData.params || paramDefaults()
      }
    });
  }

  // ─── Navigation ──────────────────────────────────────────────────────────────
  function buildNav() {
    var nav = document.getElementById("pv-nav");
    if (!nav) return;
    var routes = (manifest.preview || {}).routes || [];
    var html = "";
    routes.forEach(function (r, i) {
      html += '<button type="button" class="pv-nav-item' + (i === 0 ? " pv-active" : "") + '" data-route="' + escapeHtml(r.route) + '">' + escapeHtml(r.label) + "</button>";
    });
    nav.innerHTML = html;
    nav.addEventListener("click", function (e) {
      var btn = e.target.closest(".pv-nav-item");
      if (!btn) return;
      var route = btn.getAttribute("data-route");
      nav.querySelectorAll(".pv-nav-item").forEach(function (el) { el.classList.remove("pv-active"); });
      btn.classList.add("pv-active");

    });
  }

  // ─── Route navigation ────────────────────────────────────────────────────────
  function navigateTo(route, btn) {
    var routes = (manifest.preview || {}).routes || [];
    var routeDef = null;
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].route === route) { routeDef = routes[i]; break; }
    }

    updateCaption(label);

    if (route === "start") {
      renderLayoutPage("start", buildDslData());
    } else if (route.indexOf("content.") === 0 || route === "content") {
      renderContentRoute(routeDef);
    } else if (route.indexOf("question.") === 0) {
      renderQuestionRoute(routeDef, route);
    } else if (route === "results") {
      renderLayoutPage("results", buildDslData());
    } else if (route === "system.blocked" || route === "system.locked" ||
               route.indexOf("system.") === 0) {
      var systemData = Object.assign({}, buildDslData(), {
        page: {
          title:   "Доступ ограничен",
          content: { message: "Для этого теста больше нет доступных попыток." },
          results: {}
        }
      });
      renderLayoutPage(route, systemData);
    } else {
      renderLayoutPage(route, buildDslData());
    }

    updateProgress(route);
  }

  // ─── Content page rendering ──────────────────────────────────────────────────
  function renderContentRoute(routeDef) {
    if (!routeDef) return;
    var app = getApp();
    if (!app) return;

    var route = routeDef.route || "";
    var pageId = routeDef.pageId;
    var templateKey = routeDef.templateKey;
    var pages = (demoData.course || {}).contentPages || [];
    var page = null;
    for (var i = 0; i < pages.length; i++) {
      if ((pageId && pages[i].id === pageId) || (!pageId && pages[i].templateKey === templateKey)) {
        page = pages[i]; break;
      }
    }
    if (!page) return;

    // If the template has a layout with data-slot="content-body" (rtk-style), render it directly.
    // Otherwise fall back to the PRD1 renderContentPage skeleton.
    var layoutHtml = layouts[route] || "";
    if (layoutHtml && layoutHtml.indexOf('data-slot="content-body"') >= 0) {
      var values = page.values || {};
      var pageDslData = Object.assign({}, buildDslData(), {
        page: {
          title:   values.title || (demoData.course || {}).title || "",
          content: values,
          summary: values,
          question: {}
        }
      });
      app.innerHTML = renderDsl(layoutHtml, pageDslData);
      var bodySlot = app.querySelector('[data-slot="content-body"]');
      if (bodySlot && values.body) bodySlot.innerHTML = String(values.body);
      fillDataPaths(app, pageDslData);
      return;
    }

    // PRD1 fallback: renderContentPage writes to #app directly
    if (typeof renderContentPage === "function") {
      renderContentPage(page, manifest.contentTemplates || []);
    }
  }

  // ─── Question rendering ───────────────────────────────────────────────────────
  function renderQuestionRoute(routeDef, route) {
    var app = getApp();
    if (!app) return;

    var questionId = routeDef && routeDef.questionId;
    var questions = (demoData.course || {}).questions || [];
    var q = null;
    if (questionId) {
      for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) { q = questions[i]; break; }
      }
    }

    var type = route.replace("question.", "");
    // Fall back to first question of matching type from demo data
    if (!q) {
      for (var j = 0; j < questions.length; j++) {
        if (questions[j].type === type) { q = questions[j]; break; }
      }
    }

    // Use type-specific layout when available (e.g. "question.single"), else generic "question"
    var layoutHtml = layouts["question." + type] || layouts["question"] || "";
    var dslData = buildDslData();

    // Build question counter label: "Вопрос N из M | TopicName"
    var qIndex = 0;
    for (var k = 0; k < questions.length; k++) {
      if (questions[k] === q) { qIndex = k; break; }
    }
    var topicTitle = "";
    if (q && q.topicId) {
      var topics = (demoData.course || {}).topics || [];
      for (var t = 0; t < topics.length; t++) {
        if (topics[t].id === q.topicId) { topicTitle = topics[t].title || ""; break; }
      }
    }
    var counterLabel = q
      ? ("Вопрос " + (qIndex + 1) + " из " + questions.length + (topicTitle ? " | " + topicTitle : ""))
      : "";

    var customState = Object.assign({}, dslData.state, {
      questionCounterLabel: counterLabel,
      currentTopicTitle: topicTitle

    var qDslData = Object.assign({}, dslData, {
      state: customState,
      page: {
        title:   (demoData.course || {}).title || "",
        content: {},
        question: { topicTitle: topicTitle }
      }
    });
    app.innerHTML = renderDsl(layoutHtml, qDslData);

    // Support both slot names: default template uses "question-text", rtk uses "question-prompt"
    var promptSlot = app.querySelector('[data-slot="question-text"], [data-slot="question-prompt"]');
    var interSlot  = app.querySelector('[data-slot="question-interaction"]');

    if (promptSlot && q) promptSlot.innerHTML = escapeHtml(q.prompt || "");
    if (interSlot  && q) interSlot.innerHTML  = buildInteractionHtml(q);
