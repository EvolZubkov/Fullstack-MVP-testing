  <style>
    :root{--pv-bg:#fff;--pv-fg:hsl(0 0% 9%);--pv-border:hsl(0 0% 89%);--pv-card:hsl(0 0% 98%);--pv-card-b:hsl(0 0% 94%);--pv-sidebar:hsl(0 0% 96%);--pv-sidebar-b:hsl(0 0% 92%);--pv-primary:hsl(217 91% 42%);--pv-muted:hsl(217 10% 92%);--pv-muted-fg:hsl(0 0% 35%);--pv-radius:9px;--pv-radius-sm:4px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;font-size:14px;background:#e5e7eb;color:var(--pv-fg);line-height:1.5}
    .shell{display:flex;background:var(--pv-bg);min-height:100vh}
    .pv-sidebar{width:224px;flex-shrink:0;background:var(--pv-sidebar);border-right:1px solid var(--pv-sidebar-b);display:flex;flex-direction:column;height:100vh}
    .pv-sidebar-head{padding:16px;border-bottom:1px solid var(--pv-sidebar-b);display:flex;align-items:center;gap:8px}
    .pv-logo{width:28px;height:28px;background:var(--pv-primary);border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
    .pv-app-name{font-size:13px;font-weight:600}
    .pv-main{flex:1;display:flex;flex-direction:column;min-width:0;filter:blur(1px);opacity:.4}
    .pv-topbar{border-bottom:1px solid var(--pv-border);padding:10px 20px;display:flex;align-items:center;gap:12px}
    .pv-test-title{font-size:15px;font-weight:600;flex:1}
    .pv-overlay{position:absolute;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
    .pv-dialog{background:var(--pv-bg);border-radius:var(--pv-radius);box-shadow:0 24px 64px rgba(0,0,0,.35);width:100%;max-width:1140px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
    .pv-dialog-head{padding:14px 20px;border-bottom:1px solid var(--pv-border);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .pv-dialog-title{font-size:15px;font-weight:600}
    .pv-dialog-sub{font-size:12px;color:var(--pv-muted-fg)}
    .pv-theme{margin-left:auto;display:inline-flex;gap:2px;background:var(--pv-muted);border-radius:6px;padding:2px}
    .pv-theme-btn{border:0;background:transparent;color:var(--pv-fg);font:inherit;font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:background .12s}
    .pv-theme-btn:hover:not(.pv-theme-active){background:rgba(0,0,0,.05)}
    .pv-theme-btn.pv-theme-active{background:var(--pv-bg);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:600}
    .pv-body{display:flex;flex:1;overflow:hidden;min-height:0}
    .pv-nav{width:220px;flex-shrink:0;border-right:1px solid var(--pv-border);overflow-y:auto;padding:6px 0;background:var(--pv-sidebar)}
    .pv-nav-item{display:block;width:calc(100% - 12px);margin:0 6px 1px;padding:7px 8px;border:0;border-radius:3px;background:transparent;color:var(--pv-fg);text-align:left;font:inherit;font-size:13px;cursor:pointer;transition:background .12s,color .12s}
    .pv-nav-item:hover{background:var(--pv-muted)}
    .pv-nav-item.pv-active{background:var(--pv-primary);color:#fff}
    .pv-stage-wrap{flex:1;overflow-y:auto;background:hsl(0 0% 91%);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px}
    .pv-stage{width:100%;max-width:960px;border-radius:var(--pv-radius-sm);overflow:hidden;box-shadow:0 2px 18px rgba(0,0,0,.14)}

    .pv-dialog-foot{padding:10px 20px;border-top:1px solid var(--pv-border);display:flex;align-items:center;gap:12px;flex-shrink:0;color:var(--pv-muted-fg);font-size:12px}
    .pv-btn{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;height:32px;border-radius:var(--pv-radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--pv-border);background:var(--pv-bg);color:var(--pv-fg);font-family:inherit;margin-left:auto}
    @media(max-width:860px){.pv-sidebar{display:none}.pv-overlay{padding:8px}.pv-nav{width:100%;max-height:160px;border-right:0;border-bottom:1px solid var(--pv-border)}.pv-body{flex-direction:column}.pv-stage{max-width:100%}}

  <style id="tpl-styles">/* styles/theme.css */
:root {
  --background: 225 7% 7%;
  --foreground: 0 0% 98%;
  --border: 0 0% 22%;
  --card: 225 14% 14%;
  --card-foreground: 0 0% 98%;
  --card-border: 0 0% 24%;
  --primary: 217 91% 42%;
  --primary-foreground: 0 0% 98%;
  --muted: 225 10% 20%;
  --muted-foreground: 0 0% 65%;
  --accent: 225 8% 22%;
  --destructive: 0 84% 52%;
  --success: 142 76% 36%;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 12px;
  --shadow: 0px 4px 16px rgba(0, 0, 0, 0.5);
}

/* styles/base.css */
/* UNIFIED stylesheet (PRD-12 CSS unification): SCORM runtime canon (styles.css)
   + layout-wrapper classes merged from the web base.css, component convention.
   Tokens live in theme.css. Loaded by BOTH hosts. */

/* ===== Modern Dark Theme SCORM Package ===== */


/* ===== Base Styles ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  min-height: 100vh;
  padding: 24px;
  line-height: 1.6;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

/* ===== Brand / Logo (PRD-7 design param `logoUrl`) =====
   Rendered at the top of each learner screen (start / question / results) when
   the test sets a logo; the `{{#if design.logoUrl}}` block omits it otherwise. */
.tb-brand {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 28px;
}
.tb-brand__logo {
  max-height: 72px;
  max-width: 300px;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* ===== Progress pills (PRD-19 Block C, FR-10/11/12) =====
   Clickable question map that replaces the linear progress bar. Framework-free —
   rendered from `state.questionsProgress` via the unified template on BOTH hosts;
   ported to template tokens from docs/wireframes/prd19-learner-real.html. */
.tb-pills { display: flex; flex-direction: column; gap: 8px; margin: 0 0 20px; }
.tb-pills__head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: hsl(var(--muted-foreground)); }
.tb-pills__head b { color: hsl(var(--foreground)); font-weight: 600; }
.tb-pills__dots { display: flex; flex-wrap: wrap; gap: 6px; }
.tb-pill { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); border: 0; cursor: pointer; font-family: inherit; }
.tb-pill.is-answered { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.tb-pill.is-current { background: hsl(var(--card)); color: hsl(var(--primary)); box-shadow: inset 0 0 0 2px hsl(var(--primary)), 0 0 0 3px hsl(var(--primary) / .2); }
.tb-pill.is-skipped { background: transparent; color: hsl(var(--muted-foreground)); box-shadow: inset 0 0 0 1px hsl(var(--border)); }
/* FR-10a review marking (only when showCorrectAnswers is on). */
.tb-pill.is-correct { background: hsl(var(--success)); color: hsl(var(--primary-foreground)); }
.tb-pill.is-incorrect { background: hsl(var(--destructive, 0 72% 51%)); color: hsl(var(--primary-foreground)); }
.tb-pill.is-unanswered { background: transparent; color: hsl(var(--muted-foreground)); box-shadow: inset 0 0 0 1px hsl(var(--border)); }
.tb-pill:disabled { opacity: .4; cursor: not-allowed; }
.tb-pill:focus-visible { outline: 2px solid hsl(var(--primary)); outline-offset: 2px; }
.tb-pills__legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: hsl(var(--muted-foreground)); }
.tb-pills__legend-item { display: inline-flex; align-items: center; gap: 6px; }
.tb-pills__legend-dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--muted)); box-shadow: inset 0 0 0 1px hsl(var(--border)); }
.tb-pills__legend-dot.is-answered { background: hsl(var(--primary)); box-shadow: none; }
.tb-pills__legend-dot.is-current { background: hsl(var(--card)); box-shadow: inset 0 0 0 2px hsl(var(--primary)); }
.tb-pills__legend-dot.is-skipped { background: transparent; box-shadow: inset 0 0 0 1px hsl(var(--border)); }
.tb-pills__legend-dot.is-locked { opacity: .4; }

/* ===== Review (обзор) screen + question actions (PRD-19 Block D, FR-04c/FR-08) =====
   The обзор (section-finish / test-finish) screen: pills + explicit unanswered list
   + «Завершить …». Ported to template tokens from docs/wireframes/prd19-learner-real.html. */
.q-actions { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.q-actions__spacer { flex: 1; }
.obzor-title { font-size: 18px; font-weight: 800; color: hsl(var(--foreground)); margin: 0 0 4px; }
.obzor-sub { font-size: 14px; color: hsl(var(--muted-foreground)); margin: 0 0 18px; }
.tb-unanswered { display: flex; flex-direction: column; gap: 8px; text-align: left; margin-top: 16px; }
.tb-unanswered__head { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); margin-bottom: 4px; }
.tb-unanswered__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 16px; border: 1px solid hsl(var(--border)); border-radius: 10px; background: hsl(var(--card)); cursor: pointer; color: hsl(var(--foreground)); font-size: 14px; font-family: inherit; text-align: left; }
.tb-unanswered__row:hover { border-color: hsl(var(--primary)); background: hsl(var(--accent)); }
.tb-unanswered__go { color: hsl(var(--primary)); font-weight: 600; white-space: nowrap; }

/* ===== Finish-confirm modal (PRD-19 Block D, FR-09) — host-chrome overlay,
   styled with template tokens so it matches the active theme. ===== */
.tb-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.tb-modal { background: hsl(var(--card)); color: hsl(var(--card-foreground)); border: 1px solid hsl(var(--card-border)); border-radius: var(--radius); max-width: 440px; width: 100%; box-shadow: var(--shadow); overflow: hidden; }
.tb-modal__head { display: flex; gap: 12px; padding: 20px 20px 8px; align-items: flex-start; }
.tb-modal__icon { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: hsl(38 92% 50% / .15); color: hsl(38 92% 50%); }
.tb-modal__title { font-size: 17px; font-weight: 700; margin: 0 0 4px; color: hsl(var(--foreground)); }
.tb-modal__desc { font-size: 14px; color: hsl(var(--muted-foreground)); margin: 0; }
.tb-modal__body { padding: 0 20px; font-size: 13px; color: hsl(var(--muted-foreground)); }
.tb-modal__foot { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 20px 20px; }

h1 {
  font-size: 28px;
  margin: 0 0 24px;
  color: hsl(var(--foreground));
  font-weight: 600;
}

/* ===== Card System ===== */
.card {
  background: hsl(var(--card));
  color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--card-border));
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

/* ===== Results Page - Summary Card ===== */
.summary-card {
  text-align: center;
  padding: 40px 32px;
}

.summary-head {
  margin-bottom: 32px;
}

.hero-title {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 12px;
  color: hsl(var(--foreground));
}

.hero-subtitle {
  font-size: 16px;
  color: hsl(var(--muted-foreground));
}

/* ===== Ring Progress Circle ===== */
.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.ring {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 0 auto;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring circle {
  transition: stroke-dashoffset 0.6s ease;
}

.ring .center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.ring .pct {
  font-size: 52px;
  font-weight: 700;
  color: hsl(var(--foreground));
  line-height: 1;
}

.ring .label {
  font-size: 14px;
  color: hsl(var(--muted-foreground));
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== Pass/Fail Pill ===== */
.pill {
  display: inline-block;
  padding: 10px 24px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.pill.pass {
  background: hsl(var(--success) / 0.2);
  color: hsl(var(--success));
  border: 2px solid hsl(var(--success) / 0.4);
}

.pill.fail {
  background: hsl(var(--destructive) / 0.2);
  color: hsl(var(--destructive));
  border: 2px solid hsl(var(--destructive) / 0.4);
}

/* ===== Stats Row ===== */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 56px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid hsl(var(--border));
}

.stat {
  text-align: center;
}

.stat .v {
  font-size: 36px;
  font-weight: 700;
  color: hsl(var(--foreground));
  line-height: 1;
}

.stat .l {
  font-size: 11px;
  color: hsl(var(--muted-foreground));
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ===== Section Title ===== */
.section-title {
  font-size: 20px;
  font-weight: 600;
  margin: 40px 0 20px;
  color: hsl(var(--foreground));
}

/* ===== Topic Grid ===== */
.topic-grid {
  display: grid;
  gap: 16px;
}

.topic-card {
  padding: 24px 28px;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--card-border));
  border-radius: var(--radius);
}

.topic-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.topic-name {
  font-size: 17px;
  font-weight: 600;
  color: hsl(var(--foreground));
}

.topic-meta {
  font-size: 14px;
  color: hsl(var(--muted-foreground));
  margin-bottom: 12px;
}

/* ===== Topic Progress Bar ===== */
.topic-bar {
  height: 10px;
  background: hsl(var(--muted));
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.topic-bar > div {
  height: 100%;
  background: hsl(var(--muted-foreground));
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 999px;
}

.topic-bar.pass > div {
  background: hsl(var(--success));
}

/* ===== Course Links ===== */
.course-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: hsl(var(--accent));
  border: 1px solid hsl(var(--border));
  border-radius: 10px;
  margin-top: 14px;
  color: hsl(var(--primary));
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.course-link:hover {
  background: hsl(var(--accent) / 0.7);
  border-color: hsl(var(--primary));
  transform: translateY(-1px);
}

/* ===== Footer Actions ===== */
.footer-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 40px;
}

/* ===== Questions Page ===== */
.question-text {
  font-size: 18px;
  margin-bottom: 28px;
  color: hsl(var(--foreground));
  line-height: 1.7;
}

.question-hint {
  font-size: 13px;
  color: hsl(var(--muted-foreground));
  margin: -16px 0 16px;
  line-height: 1.5;
}

.option {
  display: flex;
  align-items: center;
  padding: 18px 22px;
  border: 2px solid hsl(var(--border));
  border-radius: 10px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: hsl(var(--card));
}

.option:hover {
  border-color: hsl(var(--primary));
  background: hsl(var(--accent));
  transform: translateX(2px);
}

.option.selected {
  border-color: hsl(var(--primary));
  background: hsl(var(--primary) / 0.12);
}

.option.correct-answer {
  border-color: hsl(var(--success));
  background: hsl(var(--success) / 0.15);
}

.option.incorrect-answer {
  border-color: hsl(var(--destructive));
  background: hsl(var(--destructive) / 0.15);
}

.option input {
  margin-right: 14px;
  width: 20px;
  height: 20px;
  /* Fixed control size: as a flex item the radio/checkbox would otherwise shrink
     (default flex-shrink:1) when the answer text wraps, so the circle drifted /
     went oval with longer answers. `flex:0 0 20px` pins it regardless of text length
     (alignment stays centered via the row's align-items: center). */
  flex: 0 0 20px;
  cursor: pointer;
}

/* ===== Progress Bar ===== */
.progress-bar {
  height: 10px;
  background: hsl(var(--muted));
  border-radius: 999px;
  margin-bottom: 28px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: hsl(var(--primary));
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 28px;
  background: hsl(var(--primary));
  color: hsl(var(--primary-foreground));
  border: 2px solid hsl(var(--primary));
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.btn:hover {
  background: hsl(var(--primary) / 0.9);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.3);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-outline {
  background: transparent;
  color: hsl(var(--foreground));
  border: 2px solid hsl(var(--border));
}

.btn-outline:hover {
  background: hsl(var(--accent));
  border-color: hsl(var(--primary));
}

.navigation {
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
}

/* ===== Matching DnD (MATCHING) ===== */
/* Новый формат: строка = левый слот + gap + правый ответ, при совпадении "склеиваются" в одну плашку */
.matching-board{
  --matchRowH: auto;
  display:flex;
  flex-direction:column;
  gap: 12px;
  margin-top: 10px;
}

.matching-line{
  display:flex;
  align-items:stretch;
}

.matching-gap{
  flex: 0 0 18px;
}

.match-tile{
  flex: 1 1 0;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  box-shadow: var(--shadow);
  display:flex;
  align-items:center;
  height: var(--matchRowH);
  overflow: hidden;
  font-size: 14px;
  line-height: 1.35;
}

.match-left-slot{
  justify-content:flex-start;
  gap: 10px;
}

.match-right-tile{
  color: hsl(var(--foreground));
  opacity: .92;
  white-space: normal;
}

.match-empty{
  flex: 1 1 0;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  background: transparent;
  border: 1px dashed hsl(var(--border));
  display:flex;
  align-items:center;
  height: var(--matchRowH);
}

.match-chip{
  user-select:none;
  width: 100%;
  padding: 10px 12px;
  /* Flex row: grip (fixed) + gap + wrapping text. The grip/text rules below
     (.match-grip flex:0 0 auto, .match-chip-text min-width:0) expect this — without
     `display:flex` the grip fell inline to the top-left and stuck to the text. */
  display: flex;
  align-items: center;
  gap: 12px;
  color: hsl(var(--foreground));
  cursor: grab;
  font-size: 14px;
  line-height: 1.25;
  white-space: normal;
}
.match-chip:active{ cursor: grabbing; }

/* dragover подсветка */
.match-drop-right.is-over,
.match-drop-left.is-over{
  outline: 2px solid hsl(var(--primary));
  outline-offset: 2px;
}

/* Joined state */
.matching-line.is-joined{
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow:hidden;
}

.matching-line.is-joined .match-tile,
.matching-line.is-joined .match-empty{
  background: transparent;
  border: 0;
  box-shadow: none;
  border-radius: 0;
}

.matching-line.is-joined .match-left-slot{
  border-top-left-radius: 12px;
  border-bottom-left-radius: 12px;
}

.matching-line.is-joined .match-right-tile{
  border-top-right-radius: 12px;
  border-bottom-right-radius: 12px;
}

/* Результаты */
.matching-line.correct-answer{
  border-color: hsl(var(--success));
  background: color-mix(in oklab, hsl(var(--success)) 12%, hsl(var(--card)));
}
.matching-line.incorrect-answer{
  border-color: hsl(var(--destructive));
  background: color-mix(in oklab, hsl(var(--destructive)) 10%, hsl(var(--card)));
}
/* Committed (submitted) accent — shown when the matching board is locked but
   correctness is NOT revealed (showCorrectAnswers off), so the submitted answer is
   visibly fixed, mirroring `.option.selected` on single/multiple. The green/red
   correctness states win via :not(). */
.matching-board.is-locked .matching-line.is-joined:not(.correct-answer):not(.incorrect-answer){
  border-color: hsl(var(--primary));
  background: color-mix(in oklab, hsl(var(--primary)) 8%, hsl(var(--card)));
}

.slot-placeholder{
  color: hsl(var(--muted-foreground));
  font-size: 13px;
}
  
.match-left-stack{
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  min-width: 0;
}

.match-wrong-hint{
  font-size: 12px;
  line-height: 1.2;
  color: hsl(var(--muted-foreground));
  opacity: .9;
}


/* ===== Ranking DnD (RANKING) ===== */
.ranking-board{
  display:flex;
  flex-direction:column;
  gap: 12px;
  margin-top: 10px;
}

.rank-item{
  user-select:none;
  padding: 14px;
  border-radius: 12px;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  box-shadow: var(--shadow);
  display:flex;
  align-items:center;
  gap: 10px;
  cursor: grab;
  min-width: 0;
}

.rank-item:active{ cursor: grabbing; }

.rank-grip{
  flex: 0 0 auto;
  display:flex;
  align-items:center;
  opacity: .85;
}

.rank-text{
  min-width: 0;
  white-space: normal;
  color: hsl(var(--foreground));
  opacity: .92;
  font-size: 14px;
  line-height: 1.35;
}

.rank-item.dragging{ opacity: .7; }

.rank-item.is-over{
  outline: 2px solid hsl(var(--primary));
  outline-offset: 2px;
}

/* (необязательно) подсветка после проверки */
.rank-item.correct-answer{
  border-color: hsl(var(--success));
  background: color-mix(in oklab, hsl(var(--success)) 12%, hsl(var(--card)));
}
.rank-item.incorrect-answer{
  border-color: hsl(var(--destructive));
  background: color-mix(in oklab, hsl(var(--destructive)) 10%, hsl(var(--card)));
}
/* Committed (submitted) accent for ranking — same rationale as matching above. */
.ranking-board.is-locked .rank-item:not(.correct-answer):not(.incorrect-answer){
  border-color: hsl(var(--primary));
  background: color-mix(in oklab, hsl(var(--primary)) 8%, hsl(var(--card)));
}

/* ===== Loading State ===== */
#loading {
  text-align: center;
  padding: 100px 20px;
  color: hsl(var(--muted-foreground));
  font-size: 18px;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar {
  width: 12px;
}

::-webkit-scrollbar-track {
  background: hsl(var(--background));
}

::-webkit-scrollbar-thumb {
  background: hsl(var(--muted));
  border-radius: 6px;
  border: 2px solid hsl(var(--background));
}

::-webkit-scrollbar-thumb:hover {
  background: hsl(var(--muted-foreground));
}

/* ===== Animations ===== */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  animation: fadeIn 0.4s ease-out;
}

/* PRD-19 FR-05a: computed section-results (итоги раздела) — a compact, centered

/* PRD-1 §4.3: «Введение раздела» (section-intro) — topic name / description /

   layouts/section-intro.html. */
.section-intro{ max-width: 600px; }
.section-intro__card{ padding: 30px 26px 22px; text-align:center; }
.section-intro__eyebrow{ font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }

.section-intro__instruction-body{ font-size: 15px; line-height: 1.55; color: hsl(var(--foreground)); }
.section-intro__instruction-body > :first-child{ margin-top: 0; }
.section-intro__instruction-body > :last-child{ margin-bottom: 0; }

.topic-card{ padding: 18px; text-align:left; }

/* PRD-4 v1.1 Phase 4c-iii — router topic cards (router_by_topics flow).
   Rendered by routerFlow.js inside the standard renderContentPage output. */
.router-topic-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 24px;
}
/* The router is a HUB — navigation is the topic cards, not the content wrapper's
   «Далее». The runtime removes that nav imperatively; this rule hides it in the
   «Структура» preview (which renders the content layout verbatim) so run + preview
   match. Scoped to a content wrapper that actually contains router cards. */
.layout-content-wrap:has(.router-topic-cards) .navigation { display: none; }
/* Required-section progress on the router hub («Разделы X / Y» + thin bar). */
.router-progress { margin: 18px 0 4px; }
.router-progress__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.router-progress__label { font-size: 13px; font-weight: 600; color: hsl(var(--muted-foreground)); }
.router-progress__count { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: hsl(var(--foreground)); }
.router-progress__bar { height: 6px; border-radius: 999px; background: hsl(var(--muted)); overflow: hidden; }
.router-progress__fill { height: 100%; border-radius: 999px; background: hsl(var(--primary)); transition: width .25s ease; }
.router-topic-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px;
  border: 1px solid hsl(0 0% 80%);
  border-radius: 10px;
  background: hsl(0 0% 99%);
  cursor: pointer;
  text-align: left;
  font: inherit;
  /* The card background is intentionally a fixed light tone, so the text must be a
     fixed dark tone — `inherit` let the topic name pick up a light theme foreground
     and vanish on the light card (e.g. in the preview Shadow DOM). */
  color: hsl(0 0% 13%);
  transition: border-color .15s, background .15s;
}
.router-topic-card:hover:not(:disabled) {
  border-color: hsl(217 91% 50%);
  background: hsl(217 100% 98%);
}
.router-topic-card:disabled {
  cursor: default;
  opacity: .85;
}
.router-topic-card--completed {
  border-color: hsl(142 71% 45%);
  background: hsl(142 76% 96%);
}
.router-topic-card--inProgress {
  border-color: hsl(38 92% 50%);
  background: hsl(48 96% 96%);
}
.router-topic-card__name {
  font-weight: 600;
  font-size: 15px;
}
.router-topic-card__status {
  font-size: 12px;
  color: hsl(0 0% 40%);
}
.router-topic-card--completed .router-topic-card__status {
  color: hsl(142 71% 30%);
  font-weight: 500;
}
.router-finish {
  margin-top: 24px;
}


.router-topic-card--locked {
  opacity: .5;
  cursor: not-allowed;
}
.router-topic-card__optional {
  font-weight: 400;
  font-size: 11px;
  color: hsl(0 0% 50%);
}
/* Enriched router-card rows (shared runtime): topic+image row, meta chips, status+CTA,
   deadline stat boxes. The certification template styles these richly in its own
   base.css; the default template needs at least layout + gaps + image constraint so
   the spans don't run together ("Не начатаначать") or blow out the 220px grid. */
.router-topic-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.router-topic-card__img { flex: 0 0 auto; }
.router-topic-card__img img { display: block; width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
.router-topic-card__meta { display: flex; flex-wrap: wrap; gap: 6px; }
.router-topic-card__chip {
  font-size: 11px; color: hsl(0 0% 30%); background: hsl(0 0% 94%);
  border-radius: 999px; padding: 2px 8px;
}
.router-topic-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.router-topic-card__go { font-size: 12px; font-weight: 600; color: hsl(217 91% 50%); }
.router-stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
.router-stat {
  display: flex; flex-direction: column; gap: 2px;
  border: 1px solid hsl(0 0% 88%); border-radius: 8px; padding: 8px 12px; background: hsl(0 0% 99%);
}
.router-stat__label { font-size: 11px; color: hsl(0 0% 45%); }
.router-stat__value { font-size: 14px; font-weight: 700; color: hsl(0 0% 13%); font-variant-numeric: tabular-nums; }


/* ===== PRD-6 retake gate: block-wall + neutral start shell ===== */
.retake-wall,
.retake-shell {
  min-height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.retake-wall__card,
.retake-shell__card {

}
.retake-wall__title,
.retake-shell__title {

}
.retake-wall__lead,
.retake-shell__lead {

}
.retake-wall__date {

}
.retake-shell__btn {

  background: hsl(211 100% 50%);

  font-weight: 600;
  cursor: pointer;
}
.retake-shell__btn:hover { background: hsl(211 100% 44%); }

/* PRD-12: shared-template screens — classes also present in templates/default
   styles/base.css (web host). Kept in sync here for the SCORM runtime, which
   serves this stylesheet (not the template base.css). */
.transition-page { max-width: 480px; margin: 80px auto; padding: 0 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.transition-icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.transition-icon.is-pass { background: hsl(var(--success) / 0.18); color: hsl(var(--success)); }
.transition-icon.is-fail { background: hsl(var(--destructive) / 0.18); color: hsl(var(--destructive)); }
.transition-title { font-size: 26px; font-weight: 800; }
.transition-level { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 22px; border-radius: 16px; border: 2px solid hsl(var(--border)); font-size: 16px; font-weight: 600; }
.transition-level.is-up { border-color: hsl(var(--success)); color: hsl(var(--success)); background: hsl(var(--success) / 0.12); }
.transition-level.is-down { border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); background: hsl(var(--destructive) / 0.12); }
.transition-level.is-complete { border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: hsl(var(--primary) / 0.12); }
.transition-level-icon { flex-shrink: 0; }
.transition-topic { font-size: 15px; color: hsl(var(--muted-foreground)); }
.transition-actions { margin-top: 8px; }

/* Start screen: in-progress resume note (SCORM Case 2 / web parity). */
.start-resume-note { width: 100%; max-width: 360px; text-align: center; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); }

/* Results: recommended courses/events for failed topics (gated). */
.results-rec-list { display: flex; flex-direction: column; gap: 8px; }
.results-rec-item { display: block; padding: 10px 12px; background: hsl(var(--muted)); border-radius: 8px; font-size: 14px; font-weight: 500; color: hsl(var(--foreground)); text-decoration: none; }
a.results-rec-item { color: hsl(var(--primary)); }
a.results-rec-item:hover { text-decoration: underline; }
.topic-feedback-text { font-size: 13px; }

  /* ── Shared helpers expected by contentPage.js ── */
  window.escapeHtml = function(v) {

<!-- PRD1 runtime: templateCore, renderers, contentPage -->
<script>/* server\scorm\template\app\templateCore.js */
/**
 * @module templateCore
 * @description TestBuilder Runtime Core — CSS variable application, placeholder
 * rendering, textFit modes, autoAdvance timer, and the window.TestBuilder API
 * consumed by design template scripts.
 *
 * Pure helper functions are exposed on TestBuilder._internal so they can be
 * unit-tested without a live DOM or SCORM session.
 */
(function (root) {
  "use strict";

  // ─── Path resolver ────────────────────────────────────────────────────────

  /**
   * Resolves a dot-notation path in an object.
   * @param {object} obj
   * @param {string} path
   * @returns {*}
   */
  function resolvePath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // ─── CSS variables ────────────────────────────────────────────────────────

  /**
   * Builds a { "--css-var": "value" } map from effective params and the
   * manifest param definitions that declare a cssVar property.
   * @param {object} params  Effective param values
   * @param {Array}  manifestParams  Array of param definitions from manifest
   * @returns {object}
   */
  function buildCssVarDeclarations(params, manifestParams) {
    // Canonical mapping lives in shared/template/params-css and is exposed on the
    // TBTemplate runtime bundle. Delegate to it so the package runtime and the web
    // preview never drift. The inline copy below is a byte-for-byte fallback used
    // only when the bundle is not present (defensive — keeps the package working).
    if (root.TBTemplate && typeof root.TBTemplate.buildTemplateCssVars === "function") {
      return root.TBTemplate.buildTemplateCssVars(params, manifestParams);
    }
    var result = {};
    if (!manifestParams || !params) return result;
    var defaultCssVars = {
      primaryColor: "--primary",
      backgroundColor: "--background",
      foregroundColor: "--foreground",
      cardColor: "--card",
      cardBorderColor: "--card-border",
      borderColor: "--border",
      mutedColor: "--muted",
      accentColor: "--accent",
      fontFamily: "--font-sans"
    };
    manifestParams.forEach(function (def) {
      var cssVar = def.cssVar || defaultCssVars[def.key];
      if (!cssVar) return;
      var value = resolvePath(params, def.key);
      if (value === null || value === undefined) value = def.default;
      if (value === null || value === undefined) return;
      var cssValue =
        typeof value === "number"
          ? String(value) + (def.cssUnit || "px")
          : String(value);
      result[cssVar] = cssValue;
    });
    return result;
  }

  /**
   * Applies CSS custom properties derived from params to document.documentElement.
   * @param {object} params
   * @param {Array}  manifestParams
   */
  function applyCssVarsToRoot(params, manifestParams) {
    var vars = buildCssVarDeclarations(params, manifestParams);
    var el =
      typeof document !== "undefined" ? document.documentElement : null;
    if (!el) return;
    Object.keys(vars).forEach(function (name) {
      el.style.setProperty(name, vars[name]);
    });
  }

  // ─── textFit ──────────────────────────────────────────────────────────────

  /**
   * Returns true when an element's content overflows its box.
   * @param {Element} el
   * @returns {boolean}
   */
  function isOverflowing(el) {
    return (
      el.scrollHeight > el.clientHeight + 1 ||
      el.scrollWidth > el.clientWidth + 1
    );
  }

  /**
   * Applies a textFit configuration to a DOM element.
   *
   * Modes:
   *   fixed      — sets font-size to defaultFontSize (or authorFontSize when
   *                allowAuthorFontSize is true). Warns on overflow.
   *   autoFitFont — shrinks font-size from maxFontSize down to minFontSize
   *                until the element no longer overflows.
   *   growBox    — sets font-size to defaultFontSize and lets the element's
   *                height grow. Caps at maxHeight if specified.
   *
   * @param {Element} el
   * @param {object}  config   textFit definition from the placeholder schema
   * @param {number|null} authorFontSize  Author-chosen font size (optional)
   */
  function applyTextFit(el, config, authorFontSize) {
    if (!el || !config) return;
    var mode = config.mode || "fixed";
    var useAuthor =
      config.allowAuthorFontSize &&
      authorFontSize !== null &&
      authorFontSize !== undefined;
    var defaultSize = useAuthor
      ? authorFontSize
      : config.defaultFontSize || 16;

    if (mode === "fixed") {
      el.style.fontSize = defaultSize + "px";
      if (config.overflow === "warn" && isOverflowing(el)) {
        console.warn("[textFit:fixed] overflow on element", el);
      }
      return;
    }

    if (mode === "autoFitFont") {
      var max = config.maxFontSize || defaultSize;
      var min = config.minFontSize || 8;
      el.style.fontSize = max + "px";
      var size = max;
      while (size > min && isOverflowing(el)) {
        size -= 0.5;
        el.style.fontSize = size.toFixed(2) + "px";
      }
      if (config.overflow === "warn" && isOverflowing(el)) {
        console.warn("[textFit:autoFitFont] overflow after shrink", el);
      }
      return;
    }

    if (mode === "growBox") {
      el.style.fontSize = defaultSize + "px";
      el.style.height = "auto";
      if (config.maxHeight) {
        el.style.maxHeight = config.maxHeight + "px";
        el.style.overflowY = "auto";
      }
    }
  }

  // ─── Placeholder rendering ────────────────────────────────────────────────

  var _escapeHtml =
    typeof escapeHtml === "function"
      ? escapeHtml
      : function (s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        };

  /**
   * Converts a raw placeholder value to safe HTML ready for innerHTML.
   * richText / html bypass escaping (already sanitized server-side).
   * @param {string} type
   * @param {*} value
   * @returns {string}
   */
  function renderPlaceholderHtml(type, value) {
    if (value === null || value === undefined || value === "") return "";
    switch (type) {
      case "text":
      case "textarea":
        return _escapeHtml(String(value)).replace(/\n/g, "<br>");
      case "richText":
      case "html":
        return String(value);
      case "number":
        return _escapeHtml(String(value));
      case "image":
        return (
          '<img src="' +
          _escapeHtml(String(value)) +
          '" alt="" style="max-width:100%;max-height:100%;">'
        );
      case "boolean":
        return value ? "&#10003;" : "";
      default:
        return _escapeHtml(String(value));
    }
  }

  /**
   * Fills [data-placeholder] elements inside root according to the content
   * template definition, then applies textFit to each.
   * @param {Element} root
   * @param {object}  contentTemplate  Entry from manifest.contentTemplates[]
   * @param {object}  values           Plain values map
   * @param {object}  placeholderStyles  { key: { fontSize: number } }
   */
  function fillPlaceholders(root, contentTemplate, values, placeholderStyles) {
    if (!root || !contentTemplate || !contentTemplate.placeholders) return;
    values = values || {};
    placeholderStyles = placeholderStyles || {};

    contentTemplate.placeholders.forEach(function (phDef) {
      var key = phDef.key;
      var el = root.querySelector('[data-placeholder="' + key + '"]');
      if (!el) return;

      var value = values[key];
      el.innerHTML = renderPlaceholderHtml(phDef.type, value);

      if (phDef.textFit) {
        var style = placeholderStyles[key] || {};
        applyTextFit(el, phDef.textFit, style.fontSize || null);
      }
    });
  }

  function renderPathOnlyDsl(root, data) {
    if (!root) return;
    var nodes = root.querySelectorAll("[data-path]");
    nodes.forEach(function (el) {
      var path = el.getAttribute("data-path");
      var value = resolvePath(data || {}, path);
      el.textContent = value === null || value === undefined ? "" : String(value);
    });
  }

  function fillControlledSlots(root, slots) {
    if (!root || !slots) return;
    Object.keys(slots).forEach(function (slotName) {
      var el = root.querySelector('[data-slot="' + slotName + '"]');
      if (el) el.innerHTML = slots[slotName] || "";
    });
  }

  // ─── autoAdvance ──────────────────────────────────────────────────────────

  var _autoAdvanceTimer = null;

  /**
   * Starts the autoAdvance countdown. Calls onComplete when the timer fires.
   * Only one timer can be active; any previous one is cancelled.
   * @param {number}   delayMs
   * @param {Function} onComplete
   */
  function startAutoAdvance(delayMs, onComplete) {
    cancelAutoAdvance();
    _autoAdvanceTimer = setTimeout(function () {
      _autoAdvanceTimer = null;
      if (typeof onComplete === "function") onComplete();
    }, delayMs);
  }

  /** Cancels any pending autoAdvance timer. */
  function cancelAutoAdvance() {
    if (_autoAdvanceTimer !== null) {
      clearTimeout(_autoAdvanceTimer);
      _autoAdvanceTimer = null;
    }
  }

  // ─── Event emitter ────────────────────────────────────────────────────────

  var _listeners = {};

  function on(event, handler) {
    if (!_listeners[event]) _listeners[event] = [];
    _listeners[event].push(handler);
  }

  function emit(event, data) {
    (_listeners[event] || []).forEach(function (h) {
      try {
        h(data);
      } catch (e) {
        console.warn("[TestBuilder] handler error for " + event + ":", e);
      }
    });
  }

  // ─── TestBuilder API ──────────────────────────────────────────────────────

  var _contextParams = {};

  /**
   * Reads effective params from TEST_DATA.designSettings.params (safe: works
   * even before TEST_DATA is defined, returns {}).
   */
  function _readParams() {
    try {
      if (
        typeof TEST_DATA !== "undefined" &&
        TEST_DATA.designSettings &&
        TEST_DATA.designSettings.params
      ) {
        return TEST_DATA.designSettings.params;
      }
    } catch (_) {}
    return {};
  }

  root.TestBuilder = {
    /** Read-only context for template scripts. */
    context: {
      get: function () {
        return { params: _contextParams };
      }
    },

    /** Template lifecycle event emitter. */
    template: { on: on, emit: emit },

    /** SCORM commit proxy (template scripts call this instead of SCORM directly). */
    scorm: {
      commit: function () {
        if (typeof SCORM !== "undefined" && typeof SCORM.commit === "function") {
          SCORM.commit();
        }
      }
    },

    /** UI helpers for template scripts. */
    ui: {
      modal: function (opts) {
        console.warn("[TestBuilder.ui.modal]", opts);
      },
      toast: function (msg) {
        console.warn("[TestBuilder.ui.toast]", msg);
      }
    },

    /**
     * Called by bootstrap once TEST_DATA is available and the design template
     * manifest has been loaded/embedded.
     * @param {Array} manifestParams  Param definitions from the template manifest
     */
    _init: function (manifestParams) {
      _contextParams = _readParams();
      applyCssVarsToRoot(_contextParams, manifestParams || []);
    },

    /** Pure helpers exposed for unit testing. */
    _internal: {
      resolvePath: resolvePath,
      buildCssVarDeclarations: buildCssVarDeclarations,
      applyCssVarsToRoot: applyCssVarsToRoot,
      applyTextFit: applyTextFit,
      isOverflowing: isOverflowing,
      renderPlaceholderHtml: renderPlaceholderHtml,
      fillPlaceholders: fillPlaceholders,
      renderPathOnlyDsl: renderPathOnlyDsl,
      fillControlledSlots: fillControlledSlots,
      startAutoAdvance: startAutoAdvance,
      cancelAutoAdvance: cancelAutoAdvance
    }
  };
})(typeof window !== "undefined" ? window : global);


/* server\scorm\template\app\render\renderers.js */
/**
 * @module renderers
 * @description Built-in renderer plugins for resultField placeholders.
 *
 * Each renderer is a pure function:
 *   render(value, path, rendererOptions) → HTML string
 *
 * Renderers do NOT access SCORM API and do NOT mutate runtime state.
 * The registry is exposed on window.TestBuilder.renderers (added by this module).
 *
 * Built-in IDs: core.textMetric, core.badge, core.progressBar,
 *               core.ringChart, core.segmentedProgress.
 */
(function (root) {
  "use strict";

  var _esc =
    typeof escapeHtml === "function"
      ? escapeHtml
      : function (s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        };

  function clamp(v, min, max) {
    return Math.min(Math.max(Number(v) || 0, min), max);
  }

  // ─── core.textMetric ─────────────────────────────────────────────────────

  /**
   * Renders a numeric (or text) value with an optional label.
   * Options: { label?: string, suffix?: string, decimals?: number }
   */
  function textMetric(value, rendererOptions) {
    var opts = rendererOptions || {};
    var label = opts.label ? _esc(String(opts.label)) : "";
    var suffix = opts.suffix ? _esc(String(opts.suffix)) : "";
    var decimals =
      opts.decimals !== undefined ? Number(opts.decimals) : null;
    var display =
      value === null || value === undefined
        ? "—"
        : decimals !== null
        ? _esc(Number(value).toFixed(decimals))
        : _esc(String(value));

   * as they do on the SCORM/web hosts — no second, drifting DSL. The legacy
   * non-recursive regex below is a best-effort fallback only if the bundle is
   * absent or a template trips the strict parser.
   */
  function renderDsl(html, data) {
    if (root.TBDsl && typeof root.TBDsl.renderTemplate === "function") {
      try {
        return root.TBDsl.renderTemplate(html, data);
      } catch (e) {
        if (root.console) root.console.warn("[preview] real DSL failed, falling back:", e && e.message);
      }
    }
    // {{#unless path}}...{{/unless}}
    html = html.replace(/\{\{#unless ([^}]+)\}\}([\s\S]*?)\{\{\/unless\}\}/g, function (_, p, inner) {
      var v = resolvePath(data, p.trim());
      return (!v) ? inner : "";
    });
    // {{#if path}}...{{/if}}
    html = html.replace(/\{\{#if ([^}]+)\}\}([\s\S]*?)\{\{\/if\}\}/g, function (_, p, inner) {
      var v = resolvePath(data, p.trim());
      return v ? inner : "";
    });
    // {{#each path}}...{{/each}}
    html = html.replace(/\{\{#each ([^}]+)\}\}([\s\S]*?)\{\{\/each\}\}/g, function (_, p, inner) {
      var arr = resolvePath(data, p.trim());
      if (!Array.isArray(arr)) return "";
      return arr.map(function (item) {
        return inner.replace(/\{\{\s*(\w+)\s*\}\}/g, function (_, key) {

    });

    html = html.replace(/\{\{\s*([^#/][^}]*?)\s*\}\}/g, function (_, p) {
      var v = resolvePath(data, p.trim());
      return v !== undefined && v !== null ? escapeHtml(String(v)) : "";
    });
    return html;
  }

  // ─── Shell & stage helpers ───────────────────────────────────────────────────
  var _stage = null;

    var stage = getStage();
    if (!stage) return;

    shellHtml = shellHtml.replace(/\{\{>\s*(\w+)\s*\}\}/g, function (_, name) {
      return layouts[name] || "";

  /** Resolves manifest param defaults into a flat object. */
  function paramDefaults() {
    var out = {};

    });

  /** Builds the data object for DSL rendering (merges course + runtime + params). */
  function buildDslData() {
    var course  = demoData.course  || {};
    var runtime = demoData.runtime || {};
    var state   = runtime.state   || {};
    var currentTopicId = state.currentTopicId || "";

    // Build sections array for {{#each sections}} in topic-nav partial
    var sections = (course.topics || []).map(function (t) {
      var cls = t.status === "completed" ? "is-complete" :
                (t.id === currentTopicId || t.status === "available") ? "is-active" : "is-locked";
      return { id: t.id, title: t.title || "", className: cls };
    });

    return {
      course:   course,
      runtime:  runtime,
      result:   runtime.result   || {},
      progress: runtime.progress || {},
      state:    state,
      params:   expandParams(demoData.params || paramDefaults()),
      sections: sections,
      nav: {
        submitAnswerLabel: "Принять ответ",

  // ─── TEST_DATA for contentPage.js / renderers.js ────────────────────────────
  function buildTestData() {

    var course = demoData.course || {};

      title: course.title || "",

  // ─── Navigation ──────────────────────────────────────────────────────────────
  function buildNav() {
    var nav = document.getElementById("pv-nav");
    if (!nav) return;
    var routes = (manifest.preview || {}).routes || [];
    var html = "";
    routes.forEach(function (r, i) {
      html += '<button type="button" class="pv-nav-item' + (i === 0 ? " pv-active" : "") + '" data-route="' + escapeHtml(r.route) + '">' + escapeHtml(r.label) + "</button>";
    });
    nav.innerHTML = html;
    nav.addEventListener("click", function (e) {
      var btn = e.target.closest(".pv-nav-item");
      if (!btn) return;
      var route = btn.getAttribute("data-route");
      nav.querySelectorAll(".pv-nav-item").forEach(function (el) { el.classList.remove("pv-active"); });
      btn.classList.add("pv-active");
      navigateTo(route, btn);
    });
  }

  // ─── Route navigation ────────────────────────────────────────────────────────
  function navigateTo(route, btn) {
    var routes = (manifest.preview || {}).routes || [];
    var routeDef = null;
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].route === route) { routeDef = routes[i]; break; }
    }
    var label = routeDef ? routeDef.label : route;
    updateCaption(label);

    if (route === "start") {
      renderLayoutPage("start", buildDslData());
    } else if (route.indexOf("content.") === 0 || route === "content") {
      renderContentRoute(routeDef);
    } else if (route.indexOf("question.") === 0) {
      renderQuestionRoute(routeDef, route);
    } else if (route === "results") {
      renderLayoutPage("results", buildDslData());
    } else if (route === "review") {
      renderReviewRoute();
    } else if (route === "section-results") {
      renderSectionResultsRoute();
    } else if (route === "system.blocked" || route === "system.locked" ||
               route.indexOf("system.") === 0) {
      var systemData = Object.assign({}, buildDslData(), {
        page: {
          title:   "Доступ ограничен",
          content: { message: "Для этого теста больше нет доступных попыток." },
          results: {}
        }
      });
      renderLayoutPage(route, systemData);
    } else {
      renderLayoutPage(route, buildDslData());
    }

    updateProgress(route);
  }

  // ─── Content page rendering ──────────────────────────────────────────────────
  function renderContentRoute(routeDef) {
    if (!routeDef) return;
    var app = getApp();
    if (!app) return;

    var route = routeDef.route || "";
    var pageId = routeDef.pageId;
    var templateKey = routeDef.templateKey;
    var pages = (demoData.course || {}).contentPages || [];
    var page = null;
    for (var i = 0; i < pages.length; i++) {
      if ((pageId && pages[i].id === pageId) || (!pageId && pages[i].templateKey === templateKey)) {
        page = pages[i]; break;
      }
    }
    if (!page) return;

    // Router page → dedicated renderer (topic cards + progress + «Завершить»).
    var _ct = null;
    (manifest.contentTemplates || []).forEach(function (c) { if (c.key === page.templateKey) _ct = c; });
    if (((_ct && _ct.kind === "router") || page.kind === "router") &&
        root.RouterFlow && typeof root.RouterFlow.renderRouterPage === "function") {
      root.RouterFlow.renderRouterPage(page);
      return;
    }

    // If the template has a layout with data-slot="content-body" (rtk-style), render it directly.
    // Otherwise fall back to the PRD1 renderContentPage skeleton.
    var layoutHtml = layouts[route] || "";
    if (layoutHtml && layoutHtml.indexOf('data-slot="content-body"') >= 0) {
      var values = page.values || {};
      var pageDslData = Object.assign({}, buildDslData(), {
        page: {
          title:   values.title || (demoData.course || {}).title || "",
          content: values,
          summary: values,
          question: {}
        }
      });
      app.innerHTML = renderDsl(layoutHtml, pageDslData);
      var bodySlot = app.querySelector('[data-slot="content-body"]');
      if (bodySlot && values.body) bodySlot.innerHTML = String(values.body);
      fillDataPaths(app, pageDslData);
      return;
    }

    // PRD1 fallback: renderContentPage writes to #app directly
    if (typeof renderContentPage === "function") {
      renderContentPage(page, manifest.contentTemplates || []);
    }
  }

  // ─── Review / section-results rendering ─────────────────────────────────────
  // These two routes have no pageId; they bind top-level `review.*` /
  // `sectionResult.*` / `state.questionsProgress` namespaces that buildDslData does
  // NOT surface. Build the context via the SAME shared builders production uses
  // (window.TBTemplate.buildReviewContext / buildSectionResultContext) so the
  // offline preview mirrors the learner screen instead of rendering blank.
  function renderReviewRoute() {
    var TBt = (typeof window !== "undefined") ? window.TBTemplate : null;
    var base = buildDslData();
    var questions = ((demoData.course || {}).questions || []).map(function (q) {
      return { id: q.id, topicId: q.topicId, prompt: q.prompt };
    });
    // Demo statuses: leave every 3rd question skipped so the обзор shows the
    // «вернуться к пропущенным» list + pill map populated.
    var statuses = {};
    questions.forEach(function (q, i) { statuses[q.id] = (i % 3 === 2) ? "skipped" : "answered"; });
    var built = (TBt && TBt.buildReviewContext) ? TBt.buildReviewContext({
      questions: questions, statuses: statuses, commitScope: "test", isTest: true,
      scopeLabel: "Вопросы теста", finishLabel: "Завершить тест"
    }) : null;
    var data = Object.assign({}, base, {
      review: built ? built.review : {},
      state: Object.assign({}, base.state, { questionsProgress: built ? built.questionsProgress : null })
    });
    renderLayoutPage("review", data);
  }

  function renderSectionResultsRoute() {
    var TBt = (typeof window !== "undefined") ? window.TBTemplate : null;
    var base = buildDslData();
    var topic = ((demoData.course || {}).topics || [])[0] || {};
    var sr = (demoData.runtime || {}).sectionResult || {};
    var built = (TBt && TBt.buildSectionResultContext) ? TBt.buildSectionResultContext({
      topicName: topic.title || "Раздел",
      correct: sr.score != null ? sr.score : 7,
      total: sr.maxScore != null ? sr.maxScore : 8,
      percent: sr.scorePercent != null ? sr.scorePercent : 88,
      passed: sr.status ? sr.status === "passed" : true,
      continueLabel: "Продолжить"
    }) : null;
    var data = Object.assign({}, base, {
      course: built ? built.course : (demoData.course || {}),
      sectionResult: built ? built.sectionResult : {}

    renderLayoutPage("section-results", data);

  // ─── Question rendering ───────────────────────────────────────────────────────
  function renderQuestionRoute(routeDef, route) {
    var app = getApp();
    if (!app) return;

    var questionId = routeDef && routeDef.questionId;
    var questions = (demoData.course || {}).questions || [];
    var q = null;
    if (questionId) {
      for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) { q = questions[i]; break; }
      }
    }

    var type = route.replace("question.", "");
    // Fall back to first question of matching type from demo data
    if (!q) {
      for (var j = 0; j < questions.length; j++) {
        if (questions[j].type === type) { q = questions[j]; break; }
      }
    }

    // Use type-specific layout when available (e.g. "question.single"), else generic "question"
    var layoutHtml = layouts["question." + type] || layouts["question"] || "";
    var dslData = buildDslData();

    // Build question counter label: "Вопрос N из M | TopicName"
    var qIndex = 0;
    for (var k = 0; k < questions.length; k++) {
      if (questions[k] === q) { qIndex = k; break; }
    }
    var topicTitle = "";
    if (q && q.topicId) {
      var topics = (demoData.course || {}).topics || [];
      for (var t = 0; t < topics.length; t++) {
        if (topics[t].id === q.topicId) { topicTitle = topics[t].title || ""; break; }
      }
    }
    var counterLabel = q ? ("Вопрос " + (qIndex + 1) + " из " + questions.length) : "";

    var customState = Object.assign({}, dslData.state, {
      questionCounterLabel: counterLabel,
      sectionName: topicTitle,
      currentTopicTitle: topicTitle
    });
    // PRD-19 Block C: build the progress-pills indicator so the question layout's pill
    // map renders in the preview (skip/return progress), matching production.
    var TBt = (typeof window !== "undefined") ? window.TBTemplate : null;
    if (TBt && typeof TBt.buildQuestionProgress === "function" && q) {
      var qList = questions.map(function (qq) { return { id: qq.id, topicId: qq.topicId }; });
      var demoStatuses = {};
      for (var s = 0; s < questions.length; s++) {
        if (s < qIndex) demoStatuses[questions[s].id] = (s === qIndex - 1) ? "skipped" : "answered";
      }
      customState.questionsProgress = TBt.buildQuestionProgress({
        questions: qList,
        statuses: demoStatuses,
        currentIndex: qIndex,
        commitScope: "test",
        sectionCommitted: {},
        allowReturn: true,
        scopeLabel: "Вопросы теста"
      });
    }
    var qDslData = Object.assign({}, dslData, {
      state: customState,
      page: {
        title:   (demoData.course || {}).title || "",
        content: {},
        question: { topicTitle: topicTitle }
      }
    });
    app.innerHTML = renderDsl(layoutHtml, qDslData);

    // Support both slot names: default template uses "question-text", rtk uses "question-prompt"
    var promptSlot = app.querySelector('[data-slot="question-text"], [data-slot="question-prompt"]');
    var interSlot  = app.querySelector('[data-slot="question-interaction"]');

    if (promptSlot && q) promptSlot.innerHTML = escapeHtml(q.prompt || "");
    if (interSlot  && q) interSlot.innerHTML  = buildInteractionHtml(q);

    fillDataPaths(app, qDslData);

    // Reveal the timer with a demo value (production reveals it from remainingSeconds).
    var _timer = app.querySelector("#timer-display");
    if (_timer) { _timer.classList.remove("q-timer--hidden"); _timer.textContent = "44:51"; }

    // Stepped text-fit (mirrors the runtime): shrink the prompt/options via --q-fit to
    // fit the fixed stage before the card's overflow scroll kicks in. Lower bound 0.7.
    var _card = app.querySelector(".question-card");
    if (_card && _card.style) {
      _card.classList.remove("question-card--scroll");
      var _steps = [1, 0.94, 0.88, 0.82, 0.76, 0.7], _fits = false;
      for (var _i = 0; _i < _steps.length; _i++) {
        _card.style.setProperty("--q-fit", String(_steps[_i]));
        if (_card.scrollHeight <= _card.clientHeight + 1) { _fits = true; break; }
      }
      if (!_fits) _card.classList.add("question-card--scroll");
    }
  }

  // ─── Interaction HTML builders ────────────────────────────────────────────────

  /** Builds interactive HTML for a question's interaction area. */
  function buildInteractionHtml(q) {
    if (!q) return "";
    switch (q.type) {
      case "single":
        return buildChoiceHtml(q, "radio");
      case "multiple":
        return buildChoiceHtml(q, "checkbox");
      case "matching":
        return buildMatchingHtml(q);
      case "ranking":
        return buildRankingHtml(q);
      default:
        return "";
    }
  }

  function buildChoiceHtml(q, inputType) {
    var name = "q-" + q.id;
    var html = "";
    (q.options || []).forEach(function (opt, idx) {
      var id = name + "-" + idx;
      html += '<div class="option" data-q="' + escapeHtml(String(q.id)) + '" data-input-type="' + inputType + '" data-opt-id="' + escapeHtml(String(opt.id)) + '">' +
        '<input type="' + inputType + '" id="' + escapeHtml(id) + '" name="' + escapeHtml(name) + '" value="' + escapeHtml(String(opt.id)) + '">' +
        escapeHtml(opt.text) +
        "</div>";
    });
    html += '<div class="navigation"><button type="button" class="btn" data-action="answer-submit">Принять ответ</button><button type="button" class="btn" data-nav="next">Далее</button></div>';
    return html;

  // ─── Choice click handler (bound once on document) ────────────────────────────

  var _choiceClickBound = false;

  function bindChoiceClicksOnce() {
    if (_choiceClickBound) return;
    _choiceClickBound = true;

    document.addEventListener("click", function (e) {
      var el = e.target.closest ? e.target.closest(".option") : null;
      if (!el) return;
      var inputType = el.getAttribute("data-input-type");
      var qid = el.getAttribute("data-q");
      var inp = el.querySelector("input");
      if (!inp) return;

      if (inputType === "radio") {
        var stage = getStage();
        if (stage) {
          stage.querySelectorAll(".option[data-q]").forEach(function (o) {
            if (o.getAttribute("data-q") === qid) {
              o.classList.remove("selected");
              o.classList.remove("is-selected");
              var i = o.querySelector("input");
              if (i) i.checked = false;
            }
          });
        }
        el.classList.add("selected");
        el.classList.add("is-selected");
        inp.checked = true;
      } else {
        el.classList.toggle("selected");
        el.classList.toggle("is-selected");
        inp.checked = el.classList.contains("selected");
      }
    });
  }

  // ─── Matching: chip-based drag-and-drop ───────────────────────────────────────

  /** Per-question matching state: { answers: {leftIdx: rightIdx}, pool: [leftIdx,...] } */
  var _matchingState = {};

  function getMatchingState(q) {
    var qid = q.id;
    if (!_matchingState[qid]) {

      _matchingState[qid] = { answers: {}, pool: pool };
    }
    return _matchingState[qid];
  }

  /** Rebuilds the [data-slot="question-interaction"] content for a matching question. */
  function rerenderMatchingBoard(q) {
    var slot = document.querySelector('[data-slot="question-interaction"]');
    if (slot) slot.innerHTML = buildMatchingHtml(q);
  }

  /**
   * Builds chip-based DnD matching HTML matching pre-PRD1 structure.
   * Layout: .matching-board > .matching-line > [left slot] + .matching-gap + .match-right-tile
   * demo data format: q.pairs = [{id, left, right}], indices used as leftIdx / rightIdx
   */
  function buildMatchingHtml(q) {
    var pairs = q.pairs || [];
    var ms = getMatchingState(q);
    var answers = ms.answers;
    var pool = ms.pool;

    // rightToLeft map: rightIdx -> leftIdx from current answers
    var rightToLeft = {};
    Object.keys(answers).forEach(function (k) {
      var li = parseInt(k, 10);
      var ri = answers[k];
      if (typeof ri === "number") rightToLeft[ri] = li;
    });

    var html = '<div class="matching-board" data-qid="' + escapeHtml(q.id) + '">';
    var poolSlot = 0;

    pairs.forEach(function (pair, rightIdx) {
      var matchedLeft = rightToLeft.hasOwnProperty(rightIdx) ? rightToLeft[rightIdx] : null;
      var isJoined = (matchedLeft !== null);

      html += '<div class="matching-line' + (isJoined ? " is-joined" : "") +
        '" data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">';

      if (isJoined) {
        // Left slot contains a matched chip
        html += '<div class="match-tile match-left-slot match-drop-left"' +
          ' data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">';
        html += '<div class="match-chip" draggable="true"' +
          ' data-qid="' + escapeHtml(q.id) +
          '" data-left="' + matchedLeft +
          '" data-from="match" data-right="' + rightIdx + '">' +
          escapeHtml(pairs[matchedLeft].left) + '</div>';
        html += '</div>';
      } else {
        var poolLeft = (poolSlot < pool.length) ? pool[poolSlot] : null;
        if (poolLeft !== null && poolLeft !== undefined) {
          // Left slot has a pool chip
          html += '<div class="match-tile match-left-slot match-drop-left"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-right="' + rightIdx +
            '" data-pool-slot="' + poolSlot + '">';
          html += '<div class="match-chip" draggable="true"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-left="' + poolLeft +
            '" data-from="pool" data-pool-index="' + poolSlot + '">' +
            escapeHtml(pairs[poolLeft].left) + '</div>';
          html += '</div>';
        } else {
          // Empty slot
          html += '<div class="match-empty match-left-slot match-drop-left"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-right="' + rightIdx +
            '" data-pool-slot="' + poolSlot + '">' +
            '<span class="slot-placeholder">Перетащите вариант</span>' +
            '</div>';
        }
        poolSlot++;
      }

      html += '<div class="matching-gap"></div>';

      html += '<div class="match-tile match-right-tile match-drop-right"' +
        ' data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">' +
        escapeHtml(pairs[rightIdx].right) + '</div>';

      html += '</div>'; // .matching-line
    });

    html += '</div>'; // .matching-board
    html += '<div class="navigation"><button type="button" class="btn" data-action="answer-submit">Принять ответ</button><button type="button" class="btn" data-nav="next">Далее</button></div>';
    return html;
  }

  // ─── Ranking: grip-based drag-and-drop ───────────────────────────────────────

  /** Per-question ranking state: ordered array of item indices. */
  var _rankingState = {};

  function getRankingState(q) {
    var qid = q.id;
