<div class="start-page">
  <div class="card start-header">
    <h1 class="start-title" data-path="course.title">Тест</h1>
    <p class="start-description" data-path="course.description"></p>
  </div>
  <div class="card start-info">
    <h2 class="start-info-heading">Информация о тесте</h2>
    <div class="start-info-grid">
      <div class="info-row">
        <span class="info-icon info-icon--blue" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        </span>
        <div class="info-row-body">
          <div class="info-row-label">Количество вопросов</div>
          <div class="info-row-value" data-path="course.questionCount"></div>
        </div>
      </div>
      <div class="info-row">
        <span class="info-icon info-icon--green" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </span>
        <div class="info-row-body">
          <div class="info-row-label">Проходной балл</div>
          <div class="info-row-value"><span data-path="course.passPercent"></span>%</div>
        </div>
      </div>
    </div>
  </div>
  <div class="start-actions">
    <button type="button" class="btn start-btn" data-action="start-test">Начать тестирование</button>
  </div>
</div>
