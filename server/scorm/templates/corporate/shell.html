<div class="tb-player" data-template="corporate">
  <div class="tb-progress-wrap">
    <div class="tb-progress-bar" id="tb-progress-fill"></div>
  </div>
  <div class="tb-player-body">
    <aside class="tb-sidebar" data-slot="topic-nav">
      <div class="tb-sidebar-header">
        <div class="tb-company-name">{{ params.companyName }}</div>
      </div>
      <div class="tb-sidebar-label">Темы</div>
      {{#each course.topics}}
      <div class="tb-topic-item" data-topic-id="{{ id }}">{{ title }}</div>
      {{/each}}
    </aside>
    <main id="app" class="tb-content" data-slot="page" tabindex="-1"></main>
  </div>
  <footer class="tb-footer">
    <button type="button" class="btn btn--ghost" data-nav="prev">Назад</button>
    <span class="tb-spacer"></span>
    <button type="button" class="btn tb-btn--hidden" data-action="answer-submit">Принять ответ</button>
    <button type="button" class="btn tb-btn--hidden" data-action="test-finish">Завершить тест</button>
    <button type="button" class="btn" data-nav="next">Далее</button>
  </footer>
</div>
