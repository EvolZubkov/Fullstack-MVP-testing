    .pv-nav-item:hover{background:var(--pv-muted)}

  <style id="tpl-styles">/* styles/theme.css */
/*
 * RTK certification — design tokens (PRD-7 branding).
 *
 * TWO layers, by design:
 *   1. The TEMPLATE ships a full light + dark palette here. It follows the viewer's
 *      SYSTEM theme (@media prefers-color-scheme) and an explicit override
 *      (:root[data-theme="light|dark"]) that always wins over the media query.
 *   2. The AUTHOR may still override any colour via design params — those are applied
 *      as inline CSS vars on the stage and win over this file. The params default to
 *      EMPTY (manifest `default: null`), so when the author sets nothing, this theme
 *      drives; when they set a colour, it overrides (in both light and dark).
 *
 * Colours are HSL COMPONENTS (bare triples, no hsl()) — base.css composes them as
 * hsl(var(--token)) so params and theme can both feed the same tokens.
 */

/* ── LIGHT (default) ───────────────────────────────────────────────────────── */
:root,
:root[data-theme="light"] {
  --frame: 240 5% 86%;              /* letterbox gutter */
  --background: 240 4% 93%;         /* stage */
  --foreground: 240 7% 11%;
  --border: 260 5% 90%;
  --card: 0 0% 100%;
  --card-foreground: 240 7% 11%;
  --card-border: 260 5% 90%;
  --primary: 15 100% 45%;          /* RTK #E33A00 */
  --primary-foreground: 0 0% 100%;
  --muted: 260 4% 89%;
  --muted-foreground: 217 6% 45%;
  --accent: 18 80% 96%;
  --destructive: 353 98% 41%;
  --success: 120 51% 38%;
  --lock: 240 3% 55%;
  --font-sans: 'Rostelecom Basis', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(60, 40, 20, 0.10);
}

/* ── DARK — the token overrides (system preference) ────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: 240 10% 4%;
    --background: 240 10% 10%;
    --foreground: 240 15% 92%;
    --border: 240 8% 24%;
    --card: 240 10% 14%;
    --card-foreground: 240 15% 92%;
    --card-border: 240 8% 26%;
    --primary: 15 100% 52%;
    --primary-foreground: 0 0% 100%;
    --muted: 240 8% 22%;
    --muted-foreground: 240 8% 64%;
    --accent: 15 40% 20%;
    --destructive: 353 75% 58%;
    --success: 120 40% 55%;
    --lock: 240 6% 48%;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
  }
}

/* ── DARK — explicit override (viewer toggle), wins over the media query ───── */
:root[data-theme="dark"] {
  --frame: 240 10% 4%;
  --background: 240 10% 10%;
  --foreground: 240 15% 92%;
  --border: 240 8% 24%;
  --card: 240 10% 14%;
  --card-foreground: 240 15% 92%;
  --card-border: 240 8% 26%;
  --primary: 15 100% 52%;
  --primary-foreground: 0 0% 100%;
  --muted: 240 8% 22%;
  --muted-foreground: 240 8% 64%;
  --accent: 15 40% 20%;
  --destructive: 353 75% 58%;
  --success: 120 40% 55%;
  --lock: 240 6% 48%;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
}

/* styles/base.css */
/**
 * RTK certification template — component stylesheet.
 * Loaded by BOTH hosts (manifest assets.styles = theme.css + base.css).
 *
 * Model: a FIXED 16:9 stage (Storyline-style slides). shell.html letterboxes a
 * `.tb-stage` (container-type:size) and mounts screens into `#app` (.tb-pad).
 * Learner screens size their type with container units (cqh/cqw) so everything
 * scales with the stage, exactly like the approved wireframes
 * (docs/wireframes/rtk-template-wireframes.html).
 *
 * Tokens live in theme.css and are composed here via hsl(var(--token)) so design
 * params can override them. Class names that the RUNTIME emits (.option, .tb-pill,
 * .navigation, .router-topic-card*, .content-placeholder--*, .results-*, .matching-*,
 * .rank-*, .feedback-block) are RESTYLED here — the names must stay as the runtime
 * writes them; the appearance is RTK.
 */

/* ===== Reset ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  color: hsl(var(--foreground));
  background: hsl(var(--frame));         /* letterbox gutter (theme-aware) */
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
}

/* ===== Fixed 16:9 stage (letterbox) ===== */
/* SCORM package only: the base index wraps the runtime-applied shell in `.container`
   (absent from the preview/web/admin shells, so this never leaks there). Give it the
   viewport height the letterboxed `.tb-frame` (min-height:100%) needs to fill + center. */
.container { height: 100%; }
.tb-frame {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(0px, 2vmin, 28px);
}
.tb-stage {
  position: relative;
  width: 100%;
  max-width: calc(100dvh * 16 / 9);
  aspect-ratio: 16 / 9;
  container-type: size;
  background: hsl(var(--background));
  border: 1px solid hsl(var(--border));
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(30, 24, 18, 0.16);
}
/* #app — the padded content area; screens + the runtime-appended nav live here. */
.tb-pad {
  position: absolute;
  inset: 0;
  padding: 6cqh 5.5cqw;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}
.tb-pad::-webkit-scrollbar { width: 8px; }
.tb-pad::-webkit-scrollbar-thumb { background: hsl(var(--muted)); border-radius: 4px; }
/* Direct screen wraps fill the pad so flex-grow / bottom-anchored nav work. */
.tb-pad > * { width: 100%; }
.tb-pad > .layout-question-wrap,
.tb-pad > .cover,
.tb-pad > .centered,
.tb-pad > .review-page,
.tb-pad > .content-page,
.tb-pad > .slide,
.tb-pad > .section-intro-page,
.tb-pad > .results-page,
.tb-pad > .transition-page,
.tb-pad > .layout-content-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

/* ===== Brand / logo ===== */
.tb-brand { display: flex; align-items: center; gap: 2cqw; }
.tb-brand__logo { max-height: 6.4cqh; max-width: 34cqw; width: auto; object-fit: contain; }
.brand-word { font-weight: 800; color: hsl(var(--primary)); font-size: 3.4cqh; letter-spacing: .02em; }

/* ===== Shared primitives ===== */
.eyebrow {
  font-weight: 700; font-size: 2.15cqh; letter-spacing: .16em;
  text-transform: uppercase; color: hsl(var(--primary));
}
.tb-h1 { font-size: 6.6cqh; line-height: 1.04; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.tb-h2 { font-size: 5cqh; line-height: 1.08; font-weight: 800; margin: 0; }
.tb-desc { font-size: 2.7cqh; line-height: 1.42; color: hsl(var(--muted-foreground)); margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 1.4cqw;
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  font-family: inherit; font-size: 2.7cqh; font-weight: 650; line-height: 1;
  border: 1.5px solid hsl(var(--primary)); border-radius: 1.5cqh;
  padding: 1.9cqh 4.2cqw; cursor: pointer; letter-spacing: .01em;
  transition: background .15s, box-shadow .15s, transform .1s;
  text-decoration: none;
}
.btn:hover { background: hsl(15 100% 40%); box-shadow: 0 1.4cqh 3cqh rgba(227, 58, 0, .22); }
.btn:active { transform: translateY(.4cqh); }
.btn:disabled, .btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn--ghost, .btn--outline, .btn-outline {
  background: transparent; color: hsl(var(--foreground)); border-color: hsl(var(--border));
}
.btn--ghost:hover, .btn--outline:hover, .btn-outline:hover { background: hsl(var(--accent)); border-color: hsl(var(--primary)); box-shadow: none; }

.chip {
  display: inline-flex; align-items: center; gap: 1cqw; font-size: 2.15cqh;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: 5cqh; padding: 1cqh 2.4cqw; color: hsl(var(--foreground)); font-weight: 550;
}
.chip b { color: hsl(var(--primary)); }
.imgph {
  background: repeating-linear-gradient(45deg, hsl(var(--muted)) 0 10px, hsl(240 5% 92%) 10px 20px);
  border: 1px solid hsl(var(--border)); border-radius: 2cqh;
  display: grid; place-items: center; color: hsl(var(--muted-foreground)); font-size: 2.2cqh;
}
.badge {
  font-size: 2.5cqh; font-weight: 700; border-radius: 5cqh; padding: 1.1cqh 3cqw;
  display: inline-flex; align-items: center; gap: 1.2cqw;
}
.badge.pass, .badge.is-pass { background: hsl(var(--success) / .14); color: hsl(var(--success)); border: 1px solid hsl(var(--success) / .5); }
.badge.fail, .badge.is-fail { background: hsl(var(--destructive) / .10); color: hsl(var(--destructive)); border: 1px solid hsl(var(--destructive) / .5); }

/* ===== START — cover ===== */
.cover { justify-content: center; }
.cover-grid {
  flex: 1; display: grid; grid-template-columns: 1.05fr .95fr; gap: 5cqw;
  align-items: center; min-height: 0;
}
.cover-col { display: flex; flex-direction: column; gap: 2.8cqh; align-items: flex-start; }
.cover-eyebrow { font-weight: 700; font-size: 2.3cqh; letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
.cover-title { font-size: 8cqh; line-height: 1.02; font-weight: 800; letter-spacing: -.015em; margin: 0; color: hsl(var(--foreground)); }
.cover-desc { font-size: 2.9cqh; line-height: 1.4; color: hsl(var(--muted-foreground)); max-width: 44cqw; }
.cover-actions { display: flex; flex-direction: column; gap: 1.6cqh; align-items: flex-start; margin-top: 1cqh; }
.cover-note { font-size: 2.05cqh; color: hsl(var(--destructive)); font-weight: 600; }
/* Right column — decorative brand panel (no start-image data field exists). */
/* Заливка ведётся от --primary: до PRD-23 градиент был прибит к фирменному
   оранжевому, и стоило автору сменить цвет кнопок, как обложка расходилась с
   остальным экраном. Оттенок и насыщенность берутся из токена, а объём даёт
   разная светлота — так плашка следует за палитрой и за темой. */
.cover-brand {
  align-self: stretch; min-height: 74cqh; border-radius: 3cqh;
  background:
    radial-gradient(120% 120% at 80% 15%,
      hsl(var(--primary) / .95),
      hsl(var(--primary)) 55%,
      color-mix(in srgb, hsl(var(--primary)) 70%, #000) 100%);
  position: relative; overflow: hidden; display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, hsl(var(--primary)) 60%, #000);
}
.cover-brand__mark { font-size: 12cqh; font-weight: 900; color: #fff; opacity: .96; letter-spacing: -.02em; }
.cover-brand__ring { position: absolute; width: 46cqh; aspect-ratio: 1; border-radius: 50%; border: 2.4cqh solid rgba(255,255,255,.16); right: -12cqh; bottom: -14cqh; }
.cover-brand__logo { max-height: 9cqh; max-width: 60%; object-fit: contain; filter: brightness(0) invert(1); }

/* Start-screen state cards (cooldown / prior / resume) — compact, on the cover. */
.start-state { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 1.8cqh; padding: 2cqh 2.6cqw; display: flex; flex-direction: column; gap: 1cqh; max-width: 52cqw; }
.start-state__title { font-size: 2.5cqh; font-weight: 700; }
.start-state__sub { font-size: 2.1cqh; color: hsl(var(--muted-foreground)); }
.start-state__row { font-size: 2.15cqh; }
.start-state__row strong { font-weight: 700; }
.prior-fail { color: hsl(var(--destructive)); font-weight: 700; }
.start-state .btn { font-size: 2.3cqh; padding: 1.3cqh 3cqw; }
.prior-actions { display: flex; gap: 1.4cqw; flex-wrap: wrap; margin-top: .6cqh; }

/* ===== SECTION-INTRO / centered system screens ===== */
.centered { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqh; text-align: center; min-height: 0; }
.centered .tb-desc { max-width: 62cqw; }
.section-metrics { display: flex; gap: 2cqw; flex-wrap: wrap; justify-content: center; }
.warn-line { font-size: 2.5cqh; line-height: 1.35; color: hsl(var(--primary)); font-weight: 650; max-width: 62cqw; }
.warn-line b { font-weight: 800; }
.si-title { font-size: 5cqh; line-height: 1.05; font-weight: 800; margin: 0; }
.si-instruction { text-align: left; background: hsl(var(--muted) / .5); border: 1px solid hsl(var(--border)); border-radius: 1.6cqh; padding: 1.4cqh 2.2cqw; font-size: 2.2cqh; line-height: 1.4; }
.si-instruction__head { font-size: 1.9cqh; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: .6cqh; }
/* Section-intro reskinned to the original: left-aligned, two info panels + «Важно!». */
.section-intro-page { gap: 1.4cqh; }
/* Section-intro can be content-dense (description + panels + instruction + important).
   Override the shared fixed-fill (flex:1 clamps height → content spills over the nav):
   grow to at least the stage, then grow further + let the pad scroll when taller. */
.tb-pad > .section-intro-page { flex: 0 0 auto; min-height: 100%; }
.si-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1cqh; }
/* Below the title: text column (left) + optional author illustration (right).
   No illustration → the content column simply fills the row (flex handles it). */
.si-main { flex: 0 0 auto; display: flex; gap: 4cqw; align-items: flex-start; }
.si-content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1.6cqh; }
.si-illustration { flex: 0 0 36%; align-self: stretch; display: flex; align-items: center; justify-content: center; min-width: 0; }
.si-illustration img { max-width: 100%; max-height: 46cqh; object-fit: contain; }
/* Instruction + «Важно!» span the full width BELOW the text/illustration row (mirrors
   the source, and keeps the whole screen on one fixed-stage view). */
.si-notes { flex: 0 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(38cqw, 1fr)); gap: 1.4cqh 2.4cqw; align-items: start; }
.si-desc { font-size: 2.45cqh; line-height: 1.45; color: hsl(var(--muted-foreground)); max-width: 76cqw; margin: 0; white-space: pre-line; }
.si-panels { display: flex; gap: 2.4cqw; flex-wrap: wrap; margin: 0; }
.si-panel { flex: 1 1 0; min-width: 0; background: hsl(var(--muted) / .5); border: 1px solid hsl(var(--border)); border-radius: 2cqh; padding: 2cqh 2.4cqw; }
.si-panel__big { font-size: 3.7cqh; font-weight: 800; color: hsl(var(--primary)); line-height: 1; }
.si-panel__sub { font-size: 2.05cqh; color: hsl(var(--muted-foreground)); margin-top: .6cqh; line-height: 1.38; }
.si-important__head { font-size: 2.4cqh; font-weight: 800; color: hsl(var(--primary)); margin-bottom: .5cqh; }
.si-important__body { font-size: 2.2cqh; line-height: 1.4; color: hsl(var(--foreground)); margin: 0; }

/* ===== QUESTION ===== */
.layout-question-wrap { gap: 0; }
/* Three-part top bar: section (left) · progress count (center) · question counter +
   timer (right). Inset 4px from the stage top/sides (не впритык к границе). */
.qbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2cqw;
  background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border));
  margin: calc(-6cqh + 4px) calc(-5.5cqw + 4px) 0; padding: 2.4cqh 5.5cqw; flex: 0 0 auto;
}
.qbar__l { display: flex; align-items: center; gap: 2.4cqw; justify-self: start; min-width: 0; }
.qbar__r { display: flex; align-items: center; gap: 2.4cqw; justify-self: end; }
.qbar__c { justify-self: center; min-width: 0; }
.qbar__logo { max-height: 4.4cqh; max-width: 22cqw; object-fit: contain; }
.qbar__brand { font-weight: 800; color: hsl(var(--primary)); font-size: 2.8cqh; }
.qbar__sec { font-size: 2.2cqh; font-weight: 700; color: hsl(var(--foreground)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qbar__count { font-size: 1.95cqh; font-weight: 650; color: hsl(var(--foreground)); white-space: nowrap; }
.q-timer {
  display: inline-flex; align-items: center; gap: 1cqw;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  font-size: 2.4cqh; font-weight: 700; letter-spacing: .02em;
  color: hsl(var(--primary-foreground));
  background: hsl(var(--primary)); border: none;
  border-radius: 1.1cqh; padding: .9cqh 2.2cqw;
}
.q-timer::before {
  content: ""; flex: 0 0 auto; width: 2.4cqh; height: 2.4cqh;
  background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='white'%20stroke-width='2.2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Ccircle%20cx='12'%20cy='12'%20r='9'/%3E%3Cpath%20d='M12%207v5l3%202'/%3E%3C/svg%3E") center/contain no-repeat;
}
.q-timer--hidden { display: none; }
/* Low-time urgency: switch the chip BACKGROUND to red (white digits stay readable —
   unlike red text on the orange chip). The !important overrides the runtime's inline
   red text set for the default template. */
.q-timer--urgent { background: hsl(var(--destructive)); color: hsl(var(--primary-foreground)) !important; }

/* the question body area (runtime fills the 4 slots inside .question-card).
   Scrolls INTERNALLY when the prompt + options exceed the fixed stage, so the qbar +
   pills stay pinned at the top and the runtime-appended nav (submit) stays at the
   bottom instead of being overlapped by long content. */
.question-card { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; padding: 4cqh 0 1cqh; }
/* Scroll is turned on by the runtime (fitQuestionText adds --scroll) ONLY when the body
   overflows even at the smallest text-fit step. Off otherwise so the debug «Эталон»
   markers (drawn in a left gutter OUTSIDE the option) aren't clipped by overflow. */
.question-card--scroll { overflow-y: auto; overflow-x: hidden; }
.question-card--scroll::-webkit-scrollbar { width: 8px; }
.question-card--scroll::-webkit-scrollbar-thumb { background: hsl(var(--muted)); border-radius: 4px; }
.question-meta { font-size: 2cqh; font-weight: 600; color: hsl(var(--muted-foreground)); margin-bottom: 1cqh; }
/* --q-fit: stepped text-fit multiplier the runtime lowers (1 → ~0.72) when the prompt +
   options overflow the fixed stage, so content shrinks to fit BEFORE scrolling. */
.question-text { font-size: calc(3.3cqh * var(--q-fit, 1)); line-height: 1.3; font-weight: 650; color: hsl(var(--foreground)); margin-bottom: calc(3cqh * var(--q-fit, 1)); }
.question-hint { font-size: calc(2.15cqh * var(--q-fit, 1)); color: hsl(var(--muted-foreground)); margin: calc(-2cqh * var(--q-fit, 1)) 0 calc(2.4cqh * var(--q-fit, 1)); }
[data-slot="question-interaction"], #question-input { display: block; }

/* options — runtime emits .option with a real <input> */
.option {
  display: flex; align-items: center; gap: 2.4cqw;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: 1.5cqh; padding: calc(1.9cqh * var(--q-fit, 1)) 2.6cqw; margin-bottom: calc(1.6cqh * var(--q-fit, 1));
  font-size: calc(2.5cqh * var(--q-fit, 1)); color: hsl(var(--foreground)); cursor: pointer;
  transition: border-color .12s, background .12s, box-shadow .12s;
}
.option:hover { border-color: hsl(var(--primary)); box-shadow: 0 .4cqh 1.4cqh rgba(227, 58, 0, .16); }
.option input { flex: 0 0 auto; width: 2.8cqh; height: 2.8cqh; accent-color: hsl(var(--primary)); cursor: pointer; }
.option.selected { border-color: hsl(var(--primary)); box-shadow: inset 0 0 0 1px hsl(var(--primary)); background: hsl(var(--accent)); }
.option.correct-answer { border-color: hsl(var(--success)); background: hsl(var(--success) / .12); }
.option.incorrect-answer { border-color: hsl(var(--destructive)); background: hsl(var(--destructive) / .10); }
.option.correct-answer input { accent-color: hsl(var(--success)); }
.option.incorrect-answer input { accent-color: hsl(var(--destructive)); }

/* progress bar (fallback when no pills) */
.progress-bar { height: 1cqh; background: hsl(var(--muted)); border-radius: 1cqh; overflow: hidden; margin-bottom: 2.4cqh; }
.progress-fill { height: 100%; background: hsl(var(--primary)); transition: width .3s; }

/* ===== progress pills (runtime .tb-pill) ===== */
.tb-pills { display: flex; flex-direction: column; gap: 1.2cqh; margin: 2.6cqh 0 1.6cqh; }
.tb-pills__dots { display: flex; flex-wrap: wrap; gap: .8cqw; }
.tb-pill {
  width: 3.8cqh; height: 3.8cqh; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 1.85cqh; font-weight: 650;
  background: hsl(var(--card)); color: hsl(var(--muted-foreground));
  border: 1.5px solid hsl(var(--border)); cursor: pointer; transition: transform .1s;
}
.tb-pill:hover:not(:disabled) { transform: scale(1.08); }
.tb-pill.is-answered { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.tb-pill.is-current { border-color: hsl(var(--primary)); border-width: 2.5px; color: hsl(var(--primary)); font-weight: 800; background: hsl(var(--card)); }
.tb-pill.is-skipped { border-color: hsl(var(--primary)); border-style: dashed; color: hsl(var(--primary)); background: hsl(var(--card)); }
.tb-pill.is-correct { background: hsl(var(--success)); border-color: hsl(var(--success)); color: #fff; }
.tb-pill.is-incorrect { background: hsl(var(--destructive)); border-color: hsl(var(--destructive)); color: #fff; }
.tb-pill.is-unanswered { border-color: hsl(var(--border)); border-style: dashed; color: hsl(var(--muted-foreground)); }
.tb-pill:disabled { opacity: .5; cursor: default; }
.tb-pill:focus-visible { outline: 2px solid hsl(var(--primary)); outline-offset: 2px; }
.tb-pills__legend { display: flex; flex-wrap: wrap; gap: 1cqh 2.4cqw; font-size: 1.85cqh; color: hsl(var(--muted-foreground)); }
.tb-pills__legend-item { display: inline-flex; align-items: center; gap: 1cqw; }
.tb-pills__legend-dot { width: 1.8cqh; height: 1.8cqh; border-radius: 50%; border: 1.5px solid hsl(var(--border)); }
.tb-pills__legend-dot.is-answered { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }
.tb-pills__legend-dot.is-current { border-color: hsl(var(--primary)); border-width: 2px; }
.tb-pills__legend-dot.is-skipped { border-color: hsl(var(--primary)); border-style: dashed; }
.tb-pills__legend-dot.is-locked { opacity: .45; }

/* ===== nav rows — runtime question nav (.navigation__left/right, buttons carry
   .btn / .btn.btn-outline) AND layout-owned navs. Just a flex wrapper; the buttons
   keep their .btn / .btn-outline appearance. ===== */
.navigation {
  display: flex; align-items: center; justify-content: space-between; gap: 2cqw;
  flex-wrap: wrap; margin-top: 2.6cqh; flex: 0 0 auto;
}
.navigation__left, .navigation__right { display: flex; align-items: center; gap: 2cqw; }
.navigation .btn { font-size: 2.4cqh; padding: 1.5cqh 3.4cqw; }
.section-results__card .navigation, .centered .navigation { justify-content: center; }
.navigation--end { justify-content: flex-end; }
/* Bottom-anchored nav (section-intro): must come AFTER `.navigation`'s margin-top
   so `auto` wins the equal-specificity cascade and the button floats to the pad floor. */
.navigation--bottom { margin-top: auto; }

/* ===== feedback (runtime .feedback-block uses inline colors; frame + fallback) ===== */
.feedback-block { margin-top: 2cqh; border-radius: 1.4cqh; font-size: 2.3cqh; }

/* ===== REVIEW ===== */
.review-page { gap: 0; }
.review-page__title { font-size: 4.4cqh; font-weight: 800; margin: 1cqh 0 0; }
.rv-stats { display: flex; gap: 2.5cqw; margin: 2cqh 0 1.6cqh; font-size: 2.2cqh; color: hsl(var(--muted-foreground)); flex-wrap: wrap; }
.rv-stats b { color: hsl(var(--foreground)); }
.rv-list { display: flex; flex-direction: column; gap: 1.2cqh; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.rv-row {
  display: flex; align-items: center; gap: 2cqw; width: 100%; text-align: left;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-left: 3px solid hsl(var(--primary)); border-radius: 1.2cqh;
  padding: 1.4cqh 2.6cqw; font-size: 2.25cqh; color: hsl(var(--foreground));
  font-family: inherit; cursor: pointer; transition: background .12s;
}
.rv-row:hover { background: hsl(var(--accent)); }
.rv-row .num { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: hsl(var(--primary)); flex: 0 0 auto; }
.rv-row .pr { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-row .go { font-size: 2cqh; color: hsl(var(--primary)); font-weight: 600; white-space: nowrap; }
.rv-hint { font-size: 2.05cqh; color: hsl(var(--muted-foreground)); margin: 1.4cqh 0; }

/* ===== SECTION-RESULTS / RESULTS shared ring (SVG, data-driven) ===== */
.results-page { display: flex; flex-direction: column; gap: 0; flex: 1 1 auto; min-height: 0; }
.results-ring { position: relative; width: 26cqh; aspect-ratio: 1; margin: 1cqh auto; }
.results-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring-bg { stroke: hsl(var(--muted)); }
.ring-fg { transition: stroke-dashoffset .5s ease; stroke: hsl(var(--primary)); }
.ring-fg.is-pass { stroke: hsl(var(--success)); }
.ring-fg.is-fail { stroke: hsl(var(--destructive)); }
.results-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.results-ring-pct { font-size: 6.4cqh; font-weight: 800; line-height: 1; }
.results-ring-label { font-size: 2.2cqh; color: hsl(var(--muted-foreground)); margin-top: .6cqh; }

/* section-results (centered card variant) */
.section-results .section-results__card,
.section-results__card { display: flex; flex-direction: column; align-items: center; gap: 2cqh; text-align: center; margin: auto; }
.section-results__eyebrow { font-size: 2.15cqh; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: hsl(var(--primary)); }
.section-results__title { font-size: 4.4cqh; font-weight: 800; }
.section-results__summary { font-size: 2.6cqh; color: hsl(var(--muted-foreground)); }

/* ===== RESULTS (runtime-owned .results-* structure — restyled) ===== */
.results-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.2cqh; margin-bottom: 2cqh; }
.results-hero-icon { width: 9cqh; aspect-ratio: 1; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); box-shadow: var(--shadow); }
.results-hero-icon.is-pass { color: hsl(var(--success)); background: hsl(var(--success) / .12); border-color: hsl(var(--success) / .3); }
.results-hero-icon.is-fail { color: hsl(var(--destructive)); background: hsl(var(--destructive) / .12); border-color: hsl(var(--destructive) / .3); }
.results-hero-icon.is-info { color: hsl(var(--primary)); background: hsl(var(--primary) / .12); border-color: hsl(var(--primary) / .3); }
.results-hero-title { font-size: 5.4cqh; font-weight: 800; }
.results-hero-sub { font-size: 2.6cqh; color: hsl(var(--muted-foreground)); }
.results-main-card, .card.results-main-card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 2cqh; padding: 3cqh 3cqw; text-align: center; box-shadow: var(--shadow); }
.results-main-title { font-size: 3cqh; font-weight: 800; }
.results-main-sub { font-size: 2.2cqh; color: hsl(var(--muted-foreground)); margin-top: .6cqh; }
.results-stats { display: flex; justify-content: center; align-items: flex-end; gap: 4cqw; flex-wrap: wrap; margin-top: 2cqh; }
.results-stat .v { font-size: 3.6cqh; font-weight: 800; line-height: 1; }
.results-stat .l { font-size: 1.9cqh; color: hsl(var(--muted-foreground)); margin-top: .6cqh; }
.results-pill { display: inline-flex; align-items: center; justify-content: center; padding: 1cqh 2.6cqw; border-radius: 5cqh; font-weight: 700; font-size: 2cqh; border: 1px solid hsl(var(--border)); }
.results-pill.is-pass { background: hsl(var(--success) / .16); border-color: hsl(var(--success) / .4); color: hsl(var(--success)); }
.results-pill.is-fail { background: hsl(var(--destructive) / .16); border-color: hsl(var(--destructive) / .4); color: hsl(var(--destructive)); }
.results-pill.is-info { background: hsl(var(--primary) / .16); border-color: hsl(var(--primary) / .4); color: hsl(var(--primary)); }
.results-section-title { font-size: 2.8cqh; font-weight: 800; margin: 2.6cqh 0 1.4cqh; }
.results-topics-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6cqh 2cqw; }
.card.topic-card, .topic-card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 1.6cqh; padding: 2cqh 2.4cqw; text-align: left; }
.topic-head { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; margin-bottom: 1cqh; }
.topic-name { font-size: 2.4cqh; font-weight: 700; }
.topic-row { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; margin-top: .8cqh; font-size: 2.05cqh; }
.topic-row .k { color: hsl(var(--muted-foreground)); }
.topic-row .val { font-weight: 700; }
.topic-bar { height: 1cqh; border-radius: 1cqh; background: hsl(var(--muted)); overflow: hidden; margin-top: 1.2cqh; }
.topic-bar-fill { height: 100%; background: hsl(var(--muted-foreground)); }
.topic-bar.is-pass .topic-bar-fill, .topic-bar.pass > div { background: hsl(var(--success)); }
.topic-bar.is-fail .topic-bar-fill { background: hsl(var(--destructive)); }
.topic-required, .topic-feedback, .topic-feedback-text { font-size: 1.9cqh; color: hsl(var(--muted-foreground)); margin-top: 1cqh; }
.results-actions { display: flex; justify-content: center; gap: 2cqw; margin-top: 2.4cqh; flex-wrap: wrap; }
/* Adaptive results: per-topic recommendation links (results.adaptive layout). */
.topic-links { display: flex; flex-direction: column; gap: .8cqh; margin-top: 1cqh; }
.topic-link { font-size: 2cqh; color: hsl(var(--primary)); text-decoration: none; }
.topic-link:hover { text-decoration: underline; }
.results-rec-list { display: flex; flex-direction: column; gap: 1cqh; }
.results-rec-item { display: block; padding: 1.2cqh 2cqw; background: hsl(var(--muted) / .5); border-radius: 1cqh; font-size: 2.1cqh; color: hsl(var(--foreground)); text-decoration: none; }
a.results-rec-item { color: hsl(var(--primary)); }

/* ===== TRANSITION (adaptive; restyled) ===== */
.transition-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqh; text-align: center; }
.transition-icon { width: 11cqh; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.transition-icon.is-pass { background: hsl(var(--success) / .16); color: hsl(var(--success)); }
.transition-icon.is-fail { background: hsl(var(--destructive) / .16); color: hsl(var(--destructive)); }
.transition-title { font-size: 4.6cqh; font-weight: 800; }
.transition-level { display: flex; align-items: center; gap: 1.6cqw; padding: 1.8cqh 3cqw; border-radius: 2cqh; border: 2px solid hsl(var(--border)); font-size: 2.4cqh; font-weight: 650; }
.transition-level.is-up { border-color: hsl(var(--success)); color: hsl(var(--success)); background: hsl(var(--success) / .12); }
.transition-level.is-down { border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); background: hsl(var(--destructive) / .12); }
.transition-level.is-complete { border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: hsl(var(--primary) / .12); }
.transition-level-icon { flex: 0 0 auto; width: 2.8cqh; height: 2.8cqh; }
.transition-level-msg { min-width: 0; }
.transition-topic { font-size: 2.4cqh; color: hsl(var(--muted-foreground)); }
.transition-actions { display: flex; justify-content: center; gap: 2cqw; margin-top: 1cqh; }

/* ===== BLOCKED (retake gate) ===== */
.blocked-card { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2.2cqh; }
.blocked-lock { width: 16cqh; aspect-ratio: 1; border-radius: 50%; background: hsl(var(--background)); border: 2px solid hsl(var(--lock)); display: grid; place-items: center; color: hsl(var(--lock)); }
.blocked-lock svg { width: 7.5cqh; height: 7.5cqh; }
.blocked-title { font-size: 4.6cqh; font-weight: 800; }
.blocked-description { font-size: 2.6cqh; color: hsl(var(--muted-foreground)); max-width: 60cqw; }
.blocked-date { font-family: ui-monospace, Consolas, monospace; font-size: 2.6cqh; font-weight: 700; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 1.4cqh; padding: 1.3cqh 3cqw; color: hsl(var(--foreground)); }

/* ===== CONTENT PAGES (runtime .content-page / .content-placeholder--*) ===== */
.layout-content-wrap { gap: 0; }
.content-page { display: flex; flex-direction: column; gap: 2cqh; flex: 1 1 auto; min-height: 0; }
.content-placeholder--title { font-size: 5cqh; font-weight: 800; line-height: 1.08; color: hsl(var(--foreground)); }
.content-placeholder--subtitle, .content-placeholder--lead { font-size: 2.7cqh; color: hsl(var(--muted-foreground)); line-height: 1.4; }
.content-placeholder--body { font-size: 2.5cqh; line-height: 1.5; color: hsl(var(--foreground)); }
.content-placeholder--body p { margin-bottom: 1.6cqh; }
.content-placeholder--body p:last-child { margin-bottom: 0; }
.content-placeholder--body a { color: hsl(var(--primary)); }
/* richText numbered / bulleted lists → RTK branded markers */
.content-placeholder--body ol, .content-placeholder--body ul { list-style: none; display: flex; flex-direction: column; gap: 1.6cqh; margin: 0 0 1.6cqh; }
.content-placeholder--body ol:last-child, .content-placeholder--body ul:last-child { margin-bottom: 0; }
.content-placeholder--body li { position: relative; padding-left: 6.2cqw; line-height: 1.4; }
.content-placeholder--body ol { counter-reset: tb-step; }
.content-placeholder--body ol > li { counter-increment: tb-step; }
.content-placeholder--body ol > li::before { content: counter(tb-step); position: absolute; left: 0; top: -.1cqh; width: 4.4cqh; height: 4.4cqh; border-radius: 50%; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-size: 2.2cqh; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.content-placeholder--body ul > li::before { content: ""; position: absolute; left: 1.4cqw; top: .55em; width: 1.4cqh; height: 1.4cqh; border-radius: 50%; background: hsl(var(--primary)); }
.content-placeholder--image, .content-placeholder--heroImage { border-radius: 2cqh; overflow: hidden; }
.content-placeholder--image img, .content-placeholder--heroImage img, .content-page img { max-width: 100%; border-radius: 2cqh; }

/* content nav (Далее) — layout-owned .navigation in content.html */
.layout-content-wrap > .navigation { justify-content: flex-end; margin-top: auto; }

/* ===== ROUTER (content page; runtime-appended cards) ===== */
.router-topic-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4cqh 2cqw; margin-top: 2.4cqh; }
.router-topic-card {
  display: flex; flex-direction: column; justify-content: space-between; gap: 1.4cqh;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 1.8cqh;
  padding: 2.4cqh 2.2cqw; cursor: pointer; text-align: left; font: inherit; color: hsl(var(--foreground));
  transition: border-color .15s, box-shadow .15s;
}
.router-topic-card:hover:not(:disabled) { border-color: hsl(var(--primary)); box-shadow: 0 .6cqh 2cqh rgba(227, 58, 0, .14); }
.router-topic-card:disabled { cursor: default; }
.router-topic-card--locked { opacity: .55; cursor: not-allowed; }
.router-topic-card--completed { border-color: hsl(var(--success)); }
.router-topic-card--inProgress { border-color: hsl(var(--primary)); }
.router-topic-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.6cqw; }
.router-topic-card__name { font-size: 2.5cqh; font-weight: 700; line-height: 1.15; flex: 1 1 auto; min-width: 0; }
.router-topic-card__img { flex: 0 0 auto; width: 9cqh; height: 9cqh; }
.router-topic-card__img img { width: 100%; height: 100%; object-fit: contain; }
.router-topic-card__optional { font-weight: 400; font-size: 1.9cqh; color: hsl(var(--muted-foreground)); margin-left: 1cqw; }
.router-topic-card__status { font-size: 1.95cqh; font-weight: 650; color: hsl(var(--muted-foreground)); }
.router-topic-card--completed .router-topic-card__status { color: hsl(var(--success)); }
.router-topic-card--inProgress .router-topic-card__status { color: hsl(var(--primary)); }
.router-topic-card__meta { display: flex; gap: 1cqw; flex-wrap: wrap; margin-top: .4cqh; }
.router-topic-card__chip { font-size: 1.85cqh; background: hsl(var(--muted) / .6); border: 1px solid hsl(var(--border)); border-radius: 5cqh; padding: .6cqh 1.6cqw; color: hsl(var(--muted-foreground)); white-space: nowrap; }
.router-topic-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; margin-top: .6cqh; padding-top: 1.2cqh; border-top: 1px solid hsl(var(--border)); }
.router-topic-card__go { font-size: 1.95cqh; font-weight: 700; color: hsl(var(--primary)); }
.router-topic-card__go::after { content: " \2192"; }
.router-finish--disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.router-finish--disabled:hover { background: hsl(var(--primary)); transform: none; box-shadow: none; }
.router-stats { display: flex; gap: 2cqw; flex-wrap: wrap; margin: 1.6cqh 0 .4cqh; }
.router-stat { display: flex; flex-direction: column; gap: .6cqh; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 1.4cqh; padding: 1.4cqh 2cqw; min-width: 20cqw; }
.router-stat__label { font-size: 1.85cqh; color: hsl(var(--muted-foreground)); line-height: 1.3; }
.router-stat__value { font-size: 2.8cqh; font-weight: 700; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
.router-progress { margin: 1.8cqh 0 .4cqh; }
.router-progress__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1cqh; }
.router-progress__label { font-size: 2cqh; font-weight: 600; color: hsl(var(--muted-foreground)); }
.router-progress__count { font-size: 2.2cqh; font-weight: 700; color: hsl(var(--foreground)); font-variant-numeric: tabular-nums; }

.matching-line.is-joined .match-tile, .matching-line.is-joined .match-empty { background: transparent; border: 0; }

/* ===== SLIDE — the author content page (учебная страница) =====
   ONE component behind every `info.*` and `gallery.*` variant, because the two are
   the same screen: heading block, a content card (text, optionally split with an
   image), and a footer with the navigation. The `gallery.*` variants add the
   sequence dots — that is the ONLY structural difference, so a page keeps its look
   when the author moves it in or out of a sequence.

   The variant keys, the placeholder keys (title/lead/body/image) and the settings
   (sequenceId/nextLabel/backgroundImage) are IDENTICAL to the standard template's,
   so a test switches between the two templates without re-binding its pages; only
   the appearance below is RTK. */
.slide { display: flex; flex-direction: column; gap: 3cqh; flex: 1 1 auto; min-height: 0; }
/* Optional per-page background image (the `backgroundImage` setting). Applied by the
   core to the screen root; the card keeps content readable on top. */
.slide.has-slide-bg { position: relative; background-size: cover; background-position: center; background-repeat: no-repeat; border-radius: 2cqh; }
/* Theme-adaptive scrim over the author's image: the heading/footer text follows the
   theme (light in dark theme), so a bare light image would render that text
   invisible. The scrim (theme background at ~82%) guarantees contrast in BOTH themes
   while the image still shows through; the card keeps its own solid surface. */
.slide.has-slide-bg::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: hsl(var(--background) / .82); z-index: 0; }
.slide.has-slide-bg > * { position: relative; z-index: 1; }

.slide__head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1cqh; }
/* A variant without a title/lead (or a page the author left blank) must not leave a
   gap where the heading block would be. */
.slide__head:not(:has(*:not(:empty))) { display: none; }
.slide__title { font-size: 5cqh; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; color: hsl(var(--foreground)); margin: 0; }
.slide__lead { font-size: 2.4cqh; font-weight: 650; color: hsl(var(--primary)); margin: 0; }
.slide__title:empty, .slide__lead:empty, .slide__media:empty { display: none; }

.slide__card { flex: 1 1 auto; min-height: 0; overflow-y: auto; background: hsl(var(--card)); border: 1px solid hsl(var(--card-border)); border-radius: 2.4cqh; padding: 3.4cqh 3.4cqw; box-shadow: var(--shadow); }
.slide__card::-webkit-scrollbar { width: 8px; }
.slide__card::-webkit-scrollbar-thumb { background: hsl(var(--muted)); border-radius: 4px; }
/* Split variants (image left / image right): two columns, but ONLY when the page
   actually carries an image. The media region is always present in the markup (the
   core fills it), so the split keys on a NON-EMPTY region — an image-variant page
   with no picture reads as a plain full-width card instead of a half-empty one.
   Column order comes from the layout file, not from a modifier. */
.slide--split .slide__card:has(.slide__media:not(:empty)) { display: grid; grid-template-columns: 1fr 1fr; gap: 4cqw; align-items: center; }
/* Theme-adaptive media frame (a muted panel that reads in BOTH themes) — the image
   sits inside it. Author images should be transparent PNG/SVG; a baked-in light/dark
   background would clash with the opposite theme. */
.slide__media { display: flex; align-items: center; justify-content: center; background: hsl(var(--muted) / .45); border: 1px solid hsl(var(--border)); border-radius: 2.4cqh; padding: 2.6cqh 2.6cqw; }
.slide__media img { max-width: 100%; max-height: 48cqh; object-fit: contain; }

.slide__body { font-size: 2.5cqh; line-height: 1.55; color: hsl(var(--foreground)); }
.slide__body > :first-child { margin-top: 0; }
.slide__body p { margin-bottom: 1.6cqh; }
.slide__body p:last-child { margin-bottom: 0; }
.slide__body a { color: hsl(var(--primary)); }
.slide__body ol, .slide__body ul { list-style: none; display: flex; flex-direction: column; gap: 1.4cqh; margin: 0 0 1.6cqh; }
.slide__body ol:last-child, .slide__body ul:last-child { margin-bottom: 0; }
.slide__body li { position: relative; padding-left: 6cqw; line-height: 1.4; }
.slide__body ol { counter-reset: g-step; }
.slide__body ol > li { counter-increment: g-step; }
.slide__body ol > li::before { content: counter(g-step); position: absolute; left: 0; top: -.1cqh; width: 4.2cqh; height: 4.2cqh; border-radius: 50%; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-size: 2.1cqh; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.slide__body ul > li::before { content: ""; position: absolute; left: 1.2cqw; top: .6em; width: 1.3cqh; height: 1.3cqh; border-radius: 50%; background: hsl(var(--primary)); }

   dots, and `margin-right:auto` on the (empty) dot row keeps the buttons where a
   gallery page has them — the two variants stay visually aligned. */
.slide__foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 2cqw; margin-top: auto; }
.slide__dots { display: flex; align-items: center; gap: 1.6cqw; margin-right: auto; }

.tb-pill--dot.is-current { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }

.slide__nav { display: flex; align-items: center; gap: 2cqw; }
.slide__nav .btn { font-size: 2.4cqh; padding: 1.5cqh 3.6cqw; }

<!-- PRD1 runtime: templateCore, renderers, contentPage -->
<script>/* server\scorm\template\app\templateCore.js */
/**
 * @module templateCore
 * @description TestBuilder Runtime Core — CSS variable application, placeholder
 * rendering, textFit modes, autoAdvance timer, and the window.TestBuilder API
 * consumed by design template scripts.
 *
 * Pure helper functions are exposed on TestBuilder._internal so they can be
 * unit-tested without a live DOM or SCORM session.
 */
(function (root) {
  "use strict";

  // ─── Path resolver ────────────────────────────────────────────────────────

  /**
   * Resolves a dot-notation path in an object.
   * @param {object} obj
   * @param {string} path
   * @returns {*}
   */
  function resolvePath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // ─── CSS variables ────────────────────────────────────────────────────────

  /**
   * Builds a { "--css-var": "value" } map from effective params and the
   * manifest param definitions that declare a cssVar property.
   * @param {object} params  Effective param values
   * @param {Array}  manifestParams  Array of param definitions from manifest
   * @returns {object}
   */
  function buildCssVarDeclarations(params, manifestParams) {
    // Canonical mapping lives in shared/template/params-css and is exposed on the
    // TBTemplate runtime bundle. Delegate to it so the package runtime and the web
    // preview never drift. The inline copy below is a byte-for-byte fallback used
    // only when the bundle is not present (defensive — keeps the package working).
    if (root.TBTemplate && typeof root.TBTemplate.buildTemplateCssVars === "function") {
      return root.TBTemplate.buildTemplateCssVars(params, manifestParams);
    }
    var result = {};
    if (!manifestParams || !params) return result;
    var defaultCssVars = {
      primaryColor: "--primary",
      backgroundColor: "--background",
      foregroundColor: "--foreground",
      cardColor: "--card",
      cardBorderColor: "--card-border",
      borderColor: "--border",
      mutedColor: "--muted",
      accentColor: "--accent",
      fontFamily: "--font-sans"
    };
    manifestParams.forEach(function (def) {
      var cssVar = def.cssVar || defaultCssVars[def.key];
      if (!cssVar) return;
      var value = resolvePath(params, def.key);
      if (value === null || value === undefined) value = def.default;
      if (value === null || value === undefined) return;
      var cssValue =
        typeof value === "number"
          ? String(value) + (def.cssUnit || "px")
          : String(value);
      result[cssVar] = cssValue;
    });
    return result;
  }

  /**
   * Applies CSS custom properties derived from params to document.documentElement.
   * @param {object} params
   * @param {Array}  manifestParams
   */
  function applyCssVarsToRoot(params, manifestParams) {
    var vars = buildCssVarDeclarations(params, manifestParams);
    var el =
      typeof document !== "undefined" ? document.documentElement : null;
    if (!el) return;
    Object.keys(vars).forEach(function (name) {
      el.style.setProperty(name, vars[name]);
    });
  }

  /**
   * PRD-23: paints a themed template. The per-theme colours go in as a stylesheet
   * appended LAST (a media query cannot scope inline custom properties, and the
   * dark value must apply only under the dark palette), and the author's pinned
   * palette goes on `<html data-theme>`. «Авто» leaves the attribute off so the
   * template's own `prefers-color-scheme` rules decide.
   *
   * No-ops without the shared bundle: printing is not something to duplicate by
   * hand here, and a package built by this codebase always ships it.
   * @param {object} design    TEST_DATA.designSettings
   * @param {object} manifest  Template manifest (params[] + themes[])
   */
  function applyThemeCss(design, manifest) {
    if (typeof document === "undefined") return;
    if (!root.TBTemplate || typeof root.TBTemplate.buildTemplateThemeCss !== "function") return;
    var css = root.TBTemplate.buildTemplateThemeCss(design, manifest);
    var pinned = root.TBTemplate.sceneThemeAttribute(design, manifest);
    var el = document.documentElement;
    if (pinned) el.setAttribute("data-theme", pinned);
    else el.removeAttribute("data-theme");
    if (!css) return;
    var style = document.getElementById("tb-theme-vars");
    if (!style) {
      style = document.createElement("style");
      style.id = "tb-theme-vars";
      (document.head || el).appendChild(style);
    }
    style.textContent = css;
  }

  /**
   * Revision «Стандартный» on ui-kit: make `<html>` the DS theme provider — `.ou`
   * plus the active palette class — so the vendored design system's semantic tokens
   * (`.ou`/`.ou--dark`) resolve for every screen (rendered into a descendant #app).
   * Mirrors the web host, which puts the same classes on its shadow root. The palette
   * is the author's pin; a themed «Авто» follows the system; a non-themed template
   * (the default «Стандартный», dark) resolves to dark.
   * @param {object} design    TEST_DATA.designSettings
   * @param {object} manifest  Template manifest (params[] + themes[])
   */
  function applyDsThemeClass(design, manifest) {
    if (typeof document === "undefined") return;
    var el = document.documentElement;
    el.classList.add("ou");
    var TB = root.TBTemplate;

 * section) + the author instruction (slot) — instead of the generic content wrapper.
 * Returns true when it rendered; false (caller falls back to the wrapper) when the
 * layout, the renderer, or the matching section is unavailable.
 * @param {object} page  An intro content page (kind: "intro").
 * @returns {boolean}
 */
function pluralQuestions(n) {
  var abs = Math.abs(n) % 100;
  var d = abs % 10;
  if (abs > 10 && abs < 20) return "вопросов";
  if (d === 1) return "вопрос";
  if (d > 1 && d < 5) return "вопроса";
  return "вопросов";
}

function pluralMinutes(n) {
  var abs = Math.abs(n) % 100;
  var d = abs % 10;
  if (abs > 10 && abs < 20) return "минут";
  if (d === 1) return "минута";
  if (d > 1 && d < 5) return "минуты";
  return "минут";
}

/**
 * Plain-JS fallback for buildSectionIntroContext — used only when the shared
 * builder is absent from the (per-process cached) TBTemplate bundle, e.g. in dev
 * before a server restart picks up a newly-added export. Mirrors
 * shared/template/result-context.buildSectionIntroContext exactly so the screen
 * renders identically regardless of which path built the context.
 */
function buildSectionIntroFallback(inp) {
  var count = Math.max(0, Math.round(inp.questionCount || 0));
  var desc = (inp.description == null ? "" : String(inp.description)).trim();
  var hasTime = !!(inp.timeLimitMinutes && inp.timeLimitMinutes > 0);
  var instr = typeof inp.instruction === "string" ? inp.instruction : "";
  var instrText = instr.replace(/<[^>]*>/g, "").trim();
  var illo = (inp.illustration == null ? "" : String(inp.illustration)).trim();
  var secNum = inp.sectionNumber || 1;
  var secTotal = inp.sectionsTotal && inp.sectionsTotal > 0 ? inp.sectionsTotal : 0;
  var sectionIntro = {
    eyebrow: secTotal ? "Раздел " + secNum + " из " + secTotal : "Раздел " + secNum,
    topicName: inp.topicName || "",
    description: desc,
    hasDescription: desc.length > 0,
    questionCount: count,
    questionCountLabel: count + " " + pluralQuestions(count),
    hasTimeLimit: hasTime,
    timeLimitLabel: hasTime ? String(inp.timeLimitMinutes) + " " + pluralMinutes(inp.timeLimitMinutes) : "",
    hasInstruction: instrText.length > 0,
    illustrationUrl: illo,
    hasIllustration: illo.length > 0,
    continueLabel: inp.continueLabel || "Далее",
  };
  if (secTotal) sectionIntro.progressPercent = Math.round((secNum / secTotal) * 100);
  return {
    course: { title: inp.courseTitle || inp.topicName || "", subtitle: inp.subtitle || "" },
    sectionIntro: sectionIntro,
  };
}

function renderSectionIntro(page) {
  // Falls back to the standard template's section-intro when this template declares
  // no `intro` variant (PRD-1 §4.3.2); returning false below drops the page to the
  // generic content render, which is what a template without the screen should get.
  var layout = (typeof systemLayout === "function")
    ? systemLayout("section-intro")
    : ((typeof state !== "undefined" && state && state.templateLayouts) || {})["section-intro"];
  var TB = (typeof window !== "undefined") ? window.TBTemplate : null;
  // NOTE: do NOT require TB.buildSectionIntroContext here — it is a recent export
  // and may be missing from the per-process-cached runtime bundle in dev. Only
  // TB.renderScreenInto (long-present) is required; the context is built via the
  // shared builder when available, else the inline fallback above.
  if (!layout || !TB || !TB.renderScreenInto) return false;

  var sections = (typeof TEST_DATA !== "undefined" && TEST_DATA.sections) || [];
  var section = null, idx = -1;
  for (var i = 0; i < sections.length; i++) {
    if (sections[i].topicId === page.topicId) { section = sections[i]; idx = i; break; }
  }
  if (!section) return false;

  var values = getPageValues(page);
  var instruction = values && values.instruction != null ? String(values.instruction) : "";
  // Author section illustration (image placeholder on the intro content template).
  var illoRaw = values && values.illustration;
  var illustrationUrl = illoRaw && typeof illoRaw === "object" ? (illoRaw.url || "") : (illoRaw || "");
  var introInput = {
    sectionNumber: idx + 1,
    sectionsTotal: sections.length,
    courseTitle: (typeof TEST_DATA !== "undefined" ? TEST_DATA.title : "") || section.topicName,
    subtitle: (typeof scormCourseSubtitle === "function") ? scormCourseSubtitle() : "",
    topicName: section.topicName,
    description: section.topicDescription,
    questionCount: section.drawCount,
    timeLimitMinutes: section.timeLimitMinutes,
    instruction: instruction,
    illustration: illustrationUrl,
    continueLabel: "Далее",
  };
  var built = TB.buildSectionIntroContext
    ? TB.buildSectionIntroContext(introInput)
    : buildSectionIntroFallback(introInput);
  var context = {
    course: built.course,
    design: (typeof scormDesignContext === "function") ? scormDesignContext() : {},
    sectionIntro: built.sectionIntro,
  };

  var app = document.getElementById("app");
  app.innerHTML = "";
  // Mount the layout root DIRECTLY into #app (no intermediate wrapper) so the
  // fixed-stage flex chain (.tb-pad > .section-intro-page) applies — mirrors
  // renderGalleryPage. A wrapper div would make the root a grandchild of .tb-pad,
  // defeating the child-combinator fill/anchor rule.
  // The author instruction is sanitized rich text → injected raw via the slot (the
  // same trust model as info-page bodies / the question-interaction slot).
  if (typeof applySystemScreenStyles === "function") applySystemScreenStyles("section-intro");
  TB.renderScreenInto(app, { layout: layout, context: context, slots: { instruction: instruction } });
  // Section-intro is inside the timed flow (and inside a section) — reveal + paint
  // the running test/section countdowns.
  if (typeof revealSceneTimers === 'function') revealSceneTimers(app);
  var btn = app.querySelector('[data-action="section-intro-continue"]');
  if (btn) btn.addEventListener("click", function () {
    if (typeof advancePageSequence === "function") advancePageSequence();
  });
  // «Назад»: return to the ACTUAL previous screen via the recorded nav route
  // (a preceding content page, or the router hub) instead of a hard-coded target
  // — in router mode the section-intro is index 0 of a rebuilt topic chunk, so a
  // plain currentPageIndex-1 clamps to itself and does nothing. Shown only when
  // the layout renders the back button.
  var back = app.querySelector('[data-action="section-intro-back"]');
  if (back) back.addEventListener("click", function () {
    if (typeof navigateBackOrPrevPage === "function") navigateBackOrPrevPage();
  });
  return true;
}


/**
 * PRD-22 FR-36: resolves relative links in author values against the template's
 * assets, which the package stores under `template/`. Without a base a link like
 * `images/diagram.png` would resolve next to index.html, where nothing lives.
 * @param {object} values  Author values of a content page
 * @returns {object} the same values with relative src/href prefixed
 */
function withTemplateAssets(values) {
  var TB = (typeof window !== "undefined") ? window.TBTemplate : null;
  if (!TB || !TB.withTemplateAssetBaseInValues) return values;
  return TB.withTemplateAssetBaseInValues(values, "template/");
}

/**
 * PRD-22: the `page.*` context of a content page — navigation dots of its
 * sequence plus the back affordance. Sequences are computed by the SHARED core
 * from the test's structure, so the LMS package, the web host and the preview
 * count identically; `canGoBack` is host state and is supplied here, because only
 * the runtime knows whether there is a screen to return to (in router mode the
 * first page of a topic returns to the hub).
 * @param {object} page  A content page from TEST_DATA.contentPages
 * @returns {object} `{ dots, dotIndex, dotsTotal, canGoBack }`
 */
function buildPageRenderContext(page) {
  var TB = (typeof window !== "undefined") ? window.TBTemplate : null;
  var canGoBack =
    (typeof canNavigateBack === "function" && canNavigateBack()) ||
    (typeof state !== "undefined" && state && (state.currentPageIndex || 0) > 0) ||
    (typeof RouterFlow !== "undefined" && RouterFlow.isRouterMode && RouterFlow.isRouterMode());
  if (!TB || !TB.buildPageContextFor || !page) {
    return { dots: [], dotIndex: 0, dotsTotal: 0, canGoBack: !!canGoBack };
  }
  var pages = (typeof TEST_DATA !== "undefined" && TEST_DATA.contentPages) ? TEST_DATA.contentPages : [];
  return TB.buildPageContextFor(page.id, pages, { canGoBack: !!canGoBack });
}

/**
 * Applies the page's `backgroundImage` setting (PRD-22 FR-27) to the screen root.
 * A background is a page PROPERTY, not content: it never goes through a
 * placeholder region, so the core applies it directly.
 * @param {Element} app   The #app element the screen was rendered into
 * @param {object}  page  A content page from TEST_DATA.contentPages
 */
function applyPageBackground(app, page) {
  var settings = (page && (page.settings || page.settingsJson)) || {};
  var raw = settings.backgroundImage;
  var url = raw && typeof raw === "object" ? (raw.url || "") : (raw || "");
  if (!url) return;
  var root = app.firstElementChild || app;
  root.classList.add("has-slide-bg");
  root.style.backgroundImage = 'url("' + String(url).replace(/"/g, "%22") + '")';
}

/**
 * Finds the layout's OWN navigation button for a direction (`next` / `prev`).
 *
 * The contract is the `data-nav` attribute, not the wrapper's class: a layout is
 * free to name its footer whatever it likes (`.navigation`, `.gallery__nav`, …),
 * and the certification gallery does exactly that. Keying the lookup on
 * `.navigation` left such a layout with a dead «Далее».
 *
 * Buttons INSIDE the page-content slot belong to the author's content, not to the
 * screen chrome, so they are skipped — a stray `data-nav` in pasted markup must
 * not become the screen's navigation.
 * @param {Element} app  The #app element the screen was rendered into
 * @param {string}  dir  Navigation direction: `"next"` or `"prev"`
 * @returns {Element|null}
 */
function findScreenNavButton(app, dir) {
  var nodes = app.querySelectorAll('[data-nav="' + dir + '"]');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    if (node.closest && node.closest('[data-slot="page-content"]')) continue;
    return node;
  }
  return null;
}

function renderContentPage(page, contentTemplates) {
  var app = document.getElementById("app");
  if (!app) return;

  // Cancel any previous autoAdvance timer
  var tb = typeof window !== "undefined" ? window.TestBuilder : null;
  if (tb && tb._internal) tb._internal.cancelAutoAdvance();

  // PRD-1 §4.3: «Введение раздела» renders via its own section-intro layout
  // (topic metadata + author instruction), not the generic content wrapper.
  if (page && page.kind === "intro" && renderSectionIntro(page)) return;

  var contentTemplate = findContentTemplate(page, contentTemplates);
  // PRD-22 FR-36: relative links in author content point at the TEMPLATE's files,
  // which live under `template/` inside the package. The stored value is
  // host-independent, so the base is applied here, at render time.
  var values = withTemplateAssets(getPageValues(page));
  var placeholderStyles = getPagePlaceholderStyles(page);
  var skeleton = buildContentPageSkeleton(page, contentTemplate);

  // Primary path: render the page's layout and fill the page-content slot with the
  // placeholder skeleton — the SAME layout/renderer the web host uses. The variant's
  // own `layoutFile` wins (spec §8.2): a template may ship one layout per page, and
  // resolving everything through the single `content` key would render them all as
  // whichever page that key happens to point at. Falls back to `content`, then to
  // mounting the skeleton directly.
  var layouts = (typeof state !== "undefined" && state) ? state.templateLayouts : null;
  // A variant's own layout is only usable when THIS path can supply the context it
  // binds against. `intro` variants render section-intro, which needs `sectionIntro.*`
  // — built by renderSectionIntro from the page's section. When that declined (an
  // `intro` page with no matching section, e.g. a test-scope one), rendering its
  // layout here produced a blank card: every binding empty and the continue button
  // unwired. The generic wrapper at least shows the author's content and navigates.
  var declinedOwnLayout = page && page.kind === "intro";
  var layout = (layouts && !declinedOwnLayout && contentTemplate && contentTemplate.layoutFile && layouts[contentTemplate.layoutFile])
    || (layouts && layouts["content"]);
  var TB = (typeof window !== "undefined") ? window.TBTemplate : null;
  var host;
  if (layout && TB && TB.renderScreenInto) {
    app.innerHTML = "";
    // PRD-22: navigation dots + header caption/progress of the page sequence,
    // computed by the shared core from the structure — the author supplies only
    // the identifier. A layout without an indicator simply ignores the block.
    var pageCtx = buildPageRenderContext(page);
    // Mount directly into #app (no wrapper) so .tb-pad > .tb-scene fills
    // the fixed stage and the bottom nav anchors.
    TB.renderScreenInto(app, {
      layout: layout,
      context: {
        course: {
          title: (typeof TEST_DATA !== "undefined" ? TEST_DATA.title : ""),
          subtitle: (typeof scormCourseSubtitle === "function") ? scormCourseSubtitle() : ""
        },
        // Per-test branding: the shared header binds `{{#if design.logoUrl}}`, so a
        // content page must carry `design` too or the logo goes missing on it.
        design: (typeof scormDesignContext === "function") ? scormDesignContext() : {},
        page: pageCtx
      },
      slots: { "page-content": skeleton }
    });
    host = app.querySelector('[data-slot="page-content"]') || app;
    var navBtn = findScreenNavButton(app, "next");
    if (navBtn) navBtn.onclick = function () { if (typeof advancePageSequence === "function") advancePageSequence(); };
    // «Назад» is optional: only layouts that render it get it wired, and it
    // follows the recorded nav route (router hub fallback included).
    var prevBtn = findScreenNavButton(app, "prev");
    if (prevBtn) prevBtn.onclick = function () {
      if (typeof navigateBackOrPrevPage === "function") navigateBackOrPrevPage();
    };
    applyPageBackground(app, page);
    // Content pages + the router hub are inside the timed flow — reveal + paint the
    // running countdowns (no-op when no limit runs / the layout has no timer markup).
    if (typeof revealSceneTimers === 'function') revealSceneTimers(app);
  } else {
    app.innerHTML = skeleton;
    host = app;
    var nav = document.createElement("div");
    nav.className = "navigation";
    nav.style.justifyContent = "flex-end";
    nav.innerHTML = '<button class="ou-btn ou-btn--primary ou-btn--m" data-nav="next" onclick="advancePageSequence()">Далее</button>';
    app.appendChild(nav);
  }

  fillContentPagePlaceholders(host, contentTemplate, values, placeholderStyles, tb);

  // autoAdvance
  if (page.autoAdvance && page.autoAdvanceDelayMs && tb && tb._internal) {
    tb._internal.startAutoAdvance(page.autoAdvanceDelayMs, function () {
      if (typeof advancePageSequence === "function") advancePageSequence();
      else if (typeof next === "function") next();
    });
  }

  // Template lifecycle event
  if (tb && tb.template) {
    tb.template.emit("page:enter", { page: page });
  }
}


/* server\scorm\template\app\routerFlow.js */
/**
 * @module routerFlow
 * @description PRD-4 v1.1 §4.7 router_by_topics runtime: state machine
 * around the linear pageSequence. Loaded only when
 * `TEST_DATA.flowPolicy.mode === "router_by_topics"`.
 *
 * Learner flow:
 *   1. Test-before content pages run linearly (existing pageSequence logic).
 *   2. Router page renders; learner picks a topic card.
 *   3. {@link selectRouterTopic} swaps pageSequence to that topic's chunk
 *      (before_topic content → questions → after_topic content).
 *   4. {@link returnFromTopic} fires when the chunk's last page advances;
 *      marks the topic completed, re-enters the router page.
 *   5. When `routerCompletionPolicy` is satisfied, {@link finishRouter}
 *      switches to the post-router sequence (test-after + results).
 *
 * Phase 4c-ii/iii contract. Phase 4c-iv adds completion policy + unlock
 * rules. Phase 4d wires adaptive sessions inside topic chunks.
 */
(function (root) {
  "use strict";

  /**
   * True if the test runs in router_by_topics mode and the router runtime
   * should take over navigation. Other modes ignore this module.
   */
  function isRouterMode() {
    return (
      typeof TEST_DATA !== "undefined" &&
      TEST_DATA.flowPolicy &&
      TEST_DATA.flowPolicy.mode === "router_by_topics"
    );
  }

  /**
   * Lists the questions for a single topic in the order generateVariant
   * produced them (which, in router/linear-by-topics modes, preserves
   * section order). The mapping back to flatQuestions index is what
   * downstream answer/feedback flow expects.
   */
  function indicesForTopic(topicId) {
    var out = [];
    for (var i = 0; i < state.flatQuestions.length; i++) {
      if (state.flatQuestions[i].topicId === topicId) out.push(i);
    }
    return out;
  }

  /**
   * Builds the pageSequence chunk for one topic: before_topic content →
   * questions for that topic → after_topic content. Reused by
   * {@link selectRouterTopic} every time the learner picks a topic.
   *
   * Delegates to the shared builder (`shared/flow/page-sequence`, exposed as
   * `TBTemplate`) so a topic chunk here is assembled by exactly the same rules
   * as the linear flow and the web host — including the filter that keeps system
   * design-bindings (`questions`, `start`, `results`) and PRD-19 section nodes
   * out of the sequence, which is what stops a blank «Далее» page appearing at
   * the section start.
   */
  function buildTopicChunk(topicId) {
    return TBTemplate.buildTopicChunk(
      TEST_DATA.contentPages,
      topicId,
      indicesForTopic(topicId),
    );
  }

  /**
   * Builds the post-router test-end sequence: test-scope «after» content, split
   * at the `summary` boundary (pages past it are deferred to
   * state.postResultsPages and render after the results screen).
   */
  function buildPostRouterSequence() {
    var after = TBTemplate.buildAfterZone(TEST_DATA.contentPages);
    state.postResultsPages = after.postResultsPages;
    return after.preResults;
  }

  /** The hub state the shared rules read (topic states + frozen results + policy). */
  function hubState() {
    return {
      topicStates: state.routerTopicStates || {},
      sectionResults: state.sectionResults || {},
      unlockRules: (TEST_DATA.flowPolicy && TEST_DATA.flowPolicy.sectionUnlockRules) || {},
      completionPolicy:
        (TEST_DATA.flowPolicy && TEST_DATA.flowPolicy.routerCompletionPolicy) || null,
      // PRD-19: a completed section's card shows its pass/fail only when the test
      // reveals section results; otherwise the hub keeps it a neutral «Завершена».
      showSectionResults: TEST_DATA.showSectionResults !== false,
    };
  }

  /** PRD-4 v1.1 §4.7 — delegated to shared/flow/router-hub (single source). */
  function isSectionUnlocked(section) {
    return TBTemplate.isSectionUnlocked(section, hubState());
  }

  /** PRD-4 v1.1 §4.7 — delegated to shared/flow/router-hub (single source). */
  function isRouterReadyToFinish() {
    return TBTemplate.isRouterReadyToFinish(TEST_DATA.sections || [], hubState());
  }

  /**
   * Renders the router page using the existing renderContentPage flow and
   * then augments the resulting DOM with clickable topic cards. The card
   * list reads TEST_DATA.sections (topic order, name) and per-topic state
   * from state.routerTopicStates. Phase 4c-iv adds `locked` state from
   * sectionUnlockRules and gates «Завершить» behind
   * routerCompletionPolicy.
   */
  function renderRouterPage(page) {
    var manifest = state.templateManifest || {};
    if (typeof renderContentPage === "function") {
      renderContentPage(page, manifest.contentTemplates || []);
    }
    var app = document.getElementById("app");
    if (!app) return;
    // The router hub is the test-entry menu — the attempt subtitle ("Попытка N")
    // belongs on the in-attempt screens, not on the section menu. Drop it.
    var sub = app.querySelector(".tb-scene__subtitle");
    if (sub && sub.parentNode) sub.parentNode.removeChild(sub);
    // The router is a HUB, but «Завершить» belongs in the STANDARD footer, in the
    // usual navigation slot — the content wrapper's own primary button, repurposed
    // below (label + gating + handler). Drop only the fallback `.navigation` block
    // (the no-layout branch of renderContentPage), which would duplicate it.
    var nav = app.querySelector(".navigation");
    if (nav && nav.parentNode) nav.parentNode.removeChild(nav);
    // Cards live INSIDE the content wrapper's page-content slot — the SAME DOM the
    // preview builds — so the run and the structure preview look identical.
    var host = app.querySelector('[data-slot="page-content"]') || app;
    // Cards / progress / «Завершить» come from the SHARED builder — the same
    // markup and the same open/locked rules the web host renders, so a section
    // cannot be clickable in one runtime and dead in the other.
    var prev = host.querySelector(".router-hub");
    if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
    var hub = document.createElement("div");
    hub.className = "router-hub";
    hub.innerHTML = TBTemplate.buildRouterHubHtml(TEST_DATA.sections || [], hubState(), {
      deadline: TEST_DATA.deadline || null,
    });
    host.appendChild(hub);

    // Delegate the builder's data-action contract onto this runtime's handlers.
    Array.prototype.forEach.call(
      hub.querySelectorAll('[data-action]'),
      function (el) {
        var action = el.getAttribute("data-action") || "";
        if (action.indexOf("router-select:") === 0) {
          var topicId = action.slice("router-select:".length);
          el.onclick = function () { selectRouterTopic(topicId); };
        } else if (action === "router-finish") {
          el.onclick = finishRouter;
        }
      },
    );

    var ready = isRouterReadyToFinish();

    // «Завершить» in the standard footer: the content wrapper's primary nav button,
    // relabelled and wired to finishRouter, inert until every required section is
    // done. Re-runs on each hub render, so completing a section enables it.
    var finishBtn = typeof findScreenNavButton === "function"
      ? findScreenNavButton(app, "next")
      : null;
    if (finishBtn) {
      finishBtn.textContent = "Завершить";
      finishBtn.disabled = !ready;
      if (ready) {
        finishBtn.removeAttribute("aria-disabled");
        finishBtn.onclick = finishRouter;
      } else {
        finishBtn.setAttribute("aria-disabled", "true");
        finishBtn.onclick = null;
      }
    }

    // PRD-8 FR-18: emit router lifecycle events for diagnostics + template
    // extensions. The first time the «Завершить» action becomes available
    // we additionally emit router:finalResultUnlocked so templates can
    // highlight the transition (e.g. animate the button into view).
    emitRouterEvent("router:shown", {
      sections: (TEST_DATA.sections || []).map(function (s) {
        return {
          topicId: s.topicId,
          topicName: s.topicName,
          required: s.required !== false,
          status: state.routerTopicStates[s.topicId] || "notStarted",
          unlocked: isSectionUnlocked(s),
        };
      }),
      readyToFinish: ready,
    });
    if (ready && !state._routerFinalUnlockedFired) {
      state._routerFinalUnlockedFired = true;
      emitRouterEvent("router:finalResultUnlocked", {});
    }
  }

  /**
   * PRD-8 FR-18: thin helper around TestBuilder.template.emit that
   * tolerates missing TestBuilder instance (defensive in case the
   * runtime bundle skipped templateCore for any reason).
   */
  function emitRouterEvent(name, data) {
    var tb = typeof window !== "undefined" ? window.TestBuilder : null;
    if (tb && tb.template && typeof tb.template.emit === "function") {
      tb.template.emit(name, data || {});
    }
  }

  // statusLabel / pluralQuestions moved to shared/flow/router-hub with the hub
  // markup that used them — no local copies to drift.

  /**
   * Marks the topic as in-progress and starts the topic's runtime. In
   * standard mode this is a linear chunk (before_topic content → questions
   * → after_topic content). In adaptive mode (PRD-4 v1.1 §4.7), a
   * single-topic adaptive session takes over — content pages around the
   * adaptive session are NOT rendered in this slice (Phase 4d-iii adds
   * that for the (adaptive, linear_by_topics) combo; router adaptive
   * fires the engine directly and returns to router on completion).
   * Picking a completed topic is a no-op (button also disabled).
   */
  function selectRouterTopic(topicId) {
    if (!isRouterMode()) return;
    if (state.routerTopicStates[topicId] === "completed") return;
    // Record the router hub on the nav route BEFORE mutating state, so the
    // topic's «Назад» (section-intro / first page) returns to the hub instead of
    // dead-ending at the rebuilt chunk's index 0. Captures the clean hub state
    // (this topic not yet 'inProgress', currentRouterTopic still null).
    if (typeof pushNavHistory === "function") pushNavHistory();
    state.routerTopicStates[topicId] = "inProgress";
    state.currentRouterTopic = topicId;
    // PRD-8 FR-18: section selection event for diagnostics + template
    // hooks (e.g. transition animations).
    emitRouterEvent("router:sectionSelected", { topicId: topicId });

    // PRD-4 v1.1 §3.2 (Phase 4e): start the per-section timer on entry.
    // Stopped by returnFromTopic (normal completion) or by the timer's
    // own expiry handler. Sections without a custom limit (null/inherit_test)
    // skip startSectionTimer's no-op early return.
    var section = (TEST_DATA.sections || []).find(function (s) {
      return s.topicId === topicId;
    });
    if (
      section &&
      section.timeLimitMinutes &&
      typeof startSectionTimer === "function"
    ) {
      startSectionTimer(topicId, section.timeLimitMinutes, function () {
        // On expiry mark the topic completed (with whatever was answered)
        // and return to the router. The completion still feeds the
        // sectionResults snapshot via Phase 4b on the next render — for
        // adaptive sessions the AdaptiveSession callback has already
        // populated it.
        returnFromTopic();
      });

    var currentTopicId = state.currentTopicId || "";

    // Build sections array for {{#each sections}} in topic-nav partial
    var sections = (course.topics || []).map(function (t) {
      var cls = t.status === "completed" ? "is-complete" :
                (t.id === currentTopicId || t.status === "available") ? "is-active" : "is-locked";
      return { id: t.id, title: t.title || "", className: cls };
    });

    return {
      course:   course,
      runtime:  runtime,
      result:   runtime.result   || {},
      progress: runtime.progress || {},
      state:    state,
      params:   expandParams(demoData.params || paramDefaults()),

      },

        results: { kicker: "Результаты теста" }
      }

  }

  // ─── TEST_DATA for contentPage.js / renderers.js ────────────────────────────
  function buildTestData() {
    var runtime = demoData.runtime || {};
    var course = demoData.course || {};
    var sections = (course.topics || []).map(function (t) {
      return {
        topicId: t.id,
        topicName: t.title || "",
        topicDescription: t.description || null,
        required: t.required !== false,
        timeLimitMinutes: t.timeLimitMinutes || null,

      };
