  "content": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow tb-scene__brandrow--center\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      {{#if page.pageLabel}}<div class=\"tb-scene__headtag\"><span class=\"ou-tag ou-tag--neutral\" data-path=\"page.pageLabel\"></span></div>{{/if}}\n      <div class=\"tb-scene__timers\">\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"timer-display\">\n          <span class=\"ou-timer__lbl\">тест</span><span class=\"ou-timer__num\"></span>\n        </div>\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"section-timer-display\">\n          <span class=\"ou-timer__lbl\">раздел</span><span class=\"ou-timer__num\"></span>\n        </div>\n      </div>\r\n    </div>\r\n    {{#if page.pageLabel}}<div class=\"tb-scene__progress\"><div class=\"tb-scene__progress-fill\" style=\"width:{{page.progressPercent}}%\"></div></div>{{/if}}\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body tb-content-body\">\r\n    <div class=\"tb-content\" data-slot=\"page-content\"></div>\r\n  </main>\r\n  <footer class=\"tb-scene__foot\">\r\n    {{#if page.canGoBack}}<button type=\"button\" class=\"ou-btn ou-btn--ghost ou-btn--m\" data-nav=\"prev\">Назад</button>{{/if}}\r\n    <div class=\"tb-scene__foot-spacer\"></div>\r\n    <button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-nav=\"next\"{{#if page.nextDisabled}} disabled aria-disabled=\"true\"{{/if}}>{{page.nextLabel}}</button>\r\n  </footer>\r\n</div>\r\n",
  "question": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__timers\">\r\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"timer-display\">\r\n          <span class=\"ou-timer__lbl\">тест</span><span class=\"ou-timer__num\"></span>\r\n        </div>\r\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"section-timer-display\">\r\n          <span class=\"ou-timer__lbl\">раздел</span><span class=\"ou-timer__num\"></span>\r\n        </div>\r\n      </div>\r\n    </div>\r\n    {{#if state.questionsProgress}}\r\n    <div class=\"ou-quiz ou-quiz--circle ou-quiz--m tb-scene__map\" role=\"group\" aria-label=\"Карта вопросов\">\r\n      <div class=\"ou-quiz__dots\">\r\n        {{#each state.questionsProgress.states}}\r\n        <button type=\"button\" class=\"ou-quiz__dot {{statusClass}}\" {{#unless clickable}}disabled{{/unless}} data-action=\"goto:{{index}}\" aria-label=\"{{ariaLabel}}\">{{number}}</button>\r\n        {{/each}}\r\n      </div>\r\n      <div class=\"ou-quiz__legend\">\r\n        <span class=\"ou-quiz__legend-item\"><span class=\"ou-quiz__legend-dot is-flagged\"></span>пропущен</span>\r\n        <span class=\"ou-quiz__legend-item\"><span class=\"ou-quiz__legend-dot is-current\"></span>текущий</span>\r\n        <span class=\"ou-quiz__legend-item\"><span class=\"ou-quiz__legend-dot\"></span>не отвечен</span>\r\n        <span class=\"ou-quiz__legend-item\"><span class=\"ou-quiz__legend-dot is-answered\"></span>отвечен</span>\r\n      </div>\r\n      <span class=\"tb-scene__mapcount tb-scene__mapcount--answered\">отвечено <strong>{{state.questionsProgress.answeredCount}}</strong> из {{state.questionsProgress.total}}</span>\r\n      <span class=\"tb-scene__mapcount tb-scene__mapcount--skipped\">пропущено {{state.questionsProgress.skippedCount}}</span>\r\n    </div>\r\n    {{/if}}\r\n    <div class=\"tb-scene__progress\"><div class=\"tb-scene__progress-fill\" id=\"q-progress-fill\"></div></div>\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col\" style=\"--tb-question-fs: {{state.questionFont}}; --tb-answer-fs: {{state.optionFont}}\">\r\n      <div class=\"tb-scene__meta\">\r\n        <span data-path=\"state.questionCounterLabel\"></span>\r\n        {{#if state.sectionName}}<span class=\"ou-tag ou-tag--neutral\" data-path=\"state.sectionName\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__q\">\r\n        <h2 class=\"tb-scene__qtitle\" data-slot=\"question-text\"></h2>\r\n        {{#if state.questionHint}}<span class=\"tb-scene__qhint\" data-path=\"state.questionHint\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-qbody\">\r\n        <div class=\"tb-qbody__media\" data-slot=\"question-media\"></div>\r\n        <div class=\"tb-qbody__answers\">\r\n          <div data-slot=\"question-feedback\"></div>\r\n          <div data-slot=\"question-interaction\"></div>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  </main>\r\n\r\n  <!-- Navigation row. Composition is the TEMPLATE's decision; the host only supplies\r\n       `state.nav` (see shared/template/question-nav). Both hosts render this markup,\r\n       so the footer cannot differ between the web run and the package. -->\r\n  <footer class=\"tb-scene__foot\">\r\n    {{#if state.nav.showBack}}<button type=\"button\" class=\"ou-btn ou-btn--ghost ou-btn--m\" data-action=\"answer-back\" {{#unless state.nav.canPrev}}disabled{{/unless}}>← Назад</button>{{/if}}\r\n    {{#if state.nav.showSkip}}<button type=\"button\" class=\"ou-btn ou-btn--ghost ou-btn--m\" data-action=\"answer-skip\">Пропустить</button>{{/if}}\r\n    {{#if state.nav.showReview}}<button type=\"button\" class=\"ou-btn ou-btn--ghost ou-btn--m\" data-action=\"answer-return\">К обзору</button>{{/if}}\r\n    <div class=\"tb-scene__foot-spacer\"></div>\r\n    <button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"{{state.nav.primaryAction}}\" {{#unless state.nav.primaryEnabled}}disabled{{/unless}} data-path=\"state.nav.primaryLabel\"></button>\r\n  </footer>\r\n</div>\r\n",
  "results": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__headtag\"><span class=\"ou-tag {{ result.passClass }}\" data-path=\"result.statusLabel\"></span></div>\r\n    </div>\r\n    <div class=\"tb-scene__progress\"><div class=\"tb-scene__progress-fill\" style=\"width: {{result.scorePercent}}%\"></div></div>\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col tb-scene__col--wide\">\r\n      <div class=\"tb-score-strip\">\r\n        <div class=\"ou-ring tb-ring\">\r\n          <svg class=\"ou-ring__svg\" width=\"140\" height=\"140\" viewBox=\"0 0 140 140\">\r\n            <circle class=\"ou-ring__track\" cx=\"70\" cy=\"70\" r=\"63\" stroke-width=\"12\"></circle>\r\n            <circle class=\"ou-ring__fill {{ result.passClass }}\" cx=\"70\" cy=\"70\" r=\"63\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"395.84\" stroke-dashoffset=\"{{ result.ringDashoffset }}\"></circle>\r\n          </svg>\r\n          <div class=\"ou-ring__center\">\r\n            <div class=\"ou-ring__value\"><span data-path=\"result.scorePercent\"></span>%</div>\r\n            <div class=\"ou-ring__label\">баллы</div>\r\n          </div>\r\n        </div>\r\n        <div class=\"tb-facts\">\r\n          <div class=\"tb-facts__item\"><div class=\"tb-facts__num\" data-path=\"result.totalQuestions\"></div><div class=\"tb-facts__lbl\">вопросов</div></div>\r\n          <div class=\"tb-facts__item\"><div class=\"tb-facts__num\"><span data-path=\"result.correct\"></span>/<span data-path=\"result.totalQuestions\"></span></div><div class=\"tb-facts__lbl\">верно</div></div>\r\n          <div class=\"tb-facts__item\"><div class=\"tb-facts__num\" data-path=\"result.earnedPoints\"></div><div class=\"tb-facts__lbl\">баллов</div></div>\r\n        </div>\r\n      </div>\r\n\r\n      {{#if result.topicResults}}\r\n      <hr class=\"ou-separator ou-separator--horizontal\">\r\n      <div class=\"tb-scene__q\"><h3 class=\"tb-scene__subhead\">Результаты по темам</h3></div>\r\n      <div class=\"tb-topics-grid\">\r\n        {{#each result.topicResults}}\r\n        <div class=\"ou-card tb-topic-card\">\r\n          <div class=\"ou-card__body\">\r\n            <span class=\"tb-topic-card__name\">{{topicName}}</span>\r\n            <span class=\"ou-tag ou-tag--s {{passClass}}\">{{statusLabel}}</span>\r\n            <div class=\"ou-progress ou-progress--s tb-topic-card__bar {{passClass}}\"><div class=\"ou-progress__track\"><div class=\"ou-progress__fill\" style=\"width: {{percent}}%\"></div></div></div>\r\n            <div class=\"tb-stat-rows\">\r\n              <div class=\"ou-stat-row ou-stat-row--compact\"><div class=\"ou-stat-row__body\"><div class=\"ou-stat-row__title\">Правильно</div></div><span class=\"tb-stat-val\">{{correct}} / {{total}}</span></div>\r\n              {{#if pointsLabel}}<div class=\"ou-stat-row ou-stat-row--compact\"><div class=\"ou-stat-row__body\"><div class=\"ou-stat-row__title\">Баллов</div></div><span class=\"tb-stat-val\">{{pointsLabel}}</span></div>{{/if}}\r\n            </div>\r\n            {{#if requiredLabel}}<span class=\"tb-topic-card__req\">{{requiredLabel}}</span>{{/if}}\r\n            {{#if hasFeedback}}\r\n            <div class=\"tb-topic-card__fb\">\r\n              <span class=\"tb-topic-card__fb-text\">{{feedback}}</span>\r\n              {{#if hasRecommendations}}<div class=\"tb-recs\">{{#each recommendedCourses}}<a class=\"tb-rec\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></span>{{title}}</a>{{/each}}{{#each recommendedEvents}}<span class=\"tb-rec\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"M8 14h.01\"/><path d=\"M12 14h.01\"/><path d=\"M16 14h.01\"/><path d=\"M8 18h.01\"/><path d=\"M12 18h.01\"/><path d=\"M16 18h.01\"/></svg></span>{{title}}</span>{{/each}}</div>{{/if}}\r\n            </div>\r\n            {{/if}}\r\n            {{#unless hasFeedback}}{{#if hasRecommendations}}\r\n            <div class=\"tb-topic-card__fb\">\r\n              <div class=\"tb-recs\">{{#each recommendedCourses}}<a class=\"tb-rec\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></span>{{title}}</a>{{/each}}{{#each recommendedEvents}}<span class=\"tb-rec\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"M8 14h.01\"/><path d=\"M12 14h.01\"/><path d=\"M16 14h.01\"/><path d=\"M8 18h.01\"/><path d=\"M12 18h.01\"/><path d=\"M16 18h.01\"/></svg></span>{{title}}</span>{{/each}}</div>\r\n            </div>\r\n            {{/if}}{{/unless}}\r\n          </div>\r\n        </div>\r\n        {{/each}}\r\n      </div>\r\n      {{/if}}\r\n    </div>\r\n  </main>\r\n\r\n  <!-- Footer of the results screen. Composition is the TEMPLATE's decision; hosts\r\n       only fill `result.nav` (see shared/template/results-nav) and bind the actions.\r\n       `result.backAction` is the legacy single-button form kept for contexts that\r\n       do not build `nav` (host previews). -->\r\n  <footer class=\"tb-scene__foot\">\r\n    {{#if result.nav.showReport}}<button type=\"button\" class=\"ou-btn ou-btn--secondary ou-btn--m\" data-action=\"download-report\">Скачать отчёт</button>{{/if}}\r\n    <div class=\"tb-scene__foot-spacer\"></div>\r\n    {{#if result.nav.canRetry}}<button type=\"button\" class=\"ou-btn ou-btn--secondary ou-btn--l\" data-action=\"restart\">Пройти заново</button>{{/if}}\r\n    {{#if result.nav}}<button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"{{result.nav.primaryAction}}\">{{result.nav.primaryLabel}}</button>{{/if}}\r\n    {{#unless result.nav}}\r\n      {{#if result.backAction}}<button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"{{result.backAction}}\">{{result.backLabel}}</button>{{/if}}\r\n      {{#unless result.backAction}}<button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"restart\">Пройти снова</button>{{/unless}}\r\n    {{/unless}}\r\n  </footer>\r\n</div>\r\n",
  "results.adaptive": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow tb-scene__brandrow--center\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__headtag\"><span class=\"ou-tag ou-tag--neutral\">Тест завершён</span></div>\r\n    </div>\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col tb-scene__col--wide\">\r\n      <div class=\"tb-adaptive-hero\">\r\n        <span class=\"tb-adaptive-hero__icon\" aria-hidden=\"true\">\r\n          <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 10 12 5 2 10l10 5 10-5Z\"/><path d=\"M6 12v5c3 3 9 3 12 0v-5\"/></svg>\r\n        </span>\r\n        <h2 class=\"tb-scene__hero tb-scene__hero--s\">Тест завершён</h2>\r\n        <span class=\"tb-scene__lead\">Адаптивный тест подобрал уровень по каждой теме</span>\r\n      </div>\r\n\r\n      {{#if result.topicResults}}\r\n      <div class=\"tb-scene__q\"><h3 class=\"tb-scene__subhead\">Результаты по темам</h3></div>\r\n      <div class=\"tb-topics-grid\">\r\n        {{#each result.topicResults}}\r\n        <div class=\"ou-card tb-topic-card\">\r\n          <div class=\"ou-card__body\">\r\n            <span class=\"tb-topic-card__name\">{{topicName}}</span>\r\n            <span class=\"ou-tag ou-tag--s {{levelClass}}\">{{levelLabel}}</span>\r\n            {{#if hasFeedback}}\r\n            <div class=\"tb-topic-card__fb\">\r\n              <span class=\"tb-topic-card__fb-text\">{{feedback}}</span>\r\n              {{#if hasRecommendations}}<div class=\"tb-recs\">{{#each recommendedCourses}}<a class=\"tb-rec\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></span>{{title}}</a>{{/each}}{{#each recommendedEvents}}<span class=\"tb-rec\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"M8 14h.01\"/><path d=\"M12 14h.01\"/><path d=\"M16 14h.01\"/><path d=\"M8 18h.01\"/><path d=\"M12 18h.01\"/><path d=\"M16 18h.01\"/></svg></span>{{title}}</span>{{/each}}</div>{{/if}}\r\n            </div>\r\n            {{/if}}\r\n            {{#unless hasFeedback}}{{#if hasRecommendations}}\r\n            <div class=\"tb-topic-card__fb\">\r\n              <div class=\"tb-recs\">{{#each recommendedCourses}}<a class=\"tb-rec\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></span>{{title}}</a>{{/each}}{{#each recommendedEvents}}<span class=\"tb-rec\"><span class=\"tb-rec__ico\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"M8 14h.01\"/><path d=\"M12 14h.01\"/><path d=\"M16 14h.01\"/><path d=\"M8 18h.01\"/><path d=\"M12 18h.01\"/><path d=\"M16 18h.01\"/></svg></span>{{title}}</span>{{/each}}</div>\r\n            </div>\r\n            {{/if}}{{/unless}}\r\n          </div>\r\n        </div>\r\n        {{/each}}\r\n      </div>\r\n      {{/if}}\r\n    </div>\r\n  </main>\r\n\r\n  <!-- Footer of the adaptive results screen. `result.canRetry` / `showFinish` are the\r\n       PACKAGE's action flags; the WEB host fills `result.nav` instead (see\r\n       shared/template/results-nav), and its «Пройти снова» obeys `nav.canRetake` —\r\n       ATTEMPTS ONLY, since re-running an adaptive test stays meaningful after a pass;\r\n       past the cap the server answers ATTEMPTS_EXHAUSTED and the button would be dead.\r\n       The web's exit stays `result.showBack`. -->\r\n  <footer class=\"tb-scene__foot\">\r\n    {{#if result.showBack}}<button type=\"button\" class=\"ou-btn ou-btn--ghost ou-btn--m\" data-action=\"results-back\">← К списку тестов</button>{{/if}}\r\n    {{#if result.nav.showReport}}<button type=\"button\" class=\"ou-btn ou-btn--secondary ou-btn--m\" data-action=\"download-report\">Скачать отчёт</button>{{/if}}\r\n    <div class=\"tb-scene__foot-spacer\"></div>\r\n    {{#if result.canRetry}}<button type=\"button\" class=\"ou-btn ou-btn--secondary ou-btn--l\" data-action=\"restart-adaptive\">Пройти заново</button>{{/if}}\r\n    {{#if result.showFinish}}<button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"finish\">Завершить тест</button>{{/if}}\r\n    {{#unless result.hasScormActions}}{{#if result.nav.canRetake}}<button type=\"button\" class=\"ou-btn ou-btn--primary ou-btn--l\" data-action=\"restart\">Пройти снова</button>{{/if}}{{/unless}}\r\n  </footer>\r\n</div>\r\n",
  "review": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__timers\">\r\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"timer-display\">\r\n          <span class=\"ou-timer__lbl\">тест</span><span class=\"ou-timer__num\"></span>\r\n        </div>\r\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"section-timer-display\">\r\n          <span class=\"ou-timer__lbl\">раздел</span><span class=\"ou-timer__num\"></span>\r\n        </div>\r\n      </div>\r\n    </div>\r\n    <!-- The question map is NOT repeated in the review header — the body carries its\r\n         own (larger) map and the answered/skipped counts, so a header copy would\r\n         duplicate it. -->\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col\">\r\n      <div class=\"tb-scene__q\">\r\n        <h2 class=\"tb-scene__hero tb-scene__hero--s\">{{ review.scopeLabel }}</h2>\r\n        <span class=\"tb-scene__qhint\">{{ review.hint }}</span>\r\n      </div>\r\n\r\n      {{#if state.questionsProgress}}\r\n      <div class=\"ou-quiz ou-quiz--circle ou-quiz--l tb-review-map\" role=\"group\" aria-label=\"Карта вопросов\">\r\n        <div class=\"ou-quiz__dots\">\r\n          {{#each state.questionsProgress.states}}\r\n          <button type=\"button\" class=\"ou-quiz__dot {{statusClass}}\" {{#unless clickable}}disabled{{/unless}} data-action=\"goto:{{index}}\" aria-label=\"{{ariaLabel}}\">{{number}}</button>\r\n          {{/each}}\r\n        </div>\r\n   "section-results": "<div class=\"tb-scene\">\n  <header class=\"tb-scene__header\">\n    <div class=\"tb-scene__brandrow tb-scene__brandrow--center\">\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\n      <div class=\"tb-scene__titles\">\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\n      </div>\n      {{#if sectionResult.sectionLabel}}<div class=\"tb-scene__headtag\"><span class=\"ou-tag ou-tag--neutral\" data-path=\"sectionResult.sectionLabel\"></span></div>{{/if}}\n      <div class=\"tb-scene__timers\">\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"timer-display\">\n          <span class=\"ou-timer__lbl\">тест</span><span class=\"ou-timer__num\"></span>\n        </div>\n        <div class=\"ou-timer ou-timer--digital ou-timer--s q-timer--hidden\" id=\"section-timer-display\">\n          <span class=\"ou-timer__lbl\">раздел</span><span class=\"ou-timer__num\"></span>\n        </div>\n      </div>\n    </div>\n    {{#if sectionResult.sectionLabel}}<div class=\"tb-scene__progress\"><div class=\"tb-scene__progress-fill\" style=\"width:{{sectionResult.progressPercent}}%\"></div></div>{{/if}}\n  </header>\n\n  <main class=\"tb-scene__body\">\n    <div class=\"tb-scene__col tb-scene__col--center tb-scene__col--narrow\">\n      <span class=\"tb-eyebrow\">Итоги раздела</span>\n      <h2 class=\"tb-scene__hero tb-scene__hero--s\">Раздел «<span data-path=\"sectionResult.topicName\"></span>»</h2>\n\n      <div class=\"ou-ring tb-ring\">\n        <svg class=\"ou-ring__svg\" width=\"140\" height=\"140\" viewBox=\"0 0 140 140\">\n          <circle class=\"ou-ring__track\" cx=\"70\" cy=\"70\" r=\"63\" stroke-width=\"12\"></circle>\n          <circle class=\"ou-ring__fill {{ sectionResult.passClass }}\" cx=\"70\" cy=\"70\" r=\"63\" st   "system.blocked": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow tb-scene__brandrow--center\">\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        <span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>\r\n      </div>\r\n      <div class=\"tb-scene__headtag\"><span class=\"ou-tag ou-tag--neutral\">Доступ ограничен</span></div>\r\n    </div>\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col tb-scene__col--center tb-scene__col--narrow\" data-testid=\"retake-wall\">\r\n      <span class=\"tb-blocked-icon\" role=\"img\" aria-label=\"Доступ ограничен\">\r\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg>\r\n      </span>\r\n      <div class=\"tb-blocked-branch\" data-retake-branch=\"default\">\r\n        <h2 class=\"tb-scene__hero tb-scene__hero--s\">Доступ к тесту ограничен</h2>\r\n        <span class=\"tb-scene__lead\">Для этого теста больше нет доступных попыток.</span>\r\n      </div>\r\n      <div class=\"tb-blocked-branch\" data-retake-branch=\"cooldown\" hidden>\r\n        <h2 class=\"tb-scene__hero tb-scene__hero--s\">Повторное прохождение пока недоступно</h2>\r\n        <span class=\"tb-scene__lead\">Этот курс можно проходить не чаще, чем раз в <span data-path=\"retake.cooldownPeriodDays\">&mdash;</span> дн.</span>\r\n        <span class=\"tb-scene__lead\" data-retake-available>Повторный запуск будет доступен с <strong data-path=\"retake.availableDateHuman\">&mdash;</strong>.</span>\r\n      </div>\r\n      <div class=\"tb-blocked-branch\" data-retake-branch=\"error\" hidden>\r\n        <h2 class=\"tb-scene__hero tb-scene__hero--s\">Не удалось проверить доступ</h2>\r\n        <span cla   "system.transition": "<div class=\"tb-scene\">\r\n  <header class=\"tb-scene__header\">\r\n    <div class=\"tb-scene__brandrow tb-scene__brandrow--center\">\r\n      {{#if design.logoUrl}}<span class=\"tb-scene__logo\"><img src=\"{{ design.logoUrl }}\" alt=\"\"></span>{{/if}}\r\n      <div class=\"tb-scene__titles\">\r\n        <h1 class=\"tb-scene__title\" data-path=\"course.title\"></h1>\r\n        {{#if course.subtitle}}<span class=\"tb-scene__subtitle\" data-path=\"course.subtitle\"></span>{{/if}}\r\n      </div>\r\n      <div class=\"tb-scene__headtag\"><span class=\"ou-tag ou-tag--neutral\">Адаптивный тест</span></div>\r\n    </div>\r\n  </header>\r\n\r\n  <main class=\"tb-scene__body\">\r\n    <div class=\"tb-scene__col tb-scene__col--center tb-scene__col--narrow\">\r\n      <span class=\"tb-transition-icon {{ transition.level.class }}\" aria-hidden=\"true\">\r\n        {{#if transition.level.isUp}}<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"/></svg>{{/if}}\r\n        {{#if transition.level.isDown}}<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12l7 7 7-7\"/></svg>{{/if}}\r\n        {{#if transition.level.isComplete}}<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 12 2 2 4-4\"/></svg>{{/if}}\r\n      </span>\r\n      {{#if transition.topicName}}<span class=\"tb-eyebrow\">Тема «<span data-path=\"transition.topicName\"></span>»</span>{{/if}}\r\n      <h2 class=\"tb-scene__hero tb-scene__hero--s\">{{ transition.title }}</h2>\r\n      <span class=\"tb-scene__lead\" data-path=\"transition.level.message\"></span>\r\n <script>/* server\scorm\template\app\templateCore.js */
/**
 * @module templateCore
 * @description TestBuilder Runtime Core — CSS variable application, placeholder
 * rendering, textFit modes, autoAdvance timer, and the window.TestBuilder API
 * consumed by design template scripts.
 *
 * Pure helper functions are exposed on TestBuilder._internal so they can be
 * unit-tested without a live DOM or SCORM session.
 */
(function (root) {
  "use strict";

  // ─── Path resolver ────────────────────────────────────────────────────────

  /**
   * Resolves a dot-notation path in an object.
   * @param {object} obj
   * @param {string} path
   * @returns {*}
   */
  function resolvePath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // ─── CSS variables ────────────────────────────────────────────────────────

  /**
   * Builds a { "--css-var": "value" } map from effective params and the

  if (tb && tb._internal) tb._internal.cancelAutoAdvance();

    // Mount directly into #app (no wrapper) so .tb-pad > .tb-scene fills

      context: {
        course: {
          title: (typeof TEST_DATA !== "undefined" ? TEST_DATA.title : ""),

        // Per-test branding: the shared header binds `{{#if design.logoUrl}}`, so a
        // content page must carry `design` too or the logo goes missing on it.

      if (typeof ri === "number") rightToLeft[ri] = li;
    });

    var html = '<div class="matching-board" data-qid="' + escapeHtml(q.id) + '">';
    var poolSlot = 0;

    pairs.forEach(function (pair, rightIdx) {
      var matchedLeft = rightToLeft.hasOwnProperty(rightIdx) ? rightToLeft[rightIdx] : null;
      var isJoined = (matchedLeft !== null);

      html += '<div class="matching-line' + (isJoined ? " is-joined" : "") +
        '" data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">';

      if (isJoined) {
        // Left slot contains a matched chip
        html += '<div class="match-tile match-left-slot match-drop-left"' +
          ' data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">';
        html += '<div class="match-chip" draggable="true"' +
          ' data-qid="' + escapeHtml(q.id) +
          '" data-left="' + matchedLeft +
          '" data-from="match" data-right="' + rightIdx + '">' +
          escapeHtml(pairs[matchedLeft].left) + '</div>';
        html += '</div>';
      } else {
        var poolLeft = (poolSlot < pool.length) ? pool[poolSlot] : null;
        if (poolLeft !== null && poolLeft !== undefined) {
          // Left slot has a pool chip
          html += '<div class="match-tile match-left-slot match-drop-left"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-right="' + rightIdx +
            '" data-pool-slot="' + poolSlot + '">';
          html += '<div class="match-chip" draggable="true"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-left="' + poolLeft +
            '" data-from="pool" data-pool-index="' + poolSlot + '">' +
            escapeHtml(pairs[poolLeft].left) + '</div>';
          html += '</div>';
        } else {
          // Empty slot
          html += '<div class="match-empty match-left-slot match-drop-left"' +
            ' data-qid="' + escapeHtml(q.id) +
            '" data-right="' + rightIdx +
            '" data-pool-slot="' + poolSlot + '">' +
            '<span class="slot-placeholder">Перетащите вариант</span>' +
            '</div>';
        }
        poolSlot++;
      }

      html += '<div class="matching-gap"></div>';

      html += '<div class="match-tile match-right-tile match-drop-right"' +
        ' data-qid="' + escapeHtml(q.id) + '" data-right="' + rightIdx + '">' +
        escapeHtml(pairs[rightIdx].right) + '</div>';

      html += '</div>'; // .matching-line
    });

    html += '</div>'; // .matching-board
    html += '<div class="navigation"><button type="button" class="btn" data-action="answer-submit">Принять ответ</button><button type="button" class="btn" data-nav="next">Далее</button></div>';
    return html;
  }

  // ─── Ranking: grip-based drag-and-drop ───────────────────────────────────────

  /** Per-question ranking state: ordered array of item indices. */
  var _rankingState = {};

  function getRankingState(q) {
    var qid = q.id;
    if (!_rankingState[qid]) {
      var opts = q.options || [];
      _rankingState[qid] = opts.map(function (_, i) { return i; });
    }
    return _rankingState[qid];
  }

  /** Rebuilds the [data-slot="question-interaction"] content for a ranking question. */
  function rerenderRankingBoard(q) {
    var slot = document.querySelector('[data-slot="question-interaction"]');
    if (slot) slot.innerHTML = buildRankingHtml(q);
  }

  /**
   * Builds grip-based DnD ranking HTML matching pre-PRD1 structure.
   * Layout: .ranking-board > .rank-item.rank-draggable > .rank-grip + .rank-text
   * demo data format: q.options = [{id, text}], state uses index ordering
   */
  function buildRankingHtml(q) {
    var opts = q.options || [];
    var order = getRankingState(q);
    var html = '<div class="ranking-board" data-qid="' + escapeHtml(q.id) + '">';
    order.forEach(function (itemIdx, pos) {
      var text = opts[itemIdx] ? opts[itemIdx].text : ("#" + itemIdx);
      html += '<div class="rank-item rank-draggable" draggable="true"' +
        ' data-qid="' + escapeHtml(q.id) + '"' +
        ' data-pos="' + pos + '"' +
        ' data-item="' + itemIdx + '">' +
        '<span class="rank-grip">' +
        '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<path d="M2.5 4.99524H17.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path>' +
        '<path d="M14.1667 9.9952H2.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path>' +
        '<path d="M2.5 14.9951H10.8333" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path>' +
        '</svg>' +
        '</span>' +
        '<span class="rank-text">' + escapeHtml(text) + '</span>' +
        '</div>';
    });
    html += '</div>'; // .ranking-board
    html += '<div class="navigation"><button type="button" class="btn" data-action="answer-submit">Принять ответ</button><button type="button" class="btn" data-nav="next">Далее</button></div>';
    return html;
  }

  // ─── Matching DnD (bound once on document) ───────────────────────────────────

  var _matchingDndBound = false;

  function bindMatchingDndOnce() {
    if (_matchingDndBound) return;
    _matchingDndBound = true;

    var _overEl = null;

    function closestCls(node, cls) {
      var el = node;
      while (el && el !== document) {
        if (el.classList && el.classList.contains(cls)) return el;
        el = el.parentNode;
      }
      return null;
    }

    function clearOver() {
      if (_overEl) _overEl.classList.remove("is-over");
      _overEl = null;
    }

    function setOver(el) {
      if (_overEl && _overEl !== el) _overEl.classList.remove("is-over");
      _overEl = el;
      if (el) el.classList.add("is-over");
    }

    function findQuestion(qid) {
      var questions = (demoData.course || {}).questions || [];
      for (var i = 0; i < questions.length; i++) {
        if (String(questions[i].id) === String(qid)) return questions[i];
      }
      return null;
    }

    function removeFromPool(pool, leftIdx, poolIndex) {
      if (typeof poolIndex === "number" && poolIndex >= 0 && poolIndex < pool.length && pool[poolIndex] === leftIdx) {
        return pool.splice(poolIndex, 1), poolIndex;
      }
      var idx = pool.indexOf(leftIdx);
      if (idx >= 0) pool.splice(idx, 1);
      return idx;
    }

    function insertIntoPool(pool, leftIdx, index) {
      var i = (typeof index === "number") ? index : pool.length;
      if (i < 0) i = 0;
      if (i > pool.length) i = pool.length;
      pool.splice(i, 0, leftIdx);
    }

    function leftForRight(answers, rightIdx) {
      var keys = Object.keys(answers);
      for (var i = 0; i < keys.length; i++) {
        if (answers[keys[i]] === rightIdx) return parseInt(keys[i], 10);
      }
      return null;
    }

    function deleteAnswer(answers, leftIdx) {
      delete answers[leftIdx];
      delete answers[String(leftIdx)];
    }

    function parsePayload(e) {
      var payload = null;
      try { payload = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) {}
      if (payload && payload.qid) return payload;
      var raw = "";
      try { raw = e.dataTransfer.getData("text/plain"); } catch (err) {}
      if (!raw) return null;
      var parts = raw.split("|");
      if (parts.length < 2) return null;
      var qid = parts[0];
      var leftIdx = parseInt(parts[1], 10);
      if (!qid || isNaN(leftIdx)) return null;
      payload = { qid: qid, leftIdx: leftIdx, from: parts[2] || "pool" };
      if (parts[3] !== undefined && parts[3] !== "") { var pi = parseInt(parts[3], 10); if (!isNaN(pi)) payload.poolIndex = pi; }
      if (parts[4] !== undefined && parts[4] !== "") { var ri = parseInt(parts[4], 10); if (!isNaN(ri)) payload.rightIdx = ri; }
      return payload;
    }

    document.addEventListener("dragstart", function (e) {
      var chip = closestCls(e.target, "match-chip");
      if (!chip) return;
      var qid = chip.getAttribute("data-qid");
      var left = parseInt(chip.getAttribute("data-left"), 10);
      if (!qid || isNaN(left)) return;
      var from = chip.getAttribute("data-from") || "pool";
      var payload = { qid: qid, leftIdx: left, from: from };
      var piStr = chip.getAttribute("data-pool-index");
      if (piStr !== null && piStr !== "") { var pi = parseInt(piStr, 10); if (!isNaN(pi)) payload.poolIndex = pi; }
      var riStr = chip.getAttribute("data-right");
      if (riStr !== null && riStr !== "") { var ri = parseInt(riStr, 10); if (!isNaN(ri)) payload.rightIdx = ri; }
      try {
        e.dataTransfer.setData("application/json", JSON.stringify(payload));
        e.dataTransfer.setData("text/plain",
          payload.qid + "|" + payload.leftIdx + "|" + payload.from + "|" +
          (payload.poolIndex !== undefined ? payload.poolIndex : "") + "|" +
          (payload.rightIdx !== undefined ? payload.rightIdx : ""));
        e.dataTransfer.effectAllowed = "move";
      } catch (err) {}
    });

    document.addEventListener("dragover", function (e) {
      var dropEl = closestCls(e.target, "match-drop-right") || closestCls(e.target, "match-drop-left");
      if (!dropEl) return;
      e.preventDefault();
      setOver(dropEl);
      try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
    });

    document.addEventListener("dragleave", function (e) {
      var dropEl = closestCls(e.target, "match-drop-right") || closestCls(e.target, "match-drop-left");
      if (!dropEl) return;
      if (_overEl === dropEl && (!e.relatedTarget || !dropEl.contains(e.relatedTarget))) clearOver();
    });

    document.addEventListener("drop", function (e) {
      clearOver();
      var rightDrop = closestCls(e.target, "match-drop-right");
      var leftDrop  = closestCls(e.target, "match-drop-left");
      var dropEl = rightDrop || leftDrop;
      if (!dropEl) return;
      e.preventDefault();

      var payload = parsePayload(e);
      if (!payload || !payload.qid || isNaN(payload.leftIdx)) return;

      var q = findQuestion(payload.qid);
      if (!q || q.type !== "matching") return;

      var ms = getMatchingState(q);
      var answers = ms.answers;
      var pool = ms.pool;

      var poolSlotStr = dropEl.getAttribute("data-pool-slot");
      var targetRightStr = dropEl.getAttribute("data-right");
      var isPoolDrop = (poolSlotStr !== null && poolSlotStr !== "");

      if (isPoolDrop) {
        // Dropped onto a left/pool slot
        var targetSlot = parseInt(poolSlotStr, 10);
        if (isNaN(targetSlot)) return;
        if (payload.from === "pool") {
          var removedAt = pool.indexOf(payload.leftIdx);
          removeFromPool(pool, payload.leftIdx, payload.poolIndex);
          if (removedAt >= 0 && removedAt < targetSlot) targetSlot--;
        } else {
          deleteAnswer(answers, payload.leftIdx);
        }
        insertIntoPool(pool, payload.leftIdx, targetSlot);
        rerenderMatchingBoard(q);
        return;
      }

      // Dropped onto a right slot
      var targetRight = parseInt(targetRightStr, 10);
      if (isNaN(targetRight)) return;

      if (payload.from === "pool") {
        removeFromPool(pool, payload.leftIdx, payload.poolIndex);
      } else {
        deleteAnswer(answers, payload.leftIdx);
      }

      // Displace any existing chip in this right slot → back to pool
      var oldLeft = leftForRight(answers, targetRight);
      if (oldLeft !== null && !isNaN(oldLeft)) {
        deleteAnswer(answers, oldLeft);
        insertIntoPool(pool, oldLeft,
          (payload.from === "pool" && typeof payload.poolIndex === "number") ? payload.poolIndex : pool.length);
      }

      answers[payload.leftIdx] = targetRight;
      rerenderMatchingBoard(q);
    });

    // Double-click a matched chip to return it to the pool
    document.addEventListener("dblclick", function (e) {
      var chip = closestCls(e.target, "match-chip");
      if (!chip || chip.getAttribute("data-from") !== "match") return;
      var qid = chip.getAttribute("data-qid");
      var leftIdx = parseInt(chip.getAttribute("data-left"), 10);
      if (!qid || isNaN(leftIdx)) return;
      var q = findQuestion(qid);
      if (!q || q.type !== "matching") return;
      var ms = getMatchingState(q);
      deleteAnswer(ms.answers, leftIdx);
      insertIntoPool(ms.pool, leftIdx, ms.pool.length);
      rerenderMatchingBoard(q);
    });
  }

  // ─── Ranking DnD (bound once on document) ────────────────────────────────────

  var _rankingDndBound = false;

  function bindRankingDndOnce() {
    if (_rankingDndBound) return;
    _rankingDndBound = true;

    var dragPayload = null;
    var _overEl = null;

    function closestCls(node, cls) {
      var el = node;
      while (el && el !== document) {
        if (el.classList && el.classList.contains(cls)) return el;
        el = el.parentNode;
      }
      return null;
    }

    function clearRankOver() {
      if (_overEl) _overEl.classList.remove("is-over");
      _overEl = null;
    }

    function setRankOver(el) {
      if (_overEl && _overEl !== el) _overEl.classList.remove("is-over");
      _overEl = el;
      if (el) el.classList.add("is-over");
    }

    function moveInArray(arr, from, to) {
      if (from === to) return arr;
      var copy = arr.slice();
      var item = copy.splice(from, 1)[0];
      copy.splice(to, 0, item);
      return copy;
    }

    function findQuestion(qid) {
      var questions = (demoData.course || {}).questions || [];
      for (var i = 0; i < questions.length; i++) {
        if (String(questions[i].id) === String(qid)) return questions[i];
      }
      return null;
    }

    document.addEventListener("dragstart", function (e) {
      var el = closestCls(e.target, "rank-draggable");
      if (!el) return;
      var qid = el.getAttribute("data-qid");
      var fromPos = parseInt(el.getAttribute("data-pos"), 10);
      var itemIdx = parseInt(el.getAttribute("data-item"), 10);
      if (!qid || isNaN(fromPos) || isNaN(itemIdx)) return;
      dragPayload = { qid: qid, fromPos: fromPos, itemIdx: itemIdx };
      el.classList.add("dragging");
      try {
        e.dataTransfer.setData("application/json", JSON.stringify(dragPayload));
        e.dataTransfer.effectAllowed = "move";
      } catch (err) {}
    });

    document.addEventListener("dragend", function (e) {
      var el = closestCls(e.target, "rank-draggable");
      if (el) el.classList.remove("dragging");
      dragPayload = null;
      clearRankOver();
    });

    document.addEventListener("dragover", function (e) {
      var over = closestCls(e.target, "rank-item");
      if (!over) return;
      e.preventDefault();
      setRankOver(over);
      try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
    });

    document.addEventListener("dragleave", function (e) {
      var over = closestCls(e.target, "rank-item");
      if (!over) return;
      if (_overEl === over && (!e.relatedTarget || !over.contains(e.relatedTarget))) clearRankOver();
    });

    document.addEventListener("drop", function (e) {
      clearRankOver();
      var over = closestCls(e.target, "rank-item");
      if (!over) return;
      e.preventDefault();

      var p = dragPayload;
      if (!p) {
        try { p = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) {}
      }
      if (!p) return;

      var qid = over.getAttribute("data-qid");
      if (!qid || qid !== p.qid) return;

      var toPos = parseInt(over.getAttribute("data-pos"), 10);
      if (isNaN(toPos)) return;

      var q = findQuestion(qid);
      if (!q || q.type !== "ranking") return;

      var order = getRankingState(q);
      _rankingState[qid] = moveInArray(order, p.fromPos, toPos);
      rerenderRankingBoard(q);
    });
  }

  // ─── Layout page rendering (start, results, system.blocked) ──────────────────
  function renderLayoutPage(layoutKey, data) {
    var app = getApp();
    if (!app) return;
    var html = layouts[layoutKey] || layouts["content"] || "";
    if (!html) { app.innerHTML = ""; return; }
    app.innerHTML = renderDsl(html, data);
    fillDataPaths(app, data);
    applyDataAttributes(app);
  }

  /** Applies data-ring-offset → CSS custom property, data-bar-width → fill width. */
  function applyDataAttributes(root) {
    root.querySelectorAll("[data-ring-offset]").forEach(function (el) {
      var v = el.getAttribute("data-ring-offset");
      if (v) el.style.setProperty("--ring-offset", v);
    });
    root.querySelectorAll("[data-bar-width]").forEach(function (el) {
      var v = el.getAttribute("data-bar-width");
      var fill = el.querySelector(".topic-bar-fill");
      if (fill && v) fill.style.width = v + "%";
    });
  }

  // ─── Progress bar ─────────────────────────────────────────────────────────────
  function updateProgress(route) {
    var fill = document.getElementById("tb-progress-fill");
    if (!fill) return;
    var pct = 0;
    if (route === "results") pct = 100;
    else if (route === "start") pct = 0;
    else {
      var routes = (manifest.preview || {}).routes || [];
      for (var i = 0; i < routes.length; i++) {
        if (routes[i].route === route) { pct = Math.round((i / (routes.length - 1)) * 100); break; }
      }
    }
    fill.style.width = pct + "%";
  }

  // ─── Caption ──────────────────────────────────────────────────────────────────
  function updateCaption(label) {
    var el = document.getElementById("pv-caption");
    if (el) el.textContent = label;
  }

  // ─── CSS vars ─────────────────────────────────────────────────────────────────
  function applyTemplateVars() {
    var tb = root.TestBuilder;
    if (!tb || !tb._internal) return;
    var params = demoData.params || paramDefaults();
    var vars = tb._internal.buildCssVarDeclarations(params, manifest.params || []);
    var stage = getStage();
    if (!stage) return;
    // Apply tokens as the RAW HSL components buildCssVarDeclarations returns (matching
    // the real host's buildTemplateCssVars). The template CSS composes them via
    // hsl(var(--token)); wrapping the triple in hsl() here would double-wrap it
    // (hsl(hsl(...)) → invalid), silently killing every hsl(var(--token)) rule.
    Object.keys(vars).forEach(function (name) {
      stage.style.setProperty(name, String(vars[name]));
    });
  }

  // ─── Theme toggle (preview chrome) ──────────────────────────────────────────
  /**
   * Wires the Авто/Светлая/Тёмная segmented control in the preview head: sets
   * data-theme on the document root (Авто removes it → the template follows the
   * host prefers-color-scheme). Only the previewed template (theme.css) reacts;
   * the preview chrome stays neutral.
   */
  function wireThemeToggle() {
    var group = document.getElementById("pv-theme");
    if (!group) return;
    function apply(mode) {
      var el = document.documentElement;
      if (mode === "light" || mode === "dark") el.setAttribute("data-theme", mode);
      else el.removeAttribute("data-theme");
      var btns = group.querySelectorAll(".pv-theme-btn");
      Array.prototype.forEach.call(btns, function (b) {
        b.classList.toggle("pv-theme-active", b.getAttribute("data-theme-set") === mode);
      });
    }
    group.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".pv-theme-btn") : null;
      if (b) apply(b.getAttribute("data-theme-set"));
    });
  }

  // ─── Init ────────────────────────────────────────────────────────────────────
  function init() {
    // Expose TEST_DATA for contentPage.js / renderers.js
    root.TEST_DATA = buildTestData();
    root.advancePageSequence = function () {};

    // Expose a minimal runtime state so the REAL content renderers
    // (renderContentPage / renderGalleryPage / renderSectionIntro) resolve template
    // layouts by key — mirrors production (templateLoader sets these). Without it,
    // content pages fall back to the bare skeleton, which no longer matches the
    // layout-driven runtime.
    root.state = root.state || {};
    root.state.templateLayouts = layouts;
    root.state.currentPageIndex = 0;
    root.state.templateManifest = manifest;
    // Router demo state: per-topic status for the router card map.
    root.state.routerTopicStates = {};
    ((demoData.course || {}).topics || []).forEach(function (t) {
      root.state.routerTopicStates[t.id] =
        t.status === "completed" ? "completed" :
        (t.status === "inProgress" ? "inProgress" : "notStarted");
    });

    // Init TestBuilder CSS vars
    if (root.TestBuilder && root.TestBuilder._init) {
      root.TestBuilder._init(manifest.params || []);
    }

    buildShell();
    applyTemplateVars();
    buildNav();
    wireThemeToggle();

    // Bind interaction handlers once at startup (global document listeners)
    bindChoiceClicksOnce();
    bindMatchingDndOnce();
    bindRankingDndOnce();

    // Navigate to default route
    var defaultRoute = (manifest.preview || {}).defaultRoute || "start";
    navigateTo(defaultRoute, null);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(window);
</script>
</body>
</html>
