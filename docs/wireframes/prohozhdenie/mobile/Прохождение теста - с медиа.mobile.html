<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../ui-kit/university-rt.css">
<style>html,body{margin:0;padding:0;background:#0b0d12}</style>
<title>Вопрос с медиа — телефон 360</title></head><body>
<div class="ou ou--dark ou--normal" style="width:360px;height:800px;margin:24px auto;overflow:hidden;font-family:var(--ou-font-family-base);display:flex;flex-direction:column;background:var(--ou-bg-page)" data-wf-demo>

  <header style="flex:none;position:relative;display:flex;flex-direction:column;gap:var(--ou-space-3);padding:var(--ou-space-3) 16px calc(var(--ou-space-2) + 2px);background:var(--ou-bg-elevated);border-bottom:1px solid var(--ou-border-soft)">
    <div style="display:flex;align-items:flex-start;flex-wrap:wrap;gap:var(--ou-space-3)">
      <span style="width:36px;height:36px;flex:none;border-radius:var(--ou-radius-m);background:var(--ou-accent-soft);color:var(--ou-accent-default);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">РТ</span>
      <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px">
        <h1 style="margin:0;font:var(--ou-text-heading-m);color:var(--ou-fg-default);text-wrap:pretty">Основы информационной безопасности</h1>
      </div>
    </div>
    <!-- Карта вопросов на телефоне СКРЫТА целиком (.tb-scene__map): переход к
         пропущенному вопросу идёт через экран обзора. В шапке остаются только
         счётчики — это освобождает около 90px под поле вопроса. -->
    <div style="display:flex;align-items:center;gap:var(--ou-space-3);font:var(--ou-text-body-s);color:var(--ou-fg-muted)">
      <span>отвечено <strong style="color:var(--ou-fg-default);font-weight:600">2</strong> из 8</span>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ou-bg-surface-3)"><div style="height:100%;width:31%;background:var(--ou-accent-default);border-radius:0 999px 999px 0"></div></div>
  </header>

  <main style="flex:1;min-height:0;overflow:auto;padding:16px">
    <div style="width:100%;min-height:100%;display:flex;flex-direction:column;gap:var(--ou-space-3)">
      <div style="display:flex;align-items:center;gap:var(--ou-space-3);font:var(--ou-text-body-s);color:var(--ou-fg-muted)"><span>Вопрос 3 из 8</span></div>
      <div style="display:flex;flex-direction:column;gap:var(--ou-space-2)">
        <h2 style="margin:0;font-weight:600;font-size:22px;line-height:1.25;letter-spacing:-.015em;color:var(--ou-fg-default);text-wrap:pretty">Что не так с этим письмом?</h2>
      </div>

      <!-- На телефоне сетка «медиа 5 / ответы 7» разворачивается в одну колонку:
           картинка сверху, варианты под ней. -->
      <div style="flex:1 0 auto;display:grid;grid-template-columns:1fr;gap:var(--ou-space-4);align-items:start">
        <div style="width:100%;aspect-ratio:3/2;border:1px solid var(--ou-border-soft);border-radius:var(--ou-radius-m);overflow:hidden;background:var(--ou-bg-surface-2);display:grid;place-items:center;color:var(--ou-fg-muted)">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </div>
        <div style="min-height:0;display:flex;flex-direction:column">
          <div class="ou-radio-group ou-radio-group--vertical" style="width:100%">
            <div class="ou-radio-group__items" style="gap:var(--ou-space-2);flex-direction:column">
              <label class="ou-radio-card" style="min-height:56px;align-items:center;gap:var(--ou-space-4);padding:var(--ou-space-3) var(--ou-space-4);box-sizing:border-box"><span class="ou-check__box" aria-hidden="true"></span><span class="ou-radio-card__title" style="font-size:17px;font-weight:400;line-height:1.35">Адрес отправителя подменён</span></label>
              <label class="ou-radio-card" style="min-height:56px;align-items:center;gap:var(--ou-space-4);padding:var(--ou-space-3) var(--ou-space-4);box-sizing:border-box"><span class="ou-check__box" aria-hidden="true"></span><span class="ou-radio-card__title" style="font-size:17px;font-weight:400;line-height:1.35">Требуют срочного действия</span></label>
              <label class="ou-radio-card" style="min-height:56px;align-items:center;gap:var(--ou-space-4);padding:var(--ou-space-3) var(--ou-space-4);box-sizing:border-box"><span class="ou-check__box" aria-hidden="true"></span><span class="ou-radio-card__title" style="font-size:17px;font-weight:400;line-height:1.35">Ссылка ведёт на чужой домен</span></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer style="flex:none;display:flex;align-items:stretch;flex-wrap:wrap;gap:var(--ou-space-2);padding:var(--ou-space-2) 16px;background:var(--ou-bg-elevated);border-top:1px solid var(--ou-border-soft)">
    <button type="button" class="ou-btn ou-btn--ghost ou-btn--m" style="flex:0 1 auto;padding-inline:var(--ou-space-3);font-size:13px">← Назад</button>
    <button type="button" class="ou-btn ou-btn--ghost ou-btn--m" style="flex:0 1 auto;padding-inline:var(--ou-space-3);font-size:13px">Пропустить</button>
    <div style="order:50;flex:0 0 100%;height:0"></div>
    <button type="button" class="ou-btn ou-btn--primary ou-btn--l" style="order:99;flex:1 0 100%">Отправить ответ</button>
  </footer>

</div>
</body></html>
