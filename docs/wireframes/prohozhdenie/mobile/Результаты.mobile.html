<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../ui-kit/university-rt.css">
<style>html,body{margin:0;padding:0;background:#0b0d12}</style>
<title>Результаты — телефон 360</title></head><body>
<div class="ou ou--dark ou--normal" style="width:360px;height:800px;margin:24px auto;overflow:hidden;font-family:var(--ou-font-family-base);display:flex;flex-direction:column;background:var(--ou-bg-page)" data-wf-demo>

  <header style="flex:none;position:relative;display:flex;flex-direction:column;gap:var(--ou-space-3);padding:var(--ou-space-3) 16px calc(var(--ou-space-2) + 2px);background:var(--ou-bg-elevated);border-bottom:1px solid var(--ou-border-soft)">
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--ou-space-3)">
      <span style="width:36px;height:36px;flex:none;border-radius:var(--ou-radius-m);background:var(--ou-accent-soft);color:var(--ou-accent-default);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">РТ</span>
      <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px">
        <h1 style="margin:0;font:var(--ou-text-heading-m);color:var(--ou-fg-default);text-wrap:pretty">Основы информационной безопасности</h1>
        <span style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">Попытка 1 из 3 · 30 июля</span>
      </div>
      <span class="ou-tag is-pass" style="flex:none;margin-left:auto;background:var(--ou-success-soft);color:var(--ou-success-on-soft)">Пройден</span>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ou-bg-surface-3)"><div style="height:100%;width:78%;background:var(--ou-accent-default);border-radius:0 999px 999px 0"></div></div>
  </header>

  <main style="flex:1;min-height:0;overflow:auto;padding:16px">
    <div style="width:100%;min-height:100%;display:flex;flex-direction:column;gap:var(--ou-space-3)">

      <div style="display:flex;align-items:center;gap:var(--ou-space-4);flex-wrap:wrap">
        <div class="ou-ring" style="width:112px;height:112px;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none">
          <svg class="ou-ring__svg" viewBox="0 0 140 140" width="112" height="112">
            <circle class="ou-ring__track" cx="70" cy="70" r="63" fill="none" stroke="var(--ou-bg-surface-3)" stroke-width="12"/>
            <circle class="ou-ring__fill ou-ring__fill--success is-pass" cx="70" cy="70" r="63" fill="none" stroke-width="12" stroke-dasharray="395.84" stroke-dashoffset="87"/>
          </svg>
          <span class="ou-ring__center" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <span class="ou-ring__value" style="font:var(--ou-text-heading-m);color:var(--ou-fg-default)">78%</span>
            <span class="ou-ring__label" style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">результат</span>
          </span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--ou-space-4) var(--ou-space-5);flex:1;min-width:0">
          <div><div style="font:var(--ou-text-heading-m);color:var(--ou-fg-default);line-height:1.1">14</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">верно</div></div>
          <div><div style="font:var(--ou-text-heading-m);color:var(--ou-fg-default);line-height:1.1">4</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">неверно</div></div>
          <div><div style="font:var(--ou-text-heading-m);color:var(--ou-fg-default);line-height:1.1">70%</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">порог</div></div>
        </div>
      </div>

      <hr class="ou-separator ou-separator--horizontal">

      <h2 style="margin:0;font:var(--ou-text-heading-s);color:var(--ou-fg-default)">Результаты по темам</h2>

      <div style="display:grid;grid-template-columns:1fr;gap:var(--ou-space-4)">
        <div class="ou-card">
          <div class="ou-card__body" style="display:flex;flex-direction:column;gap:var(--ou-space-2);align-items:flex-start">
            <span style="font:var(--ou-text-heading-s);color:var(--ou-fg-default)">Парольная политика</span>
            <div class="ou-progress ou-progress--s is-pass" style="width:100%;margin-top:var(--ou-space-1)"><div class="ou-progress__track"><div class="ou-progress__fill" style="width:83%;background:var(--ou-success-default)"></div></div></div>
            <span style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">5 из 6 · требуется 70%</span>
            <div style="display:flex;flex-direction:column;gap:var(--ou-space-2);width:100%;margin-top:var(--ou-space-2);padding-top:var(--ou-space-3);border-top:1px solid var(--ou-border-soft)">
              <span style="font:var(--ou-text-body-s);color:var(--ou-fg-soft)">Тема освоена. Повторите правила смены пароля.</span>
              <div style="display:flex;flex-wrap:wrap;gap:var(--ou-space-2)">
                <span style="display:inline-flex;align-items:center;gap:var(--ou-space-2);padding:var(--ou-space-1) var(--ou-space-3);border:1px solid var(--ou-border-soft);border-radius:var(--ou-radius-pill);background:var(--ou-bg-elevated);font:var(--ou-text-body-s);color:var(--ou-fg-default)">Памятка по паролям</span>
              </div>
            </div>
          </div>
        </div>
        <div class="ou-card">
          <div class="ou-card__body" style="display:flex;flex-direction:column;gap:var(--ou-space-2);align-items:flex-start">
            <span style="font:var(--ou-text-heading-s);color:var(--ou-fg-default)">Фишинг и социальная инженерия</span>
            <div class="ou-progress ou-progress--s is-fail" style="width:100%;margin-top:var(--ou-space-1)"><div class="ou-progress__track"><div class="ou-progress__fill" style="width:50%;background:var(--ou-error-default)"></div></div></div>
            <span style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">3 из 6 · требуется 70%</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer style="flex:none;display:flex;align-items:stretch;flex-wrap:wrap;gap:var(--ou-space-2);padding:var(--ou-space-2) 16px;background:var(--ou-bg-elevated);border-top:1px solid var(--ou-border-soft)">
    <button type="button" class="ou-btn ou-btn--secondary ou-btn--m" style="flex:0 1 auto;padding-inline:var(--ou-space-3);font-size:13px">Скачать отчёт</button>
    <div style="order:50;flex:0 0 100%;height:0"></div>
    <button type="button" class="ou-btn ou-btn--secondary ou-btn--l" style="flex:0 1 auto;padding-inline:var(--ou-space-3);font-size:13px">Пройти заново</button>
    <button type="button" class="ou-btn ou-btn--primary ou-btn--l" style="order:99;flex:1 0 100%">К списку тестов</button>
  </footer>

</div>
</body></html>
