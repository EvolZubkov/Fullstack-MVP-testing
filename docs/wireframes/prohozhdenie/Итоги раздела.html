<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui-kit/university-rt.css">
<style>html,body{margin:0;padding:0;height:100%}</style>
<title>Итоги раздела</title></head><body>
      <div class="ou ou--dark ou--normal" style="height:100%;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ou-font-family-base)">
      <header style="background:var(--ou-bg-elevated);border-bottom:1px solid var(--ou-border-soft);padding:var(--ou-space-4) 24px;display:flex;flex-direction:column;gap:var(--ou-space-3);position:relative">
        <div style="display:flex;align-items:center;gap:var(--ou-space-4)">
          <span style="width:44px;height:44px;flex:none;border-radius:var(--ou-radius-m);background:var(--ou-accent-soft);color:var(--ou-accent-default);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.02em">РТ</span>
          <div style="min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px"><h1 style="margin:0;font:var(--ou-text-display-s);color:var(--ou-fg-default);letter-spacing:-.01em;text-wrap:pretty">Основы информационной безопасности</h1><span style="font:var(--ou-text-body-s);color:var(--ou-fg-muted)">Обязательный курс · Попытка 1 из 2</span></div>
          <div style="margin-left:auto;flex:none;align-self:center"><span class="ou-tag ou-tag--neutral">Раздел 1 из 3</span></div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ou-bg-surface-3)"><div style="height:100%;width:33%;background:var(--ou-accent-default);border-radius:0 999px 999px 0"></div></div>
      </header>
      <main style="flex:1;min-height:0;overflow:auto;padding:24px">
        <div style="width:100%;max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--ou-space-5)">
          <span style="font:var(--ou-text-body-s);color:var(--ou-fg-muted);text-transform:uppercase;letter-spacing:.06em">Итоги раздела</span>
          <h2 style="margin:0;font-weight:600;font-size:28px;color:var(--ou-fg-default)">Раздел «Базовые угрозы»</h2>
          <div class="ou-ring" style="width:140px;height:140px;display:inline-flex;align-items:center;justify-content:center;position:relative"><svg class="ou-ring__svg" width="140" height="140" viewBox="0 0 140 140"><circle class="ou-ring__track" cx="70.0" cy="70.0" r="63.0" stroke-width="12"></circle><circle class="ou-ring__fill ou-ring__fill--success" cx="70.0" cy="70.0" r="63.0" stroke-width="12" stroke-dasharray="395.8" stroke-dashoffset="59.4"></circle></svg><div class="ou-ring__center"><div class="ou-ring__value">85%</div><div class="ou-ring__label">баллы</div></div></div>
          <span class="ou-tag ou-tag--success">Раздел зачтён</span>
          <div style="display:flex;gap:var(--ou-space-9);flex-wrap:wrap;justify-content:center"><div><div style="font:var(--ou-text-display-s);color:var(--ou-fg-default);line-height:1.1">6</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted);margin-top:var(--ou-space-1)">вопросов</div></div><div><div style="font:var(--ou-text-display-s);color:var(--ou-fg-default);line-height:1.1">5 / 6</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted);margin-top:var(--ou-space-1)">верно</div></div><div><div style="font:var(--ou-text-display-s);color:var(--ou-fg-default);line-height:1.1">5.0</div><div style="font:var(--ou-text-body-s);color:var(--ou-fg-muted);margin-top:var(--ou-space-1)">баллов</div></div></div>
        </div>
      </main>
      <footer style="background:var(--ou-bg-elevated);border-top:1px solid var(--ou-border-soft);padding:var(--ou-space-4) 24px;display:flex;align-items:center;gap:var(--ou-space-3)">
        
        <div style="margin-left:auto;display:flex;align-items:center;gap:var(--ou-space-3)"><button type="button" class="ou-btn ou-btn--primary ou-btn--l">Продолжить</button></div>
      </footer>
      </div>
</body></html>
